<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<style>
@font-face{font-family:P;font-weight:200;src:url(node_modules/pretendard/dist/web/static/woff2/Pretendard-ExtraLight.woff2)}
@font-face{font-family:P;font-weight:300;src:url(node_modules/pretendard/dist/web/static/woff2/Pretendard-Light.woff2)}
@font-face{font-family:P;font-weight:400;src:url(node_modules/pretendard/dist/web/static/woff2/Pretendard-Regular.woff2)}
@font-face{font-family:P;font-weight:500;src:url(node_modules/pretendard/dist/web/static/woff2/Pretendard-Medium.woff2)}
@font-face{font-family:P;font-weight:600;src:url(node_modules/pretendard/dist/web/static/woff2/Pretendard-SemiBold.woff2)}
@font-face{font-family:P;font-weight:700;src:url(node_modules/pretendard/dist/web/static/woff2/Pretendard-Bold.woff2)}
@font-face{font-family:P;font-weight:800;src:url(node_modules/pretendard/dist/web/static/woff2/Pretendard-ExtraBold.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;background:#000;overflow:hidden;font-family:P,sans-serif;color:#fff;word-break:keep-all}
#st{position:absolute;inset:0;overflow:hidden;background:#000}
#in{position:absolute;inset:0;transform-origin:50% 45%}
.num{font-variant-numeric:tabular-nums}
.abs{position:absolute}
#day{position:absolute;left:44px;top:80px;height:46px;padding:0 20px 0 16px;border-radius:23px;display:flex;align-items:center;gap:10px;font-size:26px;font-weight:700;background:rgba(18,21,28,.62);border:1px solid rgba(255,255,255,.14);box-shadow:0 8px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(14px)}
#day i{width:9px;height:9px;border-radius:50%;background:#FF4D6D;display:block;box-shadow:0 0 10px #FF4D6D}
#day small{font-size:23px;font-weight:500;color:rgba(255,255,255,.6);padding-left:10px;border-left:1px solid rgba(255,255,255,.18)}
#recon{position:absolute;left:48px;bottom:22px;font-size:18px;font-weight:500;color:rgba(255,255,255,.45)}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 48%,rgba(0,0,0,.72) 100%);pointer-events:none}
#dof{position:absolute;inset:0;-webkit-mask-image:radial-gradient(ellipse 70% 62% at 50% 46%,transparent 62%,#000 100%);mask-image:radial-gradient(ellipse 70% 62% at 50% 46%,transparent 62%,#000 100%);pointer-events:none}
#grain{position:absolute;inset:0;opacity:.085;mix-blend-mode:overlay;pointer-events:none}
.blue{color:#5b9bff}.pink{color:#FF4D6D}.dim{color:rgba(255,255,255,.55)}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.025) 55%,rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.13);box-shadow:0 30px 90px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.12)}
.pane{position:absolute;border-radius:30px;background:linear-gradient(165deg,#12151c,#0a0c11 60%,#07080b);border:1px solid rgba(255,255,255,.1);box-shadow:0 50px 120px rgba(0,0,0,.85),0 0 0 1px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1);overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(26px)}
/* phone */
.phone{position:absolute;left:400px;top:-36px;width:480px;height:1000px;border-radius:64px;background:linear-gradient(145deg,#2b2e35,#0c0d10 30%,#0a0a0c 70%,#23262c);box-shadow:0 0 0 2px #3a3d45,0 0 0 9px #0d0e11,0 60px 140px rgba(0,0,0,.95),0 0 120px rgba(90,130,220,.16);transform-origin:50% 30%}
.scr{position:absolute;inset:11px;border-radius:54px;overflow:hidden;background:#05070c}
.isl{position:absolute;left:50%;top:15px;width:134px;height:36px;margin-left:-67px;border-radius:20px;background:#000;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.noti{position:absolute;left:17px;right:17px;height:92px;border-radius:26px;background:rgba(70,78,96,.5);backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12);padding:13px 16px 13px 80px}
.noti .ic{position:absolute;left:16px;top:17px;width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 10px rgba(0,0,0,.3)}
.noti .ap{font-size:17px;color:rgba(255,255,255,.62);font-weight:500;display:flex;justify-content:space-between}
.noti .tt{font-size:25px;font-weight:700;margin-top:3px;white-space:nowrap}
.noti .tt b{color:#7fb2ff;font-weight:800}
/* chat */
.bub{position:absolute;max-width:700px;padding:15px 26px;border-radius:26px;font-size:38px;font-weight:600;line-height:1.3;box-shadow:0 10px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12)}
.who{position:absolute;font-size:22px;font-weight:600;color:rgba(255,255,255,.6)}
.av{position:absolute;width:58px;height:58px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 16px rgba(0,0,0,.4)}
/* choice */
.btn{position:absolute;width:520px;height:150px;border-radius:26px;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;letter-spacing:-.5px}
/* table */
.row{position:absolute;left:150px;right:150px;height:74px;border-radius:16px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;font-size:36px;font-weight:600;border:1px solid rgba(255,255,255,.07)}
.row .v{font-size:44px;font-weight:800}
.ttl{position:absolute;font-size:38px;font-weight:800;letter-spacing:-.5px;padding-left:22px}
.ttl:before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:7px;border-radius:4px;background:#FF4D6D;box-shadow:0 0 14px rgba(255,77,109,.7)}
</style></head><body><div id="st"><div id="in"></div><div id="dof"></div><div id="vig"></div><div id="grain"></div><div id="day"></div><div id="recon">재구성 화면</div></div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lin=(t,t0,t1,a=0,b=1)=>a+(b-a)*cl((t-t0)/(t1-t0));
const eo=x=>1-Math.pow(1-cl(x),3);
const eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
function rng(s){return()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296}}
const hash=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))%1e9;return h};
const sgn=v=>(v<0?'-':'+')+Math.abs(v).toFixed(1)+'%';
function step(t,from,to,hits){let v=from;const n=hits.length;hits.forEach((h,i)=>{v+=(to-from)/n*eo((t-h)/0.3)});return v}
function shake(t,hits,amp=6,d=.3){const k=hits.reduce((s,h)=>s+(t>h&&t<h+d?(1-(t-h)/d):0),0);return [Math.sin(t*85)*amp*k,Math.cos(t*67)*amp*.7*k,k]}
/* 2026-11-28 대표 "세련도를 엄청 — 시점 화면 안에 실제로 들어가 있는 사람처럼": 어두운 방(빛 망울·화면 빛 번짐)·손에 든 흔들림·가장자리 흐림·필름 입자 */
function env(t,id,tint='91,155,255',glow=.2){const r=rng(hash(id||'x'));let h=`<div class="abs" style="inset:-40px;background:radial-gradient(ellipse 900px 560px at 50% 46%,#131822 0%,#07090d 55%,#010102 100%)"></div>`;
  h+=`<div class="orb" style="left:240px;top:60px;width:800px;height:560px;background:radial-gradient(closest-side,rgba(${tint},${glow}),transparent);opacity:${.8+.2*Math.sin(t*1.7)}"></div>`;
  for(let i=0;i<7;i++){const x=r()*1280,y=60+r()*520,sz=40+r()*110,ph=r()*6,warm=r()>.55;const edge=Math.abs(x-640)/640;
    h+=`<div class="abs" style="left:${x+Math.sin(t*.35+ph)*14}px;top:${y+Math.cos(t*.28+ph)*9}px;width:${sz}px;height:${sz}px;border-radius:50%;background:radial-gradient(closest-side,rgba(${warm?'255,190,120':'120,160,255'},.5),rgba(${warm?'255,170,90':'90,130,255'},.12) 70%,transparent);filter:blur(${6+edge*8}px);opacity:${(.05+edge*.2)*(.7+.3*Math.sin(t*.9+ph))}"></div>`}
  return h}
const cam=(t,amp=1)=>`translate(${(Math.sin(t*.9)*4+Math.sin(t*2.3)*1.4)*amp}px,${(Math.cos(t*.7)*3+Math.sin(t*1.9)*1.2)*amp}px) rotate(${Math.sin(t*.5)*.22*amp}deg) scale(${1.025+lin(t,0,8,0,.035)})`;
const BGV=`<div class="abs" style="inset:0;background:radial-gradient(ellipse 1200px 640px at 50% 38%,#151820 0%,#090a0e 58%,#030304 100%)"></div><div class="abs" style="inset:0;background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 45%,#000,transparent)"></div>`;
const ttl=(x,y,t,s)=>`<div class="ttl" style="left:${x}px;top:${y}px">${t}<span class="dim" style="font-size:24px;font-weight:500;margin-left:16px;letter-spacing:0">${s||''}</span></div>`;
const cnt=(s,a)=>{const m=String(s).match(/^(\s*약?\s*)([+-]?)(\d+(?:\.\d+)?)(.*)$/);if(!m||a>=1)return s;const d=(m[3].split('.')[1]||'').length;return m[1]+m[2]+(parseFloat(m[3])*a).toFixed(d)+m[4]};

const K={};
/* 잠금 화면 */
K.lock=(p,t)=>{const N=p.notis;const on=lin(t,.25,.45);
  const buzz=N.reduce((s,n)=>s+(t>n.t&&t<n.t+.22?Math.sin((t-n.t)*90)*3*(1-(t-n.t)/.22):0),0);
  const fl=N.reduce((s,n)=>s+(t>n.t&&t<n.t+.5?(1-(t-n.t)/.5):0),0);
  let h=env(t,p.id,'120,150,220',.26*on+.1*fl);
  h+=`<div class="abs" style="left:120px;right:120px;top:520px;height:300px;background:radial-gradient(ellipse 50% 60% at 50% 0%,rgba(110,140,210,${.16*on}),transparent)"></div>`;
  h+=`<div class="phone" style="transform:perspective(1200px) translate(${buzz+Math.sin(t*.9)*5}px,${Math.cos(t*.7)*4}px) rotateX(${lin(t,0,8,9,4)}deg) rotateY(${Math.sin(t*.6)*1.6}deg) rotateZ(${lin(t,0,8,-3.2,-1.4)+Math.sin(t*.5)*.3}deg) scale(${lin(t,0,8,1,1.07)})"><div class="scr">
   <div class="abs" style="inset:0;background:radial-gradient(ellipse 120% 60% at 20% 0%,#2a3d68 0%,transparent 60%),radial-gradient(ellipse 100% 55% at 100% 45%,#3a2550 0%,transparent 62%),linear-gradient(175deg,#141d33,#0a0f1c 55%,#05070c)"></div>
   <div class="orb" style="left:${60+Math.sin(t*.4)*30}px;top:${420+Math.cos(t*.3)*24}px;width:340px;height:340px;background:radial-gradient(closest-side,rgba(90,130,255,.28),transparent)"></div><div class="isl"></div>
   <div class="abs" style="left:38px;top:22px;font-size:19px;font-weight:700">${p.time}</div>
   <div class="abs" style="right:36px;top:24px;display:flex;align-items:flex-end;gap:3px">${[7,10,13,16].map(x=>`<i style="display:block;width:4px;height:${x}px;border-radius:1px;background:#fff"></i>`).join('')}<span style="display:block;margin-left:8px;width:30px;height:15px;border-radius:5px;border:1.5px solid rgba(255,255,255,.6);padding:1.5px"><i style="display:block;width:38%;height:100%;border-radius:2px;background:#ff5a5a"></i></span></div>
   <div class="abs" style="top:80px;width:100%;text-align:center;font-size:25px;font-weight:500;color:rgba(255,255,255,.82);display:flex;justify-content:center;align-items:center;gap:6px">${p.dtext||`<b style="display:block;width:26px;height:20px;border-radius:5px;background:rgba(255,255,255,.3)"></b>월 <b style="display:block;width:26px;height:20px;border-radius:5px;background:rgba(255,255,255,.3)"></b>일 ${p.dow}`}</div>
   <div class="abs num" style="top:104px;width:100%;text-align:center;font-size:128px;font-weight:300;letter-spacing:-3px;text-shadow:0 0 40px rgba(140,170,255,.35)">${p.time}</div>`;
  N.forEach((n,k)=>{const a=eo((t-n.t)/.3);let yy=0;for(let j=k+1;j<N.length;j++)yy+=102*eo((t-N[j].t)/.3);
    h+=`<div class="noti" style="top:${292+yy+(1-a)*-34}px;opacity:${(t>=n.t?a:0)*(1-cl((yy-204)/80))};transform:scale(${.94+.06*a})"><div class="ic" style="background:linear-gradient(160deg,${n.c},${n.c}cc);color:${n.c=='#f7c600'?'#3a2a00':'#fff'}">${n.i}</div><div class="ap"><span>${n.app}</span><span>지금</span></div><div class="tt">${n.ttl}</div></div>`});
  h+=`<div class="abs" style="left:44px;bottom:60px;width:58px;height:58px;border-radius:50%;background:rgba(60,66,80,.6);backdrop-filter:blur(12px)"></div><div class="abs" style="right:44px;bottom:60px;width:58px;height:58px;border-radius:50%;background:rgba(60,66,80,.6);backdrop-filter:blur(12px)"></div><div class="abs" style="left:50%;bottom:18px;width:160px;height:6px;margin-left:-80px;border-radius:3px;background:rgba(255,255,255,.75)"></div>
   <div class="abs" style="left:${-300+((t*.22)%1)*1100}px;top:-100px;width:140px;height:1300px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);transform:rotate(18deg)"></div>
   <div class="abs" style="inset:0;background:#000;opacity:${1-on}"></div></div></div>`;return h};
/* 계좌 — 증권 앱 화면 */
K.acct=(p,t)=>{const hits=p.hits||[.9,1.7,2.4];const v=step(t,p.from,p.to,hits)+Math.sin(t*23)*.03;const [sx,sy,k]=shake(t,hits);
  const r=rng(hash(p.id));const pts=[];let y=0;for(let i=0;i<=90;i++){const x=i/90;y+=1.2+(x>.3&&x<.36?9:0)+(x>.62&&x<.68?10:0)+(x>.88?7:0)+(r()-.5)*7;pts.push([x,y])}
  const m=pts[pts.length-1][1];const prog=cl(lin(t,.3,3.2));const n=Math.max(2,Math.floor(prog*pts.length));
  const P=pts.slice(0,n).map(q=>[16+q[0]*440,36+q[1]/m*250]);const L=P[P.length-1];
  const rv=rng(hash(p.id)+3);let vol='';for(let i=0;i<44;i++){const hgt=6+rv()*30+(i>38?24:0);if(i/44<=prog)vol+=`<rect x="${16+i*10}" y="${350-hgt}" width="6.5" height="${hgt}" rx="2" fill="#5b9bff" opacity="${.25+.4*(i/44)}"/>`}
  const rt=rng(Math.floor(t*7)+hash(p.id));let flow='';for(let i=0;i<9;i++){const w=30+rt()*150,sell=rt()<.74;flow+=`<div style="height:9px;width:${w}px;border-radius:5px;background:${sell?'#5b9bff':'#ff5a5a'};opacity:${.25+rt()*.55};margin-top:7px;${sell?'':'margin-left:auto'}"></div>`}
  const tabs=['잔고','주문','차트','뉴스'].map((s,i)=>`<span style="position:relative;color:rgba(255,255,255,${i?.45:1});font-weight:${i?500:700}">${s}${i?'':'<i style="position:absolute;left:0;right:0;bottom:-13px;height:4px;border-radius:2px;background:#5b9bff;box-shadow:0 0 12px #5b9bff"></i>'}</span>`).join('');
  return env(t,p.id,'91,155,255',.22+k*.25)+`<div class="abs" style="inset:0;transform:${cam(t)} translate(${sx}px,${sy}px)">
  <div class="pane" style="left:66px;top:140px;width:1148px;height:462px;transform:perspective(1700px) rotateY(${-3.5+Math.sin(t*.6)*.8}deg) rotateX(${2+Math.cos(t*.5)*.5}deg)">
   <div class="abs" style="left:0;right:0;top:0;height:66px;border-bottom:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(255,255,255,.05),transparent);display:flex;align-items:center;gap:38px;padding:0 36px;font-size:24px"><b style="font-size:25px;font-weight:800;letter-spacing:-.5px;margin-right:10px">내 계좌</b>${tabs}<span style="margin-left:auto;font-size:21px;font-weight:600;color:rgba(255,255,255,.6);display:flex;align-items:center;gap:8px"><i style="width:9px;height:9px;border-radius:50%;background:#5b9bff;display:block;opacity:${Math.sin(t*7)>0?1:.3};box-shadow:0 0 10px #5b9bff"></i>실시간</span></div>
   <div class="abs" style="left:36px;top:92px;display:flex;align-items:center;gap:16px"><span style="width:58px;height:58px;border-radius:18px;background:linear-gradient(150deg,#27324a,#141a28);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:800;color:#8db6ff">3X</span><span style="font-size:50px;font-weight:800;letter-spacing:-1px">SOXL</span><span class="dim" style="font-size:23px;font-weight:500;margin-top:14px">반도체 3배 레버리지 ETF</span></div>
   <div class="abs dim" style="left:38px;top:178px;font-size:27px;font-weight:600">${p.label}</div>
   <div class="abs num" style="left:30px;top:196px;font-size:${p.small?128:150}px;font-weight:800;letter-spacing:-5px;line-height:1.15;color:#6aa6ff;text-shadow:0 0 ${40+k*50}px rgba(91,155,255,${.45+k*.4})">${sgn(v)}</div>
   ${p.sub?`<div class="abs" style="left:38px;top:388px;height:50px;padding:0 22px;border-radius:25px;background:rgba(91,155,255,.14);border:1px solid rgba(91,155,255,.35);display:flex;align-items:center;font-size:29px;font-weight:700;color:#cfe0ff;opacity:${lin(t,2.6,3.1)};transform:translateY(${(1-eo((t-2.6)/.5))*10}px)">${p.sub}</div>`:''}
   <div class="abs" style="left:590px;top:86px;width:392px;height:356px;border-radius:22px;background:rgba(255,255,255,.028);border:1px solid rgba(255,255,255,.07)"></div>
   <svg class="abs" style="left:556px;top:78px;overflow:visible" width="472" height="372" viewBox="0 0 472 372"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b9bff" stop-opacity=".34"/><stop offset="1" stop-color="#5b9bff" stop-opacity="0"/></linearGradient><filter id="gl" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter></defs>
    <g transform="translate(34,8) scale(.83)">${[0,1,2,3].map(i=>`<line x1="16" y1="${36+i*84}" x2="456" y2="${36+i*84}" stroke="rgba(255,255,255,.06)" stroke-width="1.5"/>`).join('')}
    <line x1="16" y1="36" x2="456" y2="36" stroke="rgba(255,255,255,.3)" stroke-width="2" stroke-dasharray="5 8"/><text x="456" y="24" text-anchor="end" font-size="24" font-weight="600" fill="rgba(255,255,255,.55)" font-family="P">${p.ref||'매수가'}</text>
    <path d="M${P.map(q=>q.join(',')).join(' L')} L${L[0]},300 L16,300 Z" fill="url(#g)"/><path d="M${P.map(q=>q.join(',')).join(' L')}" fill="none" stroke="#5b9bff" stroke-width="9" opacity=".5" filter="url(#gl)"/><path d="M${P.map(q=>q.join(',')).join(' L')}" fill="none" stroke="#8dbaff" stroke-width="4.5" stroke-linejoin="round"/>
    <line x1="${L[0]}" y1="20" x2="${L[0]}" y2="352" stroke="rgba(255,255,255,.18)" stroke-width="1.5" stroke-dasharray="3 5"/>${vol}
    <circle cx="${L[0]}" cy="${L[1]}" r="${17+5*Math.sin(t*9)}" fill="#5b9bff" opacity=".28"/><circle cx="${L[0]}" cy="${L[1]}" r="7.5" fill="#fff"/></g></svg>
   <div class="abs" style="left:1004px;top:86px;width:112px;bottom:20px"><div class="dim" style="font-size:21px;font-weight:600">체결</div>${flow}</div>
   <div class="abs" style="left:-200px;top:-200px;width:700px;height:500px;background:radial-gradient(closest-side,rgba(255,255,255,.05),transparent);transform:rotate(-20deg)"></div>
   <div class="abs" style="inset:0;background:#5b9bff;opacity:${k*.1}"></div></div></div>`};
/* 모니터 + 속보 */
K.mon=(p,t)=>{const bt=p.bt||1.0;const [sx,sy]=shake(t,[bt],7,.35);const pl=lin(t,bt+.3,bt+2.2);

  pts.forEach((q,i)=>{if(i>prog+.01||!q[0])return;const hi=(p.hi||[]).includes(i);s+=`${hi?`<circle cx="${X(i)}" cy="${Y(q[1])}" r="${20+5*Math.sin(t*5)}" fill="#FF4D6D" opacity=".25"/>`:''}<circle cx="${X(i)}" cy="${Y(q[1])}" r="${hi?12:8}" fill="${hi?'#FF4D6D':'#fff'}"/><text x="${X(i)}" y="${Y(q[1])+(q[3]=='b'?46:-22)}" text-anchor="${i==0?'start':i==pts.length-1?'end':'middle'}" font-size="${hi?32:26}" font-weight="800" fill="${hi?'#FF4D6D':'#fff'}" font-family="P">${q[2]||('$'+q[1])}</text><text x="${X(i)}" y="566" text-anchor="${i==0?'start':i==pts.length-1?'end':'middle'}" font-size="21" font-weight="500" fill="rgba(255,255,255,.55)" font-family="P">${q[0]}</text>`});
  return h+`<svg class="abs" style="left:0;top:0" width="1280" height="720">${s}</svg>`};
/* 막대 비교 */
K.bars=(p,t)=>{let h=BGV+ttl(150,122,p.title,p.sub);const mx=Math.max(...p.items.map(i=>i[1]));
  const many=p.items.length>2;const bar=(hi)=>hi?'background:linear-gradient(90deg,#ff2e55,#FF6D88);box-shadow:0 0 30px rgba(255,77,109,.5)':'background:linear-gradient(90deg,#8d939e,#f2f4f7)';
  const vis=p.vis||p.items.map((_,i)=>i),fresh=p.fresh||vis;
  p.items.forEach((it,i)=>{if(!vis.includes(i))return;const fi=fresh.indexOf(i);const a=fi<0?1:eio(lin(t,.3+fi*(p.gap||.35),1.3+fi*(p.gap||.35)));const hi=(p.hi||[]).includes(i);const y=220+i*(300/p.items.length);const off=p.hi&&p.hi.length&&!hi;
    if(many){const yy=206+i*78;h+=`<div class="abs" style="left:150px;top:${yy}px;font-size:34px;font-weight:700;opacity:${off?.5:1}">${it[0]}</div><div class="abs" style="left:300px;top:${yy-2}px;height:48px;width:${it[1]/mx*560*a}px;${bar(hi)};border-radius:10px;opacity:${off?.4:1}"></div><div class="abs num" style="left:${318+it[1]/mx*560*a}px;top:${yy-6}px;font-size:42px;font-weight:800;color:${hi?'#FF4D6D':'#fff'};opacity:${a}">${cnt(it[2],a)}</div>`;return}
    h+=`<div class="abs" style="left:150px;top:${y}px;font-size:32px;font-weight:700;opacity:${off?.5:1}">${it[0]}</div><div class="abs" style="left:150px;top:${y+48}px;height:44px;width:760px;border-radius:10px;background:rgba(255,255,255,.04)"></div><div class="abs" style="left:150px;top:${y+48}px;height:44px;width:${it[1]/mx*760*a}px;${bar(hi)};border-radius:10px;opacity:${off?.4:1}"></div><div class="abs num" style="left:${166+it[1]/mx*760*a}px;top:${y+40}px;font-size:44px;font-weight:800;color:${hi?'#FF4D6D':'#fff'};opacity:${a}">${cnt(it[2],a)}</div>`});return h};
/* 연표 */
K.tline=(p,t)=>{const w=1040*eio(lin(t,.3,1.6));let h=BGV+ttl(120,122,p.title)+`<div class="abs" style="left:120px;top:357px;height:2px;width:1040px;background:rgba(255,255,255,.1)"></div><div class="abs" style="left:120px;top:356px;height:4px;width:${w}px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,.5),#fff);box-shadow:0 0 16px rgba(255,255,255,.5)"></div>`;
  p.items.forEach((it,i)=>{const x=120+it[0]*1040;const a=eo((t-.4-it[0]*1.2)/.4);const hi=(p.hi||[]).includes(i);
    h+=`${hi?`<div class="abs" style="left:${x-26}px;top:332px;width:52px;height:52px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,77,109,.5),transparent);opacity:${a*(.6+.4*Math.sin(t*5))}"></div>`:''}<div class="abs" style="left:${x-11}px;top:347px;width:22px;height:22px;border-radius:50%;background:${hi?'#FF4D6D':'#fff'};border:4px solid #0b0c10;box-sizing:content-box;margin:-4px;opacity:${a};transform:scale(${.5+.5*a})"></div><div class="abs" style="left:${x-170}px;width:340px;text-align:${it[0]<.1?'left':it[0]>.9?'right':'center'};${it[0]<.1?'padding-left:170px;':it[0]>.9?'padding-right:170px;':''}top:${i%2?388:250}px;opacity:${a};transform:translateY(${(1-a)*(i%2?-10:10)}px)"><div class="num" style="font-size:24px;font-weight:600;color:rgba(255,255,255,.6)">${it[1]}</div><div style="font-size:${hi?38:32}px;font-weight:800;color:${hi?'#FF4D6D':'#fff'}">${it[2]}</div></div>`});

/* 바닥 신호 계기판 — 2026-11-28 대표 "반도체 신호를 처음 본 사람도 있으니 빠르게 보여 주고" */
K.gauge=(p,t)=>{let h=BGV+ttl(110,122,p.title,p.sub);const on=p.on||[],ont=p.ont||1.4,gap=p.gap||.5;
  p.sig.forEach((g,i)=>{const a=p.still?1:eo((t-.3-i*gap)/.4);const lit=on.includes(i)&&t>=ont;const la=lit?eo((t-ont)/.5):0;const pu=.5+.5*Math.sin(t*4);const sc=p.scan&&Math.floor((t-.4)/.62)==i&&t>.4;
    h+=`<div class="abs" style="left:${110+i*216}px;top:204px;width:196px;height:262px;border-radius:22px;opacity:${a};transform:translateY(${(1-a)*24}px);background:${lit?'linear-gradient(170deg,rgba(255,77,109,.26),rgba(255,255,255,.05) 60%)':'linear-gradient(170deg,rgba(255,255,255,.075),rgba(255,255,255,.025))'};border:${lit||sc?2:1}px solid ${lit?'rgba(255,77,109,.95)':sc?'rgba(255,255,255,.7)':'rgba(255,255,255,.12)'};box-shadow:${lit?`0 0 ${36+18*pu}px rgba(255,77,109,.38),`:''}inset 0 1px 0 rgba(255,255,255,.12);text-align:center">
     <div style="margin:26px auto 0;width:58px;height:58px;border-radius:50%;${lit?`background:radial-gradient(circle at 35% 30%,#ff9db0,#FF4D6D 60%);box-shadow:0 0 ${24+14*pu}px #FF4D6D;transform:scale(${.7+.3*la})`:'border:3px solid rgba(255,255,255,.28);background:rgba(255,255,255,.03)'}"></div>
     <div style="font-size:42px;font-weight:800;margin-top:20px;letter-spacing:-1px;color:${lit?'#fff':'rgba(255,255,255,.92)'}">${g[0]}</div><div style="font-size:23px;font-weight:500;line-height:1.35;margin-top:10px;color:rgba(255,255,255,${lit?.9:.58})">${g[1]}</div></div>`});
  if(p.foot){const fa=eo((t-ont-.4)/.5);h+=`<div class="abs" style="left:0;right:0;top:486px;text-align:center;font-size:46px;font-weight:800;letter-spacing:-1px;opacity:${fa};transform:translateY(${(1-fa)*12}px)">${p.foot.replace(/\[(.+?)\]/,'<span class="pink">$1</span>')}</div>`}
  return h};

let CLIPS={};
function render(name,t){const p=CLIPS[name];p.id=name;$('in').innerHTML=K[p.k](p,t);
  const pov=!!p.day;const vnk=['table','bars','path','tline','gauge'].includes(p.k);const im=pov||p.recon;$('in').style.transformOrigin=vnk?'50% 0':'50% 45%';$('in').style.transform=vnk?'translateY(14px) scale(1.08)':'';$('day').style.display=pov?'flex':'none';$('recon').style.display=im?'block':'none';$('vig').style.display=im?'block':'none';$('dof').style.display=im?'block':'none';
  const gs=Math.floor(t*30);$('grain').style.backgroundPosition=`${(gs*73)%256}px ${(gs*151)%256}px`;$('grain').style.opacity=im?.085:.05;
  $('in').style.filter=im&&t<.5?`blur(${(1-eo(t/.45))*7}px) brightness(${.7+.3*eo(t/.45)})`:'';   /* 2026-11-28 대표 "내가 1인칭으로 하는 듯한 생동감": 새 화면을 볼 때 초점이 맞춰진다 */
  const tp=p.tap||(p.k=='acct'?[640,390,.12]:null);if(tp&&t>=tp[2]&&t<tp[2]+.6){const a=(t-tp[2])/.6;$('in').insertAdjacentHTML('beforeend',`<div class="abs" style="left:${tp[0]-60}px;top:${tp[1]-60}px;width:120px;height:120px;border-radius:50%;border:3px solid rgba(255,255,255,${.7*(1-a)});background:rgba(255,255,255,${.16*(1-a)});transform:scale(${.25+a})"></div>`)}
  if(p.wake&&t<1.3){const o=eio(t/1.1);$('in').insertAdjacentHTML('beforeend',`<div class="abs" style="left:-20px;right:-20px;top:-20px;height:${380*(1-o)+20}px;background:#000;filter:blur(14px)"></div><div class="abs" style="left:-20px;right:-20px;bottom:-20px;height:${380*(1-o)+20}px;background:#000;filter:blur(14px)"></div>`)}
  if(pov&&p.today){$('day').innerHTML=`<i></i><span style="font-size:22px;font-weight:700;color:#ffb3c0;padding-right:10px;margin-right:6px;border-right:1px solid rgba(255,255,255,.18)">당신의 시점</span>${p.day}`}else if(pov)$('day').innerHTML=`<i style="opacity:${Math.sin(t*4)>-.3?1:.3}"></i><span style="font-size:22px;font-weight:700;color:#ffb3c0;padding-right:10px;margin-right:6px;border-right:1px solid rgba(255,255,255,.18)">당신의 시점</span><span style="display:flex;gap:4px;margin-right:4px">${[38,18,18].map(w=>`<b style="display:block;width:${w}px;height:20px;border-radius:5px;background:linear-gradient(180deg,#59627a,#3a4152)"></b>`).join('')}</span>${p.day}${p.clock?`<small>${p.clock}</small>`:''}`}
(()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d'),d=x.createImageData(256,256);let q=12345;for(let i=0;i<d.data.length;i+=4){q=(q*1664525+1013904223)%4294967296;const v=q/4294967296*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}x.putImageData(d,0,0);$('grain').style.backgroundImage=`url(${c.toDataURL()})`})();
window.render=render;window.setClips=c=>{CLIPS=c};
</script></body></html>
