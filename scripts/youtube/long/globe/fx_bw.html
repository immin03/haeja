<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:SUIT;font-weight:800;src:url(SUIT-ExtraBold.ttf)}
@font-face{font-family:SUIT;font-weight:600;src:url(SUIT-SemiBold.ttf)}
html,body{margin:0;background:#0c0c0e}canvas{display:block}
</style>
<script src="node_modules/d3-array/dist/d3-array.min.js"></script>
<script src="node_modules/d3-geo/dist/d3-geo.min.js"></script>
<script src="node_modules/topojson-client/dist/topojson-client.min.js"></script>
</head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// fx_bw: 2026-11-17 흑백 + 핑크 톤 (테슬라 2편부터) — fx.html 색만 바꾼 판
// 2026-11-12 대표 "코드로 만들 수 있는 건 전부 코드로" — 밸류노트 롱폼 볼거리 효과 (비용 0원)
// ★ 자막 안전 구역: 모든 효과의 글자·상자는 y 860 위에만 둔다 (아래는 자막·출처 자리, 2026-11-12 대표 '자막하고 화면이 겹쳐')
// 모드: histchart(과거 국면 겹침 차트) · flow(돈의 흐름) · scale(누름·받침 저울) · timeline(사건 레일)
// 내용은 전부 window.CFG 로 받는다 (원고마다 바꿔 쓴다). cap.js 로 PAGE=fx.html 지정해 영상으로 뽑는다.
const W=1920,H=1080,c=document.getElementById('c'); let g=c.getContext('2d');   // r180: g 를 바꿔 끼워 본문 크기를 잰다
const NAVY='#0c0c0e',GOLD='#f2f2f2',IVORY='#ffffff',GREEN='#ffffff',RED='#ff4d6d',PINK='#ff4d6d',GRAY='rgba(225,225,228,0.6)';
const ease=x=>x<0?0:x>1?1:(x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2), cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
let land=null;
async function init(){
  const r=await fetch('node_modules/world-atlas/land-50m.json'); const topo=await r.json(); land=topojson.feature(topo,topo.objects.land);
  await document.fonts.load('800 40px SUIT'); await document.fonts.load('600 40px SUIT'); window.ready=true;
}
init();
function bg(){ if(window.NOBG) return; const b=g.createRadialGradient(W/2,H/2,100,W/2,H/2,W); b.addColorStop(0,'#1d1d21'); b.addColorStop(1,NAVY); g.fillStyle=b; g.fillRect(0,0,W,H);
  for(let i=0;i<160;i++){ const r1=Math.sin(i*12.9898)*43758.5453, r2=Math.sin(i*78.233)*12543.31; g.fillStyle=`rgba(235,235,238,${0.05+0.12*((i%7)/7)})`; g.fillRect((r1-Math.floor(r1))*W,(r2-Math.floor(r2))*H,1.6,1.6); } }
// ── 글자 크기 규칙(2026-11-27 대표 "최소로 보이는 글자 크기를 정하고, 작은 글자는 안 쓰는 게 낫다") ──
// 1920×1080 기준. 대제목(카드 큰 글자) 76 · 중제목(카드 이름·라벨) 52 · 본문 최소 40. 30보다 작게 준 글자(출처·각주·눈금)는 아예 그리지 않는다(출처는 설명란에).
const TYPE={big:76, mid:52, min:40, drop:30};
function txt(s,x,y,size,col,w,align,a){ size=size*(window.FS||1); if(!window.TYPE_OFF){ if(size<TYPE.drop) return; if(size<TYPE.min) size=TYPE.min; } g.save(); g.globalAlpha=a==null?1:a; g.font=`${w||800} ${size}px SUIT`; g.fillStyle=col; g.textAlign=align||'left'; g.textBaseline='middle'; g.shadowColor='rgba(0,0,0,0.5)'; g.shadowBlur=8; g.fillText(s,x,y); g.restore(); }
/* 2026-11-18 대표: 핵심(이름·결론)은 크게, 보조(연결 설명·항목·부제)는 덜 키운다 → FS2 */
function txtS(s,x,y,size,col,w,align,a){ const f=window.FS; window.FS=window.FS2||1; txt(s,x,y,size,col,w,align,a); window.FS=f; }
function _badge(C,t){ const a=ease(cl((t-(C.badge_at||0.3))/0.6)); if(a<=0) return; const m=String(C.badge).match(/^(.*?)(\S+)$/)||['',C.badge,'']; const ky=(C.ky||96)+66;
  g.save(); g.font='800 36px SUIT'; const w1=g.measureText(m[1]).width; g.font='800 60px SUIT'; const w2=g.measureText(m[2]).width; g.restore();
  const pw=w1+w2+104, px=(C.badge_r||W-150)-pw;   /* 2026-11-24 대표 '위치가 어정쩡': 제목과 같은 줄, 카드 오른쪽 끝선에 맞춤 */
  g.save(); g.globalAlpha=a; g.fillStyle='rgba(255,77,109,0.16)'; g.strokeStyle=PINK; g.lineWidth=3; g.shadowColor='rgba(255,77,109,0.45)'; g.shadowBlur=30; g.beginPath(); g.roundRect(px,ky-44,pw,88,44); g.fill(); g.shadowBlur=0; g.stroke(); g.restore();
  const f_=window.FS; window.FS=1; txt(m[1],px+48,ky+2,36,IVORY,800,'left',a); txt(m[2],px+48+w1,ky,60,PINK,800,'left',a); window.FS=f_; }
function kicker(C,t){ if(window.NOKICK) return; const f_=window.FS; window.FS=1; kicker0(C,t); window.FS=f_; }
function kicker0(C,t){ const a=ease(cl(t/0.6)); if(C.badge) _badge(C,t); g.save(); g.globalAlpha=a; g.fillStyle=PINK; const ky=C.ky||96; g.fillRect(120,ky,64,5); g.restore(); txt(C.kicker||'',200,ky+2,40,'#dcdcdc',600,'left',a); txt(C.title||'',120,ky+72,66,IVORY,800,'left',a); }   // ky: 롱폼 왼쪽 위 목차와 겹치지 않게 내림 (2026-11-17)
function glow(x,y,r,col,a){ const gr=g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,col.replace('A',a)); gr.addColorStop(1,col.replace('A',0)); g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill(); }

// ① 과거 국면 겹침 차트: series [{name, pts:[...지수], color, end}] · x 개월, y 로그 지수(시작=100)
function histchart(C,t){
  bg(); kicker(C,t);
  const X0=180,X1=1500,Y0=930,Y1=260, xm=C.xmax||36, lo=C.ymin||40, hi=C.ymax||600;
  const X=m=>X0+(X1-X0)*m/xm, Y=v=>Y0-(Y0-Y1)*(Math.log(v)-Math.log(lo))/(Math.log(hi)-Math.log(lo));
  const ga=ease(cl((t-0.3)/0.6));
  g.save(); g.globalAlpha=ga; g.strokeStyle='rgba(235,235,238,0.18)'; g.lineWidth=1;
  for(const v of (C.yticks||[50,100,200,400])){ g.beginPath(); g.moveTo(X0,Y(v)); g.lineTo(X1,Y(v)); g.stroke(); txt(v===100?'100 (첫 인상)':String(v),X0-16,Y(v),24,v===100?GOLD:GRAY,600,'right',ga); }
  for(let m=0;m<=xm;m+=12){ txt(m===0?'첫 금리 인상':`${m}개월`,X(m),Y0+36,24,GRAY,600,'center',ga); }
  g.strokeStyle='rgba(225,225,228,0.6)'; g.setLineDash([8,8]); g.beginPath(); g.moveTo(X0,Y(100)); g.lineTo(X1,Y(100)); g.stroke(); g.restore();
  const S=C.series||[]; const labs=[];
  S.forEach((s,k)=>{ const t0=0.9+k*(C.gap||0.9), p=ease(cl((t-t0)/1.4)); if(p<=0) return; const n=s.pts.length-1, upto=n*p;
    g.save(); g.strokeStyle=s.color; g.lineWidth=s.bold?7:4; g.shadowColor=s.color; g.shadowBlur=s.bold?18:8; g.lineJoin='round'; g.beginPath();
    for(let i=0;i<=Math.floor(upto);i++){ const x=X(i), y=Y(s.pts[i]); i?g.lineTo(x,y):g.moveTo(x,y); }
    const fi=Math.floor(upto), fr=upto-fi; let ex=X(fi), ey=Y(s.pts[fi]); if(fi<n){ ex=X(fi+fr); ey=Y(s.pts[fi]+(s.pts[fi+1]-s.pts[fi])*fr); g.lineTo(ex,ey); }
    g.stroke(); g.restore(); glow(ex,ey,30,s.glow||'rgba(255,255,255,A)',0.9);
    if(p>=1) labs.push({x:ex,y:ey,s,a:ease(cl((t-t0-1.4)/0.5))}); });
  labs.sort((a,b)=>a.y-b.y); let last=-1e9;
  for(const L of labs){ let y=Math.max(L.y,last+56); last=y; txt(L.s.name,L.x+22,y-12,28,L.s.color,800,'left',L.a); txt(L.s.end,L.x+22,y+18,24,IVORY,600,'left',L.a); }
  if(C.now){ const tn=0.9+S.length*(C.gap||0.9)+0.6, a=ease(cl((t-tn)/0.6)); if(a>0){ const x=X(C.now.m), y=Y(C.now.v), pul=(t*1.2)%1;
    g.save(); g.globalAlpha=a; g.strokeStyle=`rgba(225,225,228,${1-pul})`; g.lineWidth=4; g.beginPath(); g.arc(x,y,14+50*pul,0,7); g.stroke(); g.fillStyle=GOLD; g.shadowColor=GOLD; g.shadowBlur=30; g.beginPath(); g.arc(x,y,14,0,7); g.fill(); g.restore();
    const lx=x+40, ly=Y(C.now.labv||60); g.save(); g.globalAlpha=a; g.strokeStyle='rgba(225,225,228,0.7)'; g.lineWidth=2; g.beginPath(); g.moveTo(x,y+16); g.lineTo(lx-8,ly-20); g.stroke(); g.restore(); txt(C.now.name,lx,ly-20,34,GOLD,800,'left',a); txt(C.now.sub,lx,ly+16,24,IVORY,600,'left',a); } }
  if(C.note) txt(C.note,X0,1040,22,GRAY,600,'left',ga);
}

// ② 돈의 흐름: 평면 지도 위 출발지 → 도착 금고로 빛 알갱이, 도착 금고마다 숫자가 올라간다
function flow(C,t){
  bg(); kicker(C,t);
  const proj=d3.geoNaturalEarth1().rotate([-(C.center||40),0]).fitExtent([[420,190],[W-420,840]],{type:'Sphere'})  /* 2026-11-12 대표: 자막(아래 860~1000)과 겹치지 않게 — 숫자 상자는 양옆으로 */; const path=d3.geoPath(proj,g);
  const ma=ease(cl(t/0.8)); g.save(); g.globalAlpha=ma*0.9; g.fillStyle='#122544'; g.beginPath(); path({type:'Sphere'}); g.fill(); g.fillStyle='rgba(234,219,185,0.16)'; g.beginPath(); path(land); g.fill(); g.strokeStyle='rgba(225,225,228,0.35)'; g.lineWidth=1; g.beginPath(); path(land); g.stroke(); g.restore();
  (C.sinks||[]).forEach((sk,si)=>{ const [sx,sy]=sk.xy; const t0=0.8+si*(C.gap||2.2), a=ease(cl((t-t0)/0.5));
    if(a<=0) return;
    (sk.from||[]).forEach((f,fi)=>{ const [fx,fy]=proj(f.ll); const mx=(fx+sx)/2, my=Math.min(fy,sy)-120;
      for(let k=0;k<14;k++){ const u=((t-t0)*0.45+k/14+fi*0.07)%1; if(t-t0<u/0.45) continue; const q=1-u;
        const x=q*q*fx+2*q*u*mx+u*u*sx, y=q*q*fy+2*q*u*my+u*u*sy; glow(x,y,10,'rgba(255,225,150,A)',0.85*a); }
      g.save(); g.globalAlpha=a; g.fillStyle=IVORY; g.beginPath(); g.arc(fx,fy,7,0,7); g.fill(); g.restore(); if(f.name) txt(f.name,fx+(f.dx||0),fy-24+(f.dy||0),24,IVORY,600,'center',a); });
    const cnt=ease(cl((t-t0-0.4)/2.6)), v=Math.round(sk.value*cnt);
    g.save(); g.globalAlpha=a; g.fillStyle='rgba(20,20,23,0.85)'; g.strokeStyle=GOLD; g.lineWidth=3; g.beginPath(); g.roundRect(sx-170,sy-80,340,150,18); g.fill(); g.stroke(); g.restore();
    glow(sx,sy-6,120,'rgba(225,225,228,A)',0.18*a);
    txt(sk.name,sx,sy-46,28,GOLD,600,'center',a); txt(`${v.toLocaleString()}${sk.unit||''}`,sx,sy+8,64,IVORY,800,'center',a); txt(sk.sub||'',sx,sy+50,22,GRAY,600,'center',a); });
  if(C.note) txt(C.note,120,1046,22,GRAY,600,'left',ma);
}

// ③ 저울: left/right 추가 하나씩 올라가며 기울었다 팽팽하게
function scale(C,t){
  bg(); kicker(C,t);
  const L=C.left||{items:[]}, R=C.right||{items:[]}, cx=W/2, py=430, arm=520;
  let wl=0,wr=0; const tl=[],tr=[];
  L.items.forEach((it,i)=>{ const t0=0.8+i*1.0; const a=ease(cl((t-t0)/0.5)); tl.push(a); wl+=a*(it.w||1); });
  R.items.forEach((it,i)=>{ const t0=0.8+(L.items.length+i)*1.0; const a=ease(cl((t-t0)/0.5)); tr.push(a); wr+=a*(it.w||1); });
  const target=cl((wr-wl)*0.06,-0.16,0.16) /* 2026-11-18: 무거운 쪽이 내려가게 (전에는 반대로 올라감) */, wob=Math.sin(t*2.2)*0.012*Math.exp(-Math.max(0,t-6)*0.4); const ang=target+wob;
  const ga=ease(cl((t-0.3)/0.6));
  g.save(); g.globalAlpha=ga; g.fillStyle=GOLD; g.beginPath(); g.moveTo(cx-60,py+470); g.lineTo(cx+60,py+470); g.lineTo(cx+12,py); g.lineTo(cx-12,py); g.closePath(); g.fill();
  g.translate(cx,py); g.rotate(ang); g.strokeStyle=GOLD; g.lineWidth=12; g.lineCap='round'; g.beginPath(); g.moveTo(-arm,0); g.lineTo(arm,0); g.stroke(); g.restore();
  glow(cx,py,40,'rgba(255,255,255,A)',0.8*ga);
  const side=(S,ts,sgn,col)=>{ const ex=cx+sgn*arm*Math.cos(ang), ey=py+sgn*arm*Math.sin(ang);
    g.save(); g.globalAlpha=ga; g.strokeStyle='rgba(225,225,228,0.7)'; g.lineWidth=3; g.beginPath(); const PD=(window.FS||1)>1?330:250; g.moveTo(ex,ey); g.lineTo(ex-210,ey+PD-4); g.moveTo(ex,ey); g.lineTo(ex+210,ey+PD-4); g.stroke();
    g.fillStyle='rgba(225,225,228,0.25)'; g.strokeStyle=GOLD; g.beginPath(); g.ellipse(ex,ey+PD,230,24,0,0,7); g.fill(); g.stroke(); g.restore();
    txt(S.name,ex,ey-((window.FS||1)>1?50:56),40,col,800,'center',ga);
    S.items.forEach((it,i)=>{ const a=ts[i]; if(a<=0) return; const F0=window.FS||1, by=(F0>1?ey+306-i*(54*F0+12):ey+222-i*62)-(1-a)*80;
      g.save(); g.globalAlpha=a; g.fillStyle='rgba(20,20,23,0.92)'; g.strokeStyle=col; g.lineWidth=2.5; const F_=window.FS2||1, hw=230+(F_-1)*140, bh=54*F_; g.beginPath(); g.roundRect(ex-hw,by-bh+6,hw*2,bh,12); g.fill(); g.stroke(); g.restore();
      txtS(it.text,ex,by-bh/2+6,26,IVORY,800,'center',a); });
    // 이유 줄은 판 아래
    S.items.forEach((it,i)=>{ const a=ts[i]; if(a<=0||!it.why) return; txt('· '+it.why,ex-230,ey+310+i*40,24,GRAY,600,'left',a); });
  };
  side(L,tl,-1,RED); side(R,tr,1,GREEN);
  const fa=ease(cl((t-(0.8+(L.items.length+R.items.length)*1.0+0.6))/0.8)); if(C.verdict&&fa>0){ const vy=(C.vy||1030); g.save(); g.globalAlpha=fa; g.font='800 '+Math.round(40*(window.FS||1))+'px SUIT'; const vw=g.measureText(C.verdict).width+80, vh=Math.round(40*(window.FS||1))+40; g.fillStyle='rgba(14,14,16,0.94)'; g.strokeStyle=PINK; g.lineWidth=2; g.beginPath(); g.roundRect(cx-vw/2,vy-vh/2,vw,vh,vh/2); g.fill(); g.stroke(); g.restore(); txt(C.verdict,cx,vy,40,PINK,800,'center',fa); }   // 2026-11-17 대표: 결론 줄이 받침대와 겹쳐 안 보임 → 어두운 판 위에
}

// ④ 사건 레일: 날짜 축 위에 값 선이 그려지며 사건 카드가 하나씩
function timeline(C,t){
  bg(); kicker(C,t);
  const P=C.points||[], X0=200,X1=1720,Yb=820,Yt=380; const vs=P.map(p=>p.v), lo=Math.min(...vs), hi=Math.max(...vs), pad=(hi-lo)*0.25||1;
  const X=i=>X0+(X1-X0)*i/(P.length-1), Y=v=>Yb-(Yb-Yt)*(v-lo+pad)/(hi-lo+2*pad);
  const ga=ease(cl((t-0.3)/0.6)); g.save(); g.globalAlpha=ga; g.strokeStyle='rgba(225,225,228,0.5)'; g.lineWidth=3; g.beginPath(); g.moveTo(X0-40,Yb+90); g.lineTo(X1+40,Yb+90); g.stroke(); g.restore();
  const n=P.length-1, p=ease(cl((t-0.8)/(n*1.3))), upto=n*p;
  g.save(); g.strokeStyle=GOLD; g.lineWidth=6; g.shadowColor=GOLD; g.shadowBlur=16; g.lineJoin='round'; g.beginPath();
  for(let i=0;i<=Math.floor(upto);i++){ i?g.lineTo(X(i),Y(P[i].v)):g.moveTo(X(i),Y(P[i].v)); } const fi=Math.floor(upto), fr=upto-fi;
  if(fi<n) g.lineTo(X(fi+fr),Y(P[fi].v+(P[fi+1].v-P[fi].v)*fr)); g.stroke(); g.restore();
  P.forEach((q,i)=>{ if(upto<i-0.02) return; const a=ease(cl((upto-i+0.35)/0.35)), x=X(i), y=Y(q.v), col=q.color==='red'?RED:q.color==='green'?GREEN:GOLD;
    glow(x,y,28,'rgba(255,255,255,A)',0.9*a); g.save(); g.globalAlpha=a; g.fillStyle=col; g.beginPath(); g.arc(x,y,10,0,7); g.fill();
    g.strokeStyle='rgba(225,225,228,0.35)'; g.lineWidth=2; g.setLineDash([6,6]); g.beginPath(); g.moveTo(x,y+16); g.lineTo(x,Yb+90); g.stroke(); g.restore();
    txt(q.date,x,Yb+124,26,GRAY,600,'center',a);
    const up=q.up!=null?q.up:(i%2===0); const cy=up?y-90:y+90; g.save(); g.globalAlpha=a; g.fillStyle='rgba(20,20,23,0.9)'; g.strokeStyle=col; g.lineWidth=2.5;
    g.font='800 '+Math.round(34*(window.FS||1))+'px SUIT'; const w1=g.measureText(q.big).width; g.font='600 '+Math.round(24*(window.FS||1))+'px SUIT'; const w2=g.measureText(q.sub||'').width; const bw=Math.max(w1,w2)+44;
    const bx=Math.min(Math.max(x-bw/2,40),W-40-bw); g.beginPath(); g.roundRect(bx,cy-46,bw,92,14); g.fill(); g.stroke(); g.restore();
    txt(q.big,bx+bw/2,cy-14,34,col,800,'center',a); txt(q.sub||'',bx+bw/2,cy+22,24,IVORY,600,'center',a); });
  if(C.note) txt(C.note,120,1046,22,GRAY,600,'left',ga);
}

// ⑤ 지분 구조도: nodes [{id,name,sub,x,y,main}] · edges [{a,b,label}] — 차례로 이어지고 마지막에 '주주 몫' 강조
function stake(C,t){
  bg(); kicker(C,t);
  const N={}; (C.nodes||[]).forEach(n=>N[n.id]=n);
  (C.edges||[]).forEach((e,i)=>{ const t0=0.8+i*(C.gap||1.1), p=ease(cl((t-t0)/0.9)); if(p<=0) return; const A=N[e.a],B=N[e.b];
    const x=A.x+(B.x-A.x)*p, y=A.y+(B.y-A.y)*p;
    g.save(); g.strokeStyle=e.hot?PINK:'rgba(225,225,228,0.6)'; g.lineWidth=e.hot?6:3; g.shadowColor=GOLD; g.shadowBlur=e.hot?18:0; g.beginPath(); g.moveTo(A.x,A.y); g.lineTo(x,y); g.stroke(); g.restore();
    const u=((t-t0)*0.5)%1; if(p>=1) glow(A.x+(B.x-A.x)*u,A.y+(B.y-A.y)*u,16,'rgba(255,255,255,A)',0.9);

    txt(p.k,cx,cy-R*0.42-130,40,IVORY,800,'center',a); const av=ease(cl((t-td-0.3)/0.6)); txt(p.v,cx,cy+R*0.42+70,56,(p.r||0)>0.5?PINK:IVORY,800,'center',av); if(p.sub) txtS(p.sub,cx,cy+R*0.42+124,28,GRAY,600,'center',av); });

// ⑮ 파도 사슬(chain) — 2026-11-26 대표 "1, 2, 3, 4 숫자가 왜 붙지? 어색해" → 번호 원 대신 이름 카드 + 카드 사이를 달려가는 빛(파도), wave:true면 아래로 물결이 번진다
// cfg: {kicker,title, nodes:[{k,sub,hi}], step, wave, foot}
function chain(C,t){
  bg(); kicker(C,t);
  const N=C.nodes||[], n=N.length, X0=W*0.5-(n-1)*(C.dx||380)/2, cy=C.cy||560, st=C.step||1.1, dx=C.dx||380, cw=Math.min(320,dx-60), chh=150;
  if(C.wave){ const aw=ease(cl((t-0.6)/0.6)); const head=X0-cw/2+(cl((t-0.6)/(st*(n-1)+0.6)))*((n-1)*dx+cw);
    g.save(); g.globalAlpha=aw; for(let L=0;L<3;L++){ g.beginPath(); for(let x=X0-cw/2;x<=head;x+=6){ const k=(head-x)/220, amp=(18+L*10)*Math.exp(-k*0.35); const y=cy+150+L*34+Math.sin(x/38-t*5+L)*amp; x===X0-cw/2?g.moveTo(x,y):g.lineTo(x,y); }
      g.strokeStyle=L?'rgba(225,225,228,'+(0.22-L*0.06)+')':PINK; g.lineWidth=L?2:3.5; g.stroke(); } g.restore(); }
  for(let i=0;i<n-1;i++){ const x1=X0+i*dx+cw/2+14, x2=X0+(i+1)*dx-cw/2-14, a=C.at?ease(cl((t-(C.at[i+1]-0.7))/0.6)):ease(cl((t-0.8-i*st-0.3)/0.6));
    g.save(); g.strokeStyle='rgba(225,225,228,0.18)'; g.lineWidth=3; g.beginPath(); g.moveTo(x1,cy); g.lineTo(x2,cy); g.stroke();
    if(a>0){ const xe=x1+(x2-x1)*a; g.strokeStyle=PINK; g.lineWidth=4; g.beginPath(); g.moveTo(x1,cy); g.lineTo(xe,cy); g.stroke();
      g.fillStyle=PINK; g.beginPath(); g.moveTo(xe+4,cy); g.lineTo(xe-14,cy-11); g.lineTo(xe-14,cy+11); g.closePath(); g.fill();
      if(a<1){ g.shadowColor=PINK; g.shadowBlur=26; g.beginPath(); g.arc(xe,cy,9,0,7); g.fill(); } }
    g.restore(); }
  const TA=i=>C.at?C.at[i]:0.6+i*st; let curN=-1; N.forEach((q,i)=>{ if(t>=TA(i)) curN=i; });
  N.forEach((q,i)=>{ const a=ease(cl((t-TA(i))/0.45)), x=X0+i*dx, pul=(Math.sin((t-TA(i))*4)+1)/2, hi=C.at?(i===curN):(q.hi||i===n-1);
    g.save(); g.globalAlpha=0.35+0.65*a; g.fillStyle='rgba(20,20,24,0.92)'; g.strokeStyle=a>0?(hi?PINK:'rgba(235,235,238,0.7)'):'rgba(225,225,228,0.25)'; g.lineWidth=hi&&a>0?4:2.5; if(a>0&&hi){ g.shadowColor=PINK; g.shadowBlur=14+12*pul*a; } g.beginPath(); g.roundRect(x-cw/2,cy-chh/2,cw,chh,22); g.fill(); g.stroke(); g.restore();
    txt(q.k,x,cy-(q.sub?18:0),q.k.length>6?40:48,a>0&&hi?PINK:IVORY,800,'center',0.3+0.7*a); if(q.sub) txtS(q.sub,x,cy+36,26,GRAY,600,'center',0.3+0.7*a); });
  if(C.foot) txtS(C.foot,W/2,1040,22,GRAY,600,'center',1);
}
// ⑯ 금리의 바닥(floor) — 2026-11-26 대표 "왜 국채에서부터 파동이 시작되는지 코드로": 모든 금리는 국채 금리(바닥) 위에 위험 값을 얹은 것 → 바닥이 오르면 전부 같이 오른다
// cfg: {kicker,title, base:{k,v0,v1}, bars:[{k,sub,spread}], rise_at, rise_label, foot}
function floor(C,t){
  bg(); kicker(C,t);
  const B=C.bars||[], n=B.length, X0=520, X1=W-140, gy=C.gy||930, sc=C.sc||70, bw=Math.min(300,(X1-X0)/n-80), base=C.base||{k:'국채 금리',v0:4,v1:5};
  const ra=C.rise_at||(1.4+n*0.6), r=ease(cl((t-ra)/1.1)), bv=base.v0+(base.v1-base.v0)*r, by=gy-bv*sc;
  const a0=ease(cl((t-0.3)/0.5)); g.save(); g.globalAlpha=a0; g.strokeStyle='rgba(225,225,228,0.5)'; g.lineWidth=2; g.beginPath(); g.moveTo(X0-60,gy); g.lineTo(X1,gy); g.stroke(); g.restore();
  // 바닥선
  g.save(); g.globalAlpha=a0; g.setLineDash([14,10]); g.strokeStyle=PINK; g.lineWidth=3; g.beginPath(); g.moveTo(X0-60,by); g.lineTo(X1,by); g.stroke(); g.restore();
  txt(base.k,X0-40,by-16,52,PINK,800,'right',a0); txtS('모든 금리의',X0-40,by+34,40,GRAY,700,'right',a0); txtS('바닥',X0-40,by+80,40,GRAY,700,'right',a0);
  g.save(); g.globalAlpha=a0*0.9; const gb=g.createLinearGradient(0,by,0,gy); gb.addColorStop(0,'rgba(255,77,109,0.20)'); gb.addColorStop(1,'rgba(255,77,109,0.04)'); g.fillStyle=gb; g.fillRect(X0-60,by,X1-X0+60,gy-by); g.restore();
  B.forEach((q,i)=>{ const a=ease(cl((t-(C.bar_at?C.bar_at[i]:0.9+i*0.6))/0.5)); if(a<=0) return; const cx=X0+((X1-X0)/n)*(i+0.5), top=by-(q.spread||0)*sc*a;
    if(q.spread){ g.save(); g.globalAlpha=a; g.fillStyle='rgba(242,242,242,0.85)'; g.beginPath(); g.roundRect(cx-bw/2,top,bw,by-top,[14,14,0,0]); g.fill(); g.restore(); txt('+ 위험 값',cx,(top+by)/2,44,'#18181b',800,'center',a); }
    txt(q.k,cx,top-(q.sub?70:40),52,IVORY,800,'center',a); if(q.sub) txtS(q.sub,cx,top-24,24,GRAY,600,'center',a); });
  if(r>0){ // 2026-11-27 대표 '바닥 국채 금리 오르면 할 때 오르는 표시를 맞춰서': 바닥선 옆 ▲+1%p, 막대마다 위 화살표가 솟는다
    const ar=ease(cl((t-ra)/0.6)), bob=Math.sin((t-ra)*6)*4*(1-r);
    g.save(); g.globalAlpha=ar; g.fillStyle=PINK; g.beginPath(); const ax=X0-40-190, ay=by-150+bob; g.moveTo(ax,ay-26); g.lineTo(ax-24,ay+10); g.lineTo(ax+24,ay+10); g.closePath(); g.fill(); g.restore();
    txt('+1%p',X0-40-150,by-142+bob,52,PINK,800,'left',ar);
    B.forEach((q,i)=>{ const cx=X0+((X1-X0)/n)*(i+0.5), top=by-(q.spread||0)*sc; const yy=top-(q.sub?120:92)-26*r;
      g.save(); g.globalAlpha=ar*(0.9-0.5*r+0.4); g.strokeStyle=PINK; g.lineWidth=6; g.lineCap='round'; g.beginPath(); g.moveTo(cx+bw/2+34,yy+70); g.lineTo(cx+bw/2+34,yy+10); g.stroke();
      g.fillStyle=PINK; g.beginPath(); g.moveTo(cx+bw/2+34,yy-8); g.lineTo(cx+bw/2+18,yy+18); g.lineTo(cx+bw/2+50,yy+18); g.closePath(); g.fill(); g.restore(); });
  }
  if(r>0){ const al=Math.min(1,r*2); txt(C.rise_label||'바닥이 오르면, 전부 같이 오른다',W/2,C.ry||1010,56,PINK,800,'center',al); }
  if(C.foot) txtS(C.foot,W/2,1048,22,GRAY,600,'center',1);
}
window.draw=function(mode,t){ const C0=window.CFG||{}; const C=(mode==='scale')?Object.assign({fs:1.4,ky:190,shrink:0.9,top:40,vy:870},C0):C0; /* 2026-11-18 대표: 두 번째 저울만 옛 크기(글자 작고 답답) → 저울은 새 크기를 기본값으로 */ window.FS=C.fs||1; window.FS2=C.fs2||(1+(window.FS-1)*0.4); const fn=({floor,ripple,chain,corners,histchart,flow,scale,timeline,stake,race,docs,intraday,board,gauge,gauge5,btest,lchart,vs2})[mode];
  if(C0.safe===false){   // 예전 배치 (r180 이전 영상 다시 뽑을 때만)
    if(C.shrink){ bg(); g.save(); g.translate(W*(1-C.shrink)/2,C.top!=null?C.top:6); g.scale(C.shrink,C.shrink); fn(C,t); g.restore(); } else fn(C,t); return; }
  safeDraw(C,fn,t); };   // 2026-11-14: fs(글자 배율)·shrink(자막 위로 축소)

/* ★ r180 (대표 11/19 16:40, 반복 지적 — 모든 롱폼·쇼츠 고정 규칙) 코드 화면 안전 배치 — 기본값
   ① 카메라 확대·축소 없음: 화면은 고정 (본문이 그려지는 움직임만)
   ② 여백: 좌우 최소 6%(116px) · 위 머리글(목차 01/05·NEXT, y 0~70)과 부제·제목 사이 간격 · 본문은 자막 영역(아래 18%, y 885~) 위에서 끝
   방법: 본문을 다 그린 마지막 모습의 실제 범위를 한 번 재서, 안전 상자 SAFE_BOX 안에 들어가게 한 번만 줄이고(키우지 않음) 고정한다.
   부제·제목은 KY(=150) 아래, 출처 줄은 맨 아래(자막 밑) 작은 글씨로 따로. */
const SAFE_L=116, SAFE_R=W-116, SAFE_B=868, KY=150;
let _bb=null, _bbKey='';
function _measure(C,fn){
  const oc=document.createElement('canvas'); oc.width=W; oc.height=H; const g0=g; g=oc.getContext('2d');
  window.NOBG=1; window.NOKICK=1; window.MEASURING=1; try{ fn(C,60); } finally { g=g0; window.NOBG=0; window.NOKICK=0; window.MEASURING=0; }   // 2026-11-27 대표 '박스 2개가 왼쪽으로 치우침': 강조(빛·확대)가 크기 재기에 들어가 가운데가 틀어졌음 → 잴 때는 강조 끔
  const d=oc.getContext('2d').getImageData(0,0,W,H).data; let x0=W,y0=H,x1=0,y1=0;
  for(let y=0;y<H;y+=2){ const r=y*W*4; for(let x=0;x<W;x+=2){ if(d[r+x*4+3]>40){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } } }
  if(x1<=x0||y1<=y0) return {x0:0,y0:0,x1:W,y1:H}; return {x0,y0,x1:x1+2,y1:y1+2};
}
function safeDraw(C,fn,t){
  const Cb=Object.assign({},C); delete Cb.note; delete Cb.shrink; delete Cb.top;
  const key=JSON.stringify(C); if(key!==_bbKey){ _bb=C.fixed_box?{x0:C.fixed_box[0],y0:C.fixed_box[1],x1:C.fixed_box[2],y1:C.fixed_box[3]}:_measure(Cb,fn); _bbKey=key; }   // fixed_box: 클립마다 범위가 같아야 하는 화면(세로 카드 계기판)은 고정 범위로 — 클립 사이 흔들림 방지
  const top=KY+(C.title?120:40), bw=_bb.x1-_bb.x0, bh=_bb.y1-_bb.y0;
  const s=Math.min(1,(SAFE_R-SAFE_L)/bw,(SAFE_B-top)/bh);
  const cx=(_bb.x0+_bb.x1)/2, tx=W/2-cx*s, ty=top+((SAFE_B-top)-bh*s)/2-_bb.y0*s;
  window.NOBG=0; bg(); const f_=window.FS; window.FS=1; kicker0(Object.assign({},C,{ky:KY}),t); window.FS=f_;
  g.save(); g.translate(tx,ty); g.scale(s,s); window.NOBG=1; window.NOKICK=1; try{ fn(Cb,t); } finally { window.NOBG=0; window.NOKICK=0; g.restore(); }
  if(C.note) txt(C.note,SAFE_L,1052,20,GRAY,600,'left',ease(cl(t/0.8)));
  window.SAFE_INFO={s,box:[tx+_bb.x0*s,ty+_bb.y0*s,tx+_bb.x1*s,ty+_bb.y1*s]};
}
