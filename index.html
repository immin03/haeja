<style>
#splash{position:fixed;inset:0;z-index:100;background:#0E1A2B;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .45s ease;font-family:"SUIT Variable","SUIT","Pretendard Variable",system-ui,sans-serif}

#splash .sp-wm span{color:#C9A45C;font-style:italic}
#splash .sp-sub{color:#C9A45C;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;animation:spIn .7s .15s ease-out both}
#splash .sp-ko{color:rgba(255,255,255,.6);font-size:13px;animation:spIn .7s .3s ease-out both}
#splash .sp-bar{width:120px;height:2px;border-radius:1px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:18px}
#splash .sp-bar i{display:block;height:100%;width:40%;background:#C9A45C;animation:spBar 1.1s ease-in-out infinite}
@keyframes spIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes spBar{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion: reduce){#splash *{animation:none!important}}

<title>ValueNote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 장부(ledger) 느낌의 단일 컬럼 도구. 상단 고정 탭, 요약 → 상세 순서. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --ink:#16201A; --muted:#5C6A61; --line:#D9DFD9;
  --accent:#1E6A4C; --accent-soft:#E2EFE7; --warn:#9A620A; --warn-soft:#F6EAD2;
  --bad:#B3362C; --bad-soft:#F6E0DC; --up:#D2373A; --down:#2C62C9;
  --font:"Pretendard","SUIT","IBM Plex Sans KR",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px; --c-core:var(--accent); --c-exp:var(--warn); --c-cash:var(--line);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#19201C; --ink:#E5EBE6; --muted:#93A198; --line:#2A342E;
  --accent:#62C496; --accent-soft:#1C3227; --warn:#E3AA4C; --warn-soft:#382C15;
  --bad:#EA776B; --bad-soft:#3A1F1B; --up:#FF6E6E; --down:#76A2FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#19201C; --ink:#E5EBE6; --muted:#93A198; --line:#2A342E;
  --accent:#62C496; --accent-soft:#1C3227; --warn:#E3AA4C; --warn-soft:#382C15;
  --bad:#EA776B; --bad-soft:#3A1F1B; --up:#FF6E6E; --down:#76A2FF; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;word-break:keep-all;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 4px;max-width:760px;margin:0 auto;padding-inline:16px}
.brand h1{font-size:20px;margin:0;letter-spacing:-.03em;font-weight:800;line-height:1.2}
.brand-l{display:flex;flex-direction:column;min-width:0}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--muted);font-size:12px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;max-width:760px;margin:0 auto;padding-inline:12px;scrollbar-width:none}
nav.tabs button{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:inherit;font-weight:500;padding:10px 10px;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
h2{font-size:17px;margin:28px 0 10px;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:15px;margin:0 0 8px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 1px 2px rgba(22,32,26,.04),0 4px 14px rgba(22,32,26,.04)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card{box-shadow:none}}
:root[data-theme="dark"] .card{box-shadow:none}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.num{font-family:var(--font);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
body{overflow-wrap:break-word}
.check>*,.row>*{min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-good{background:var(--accent-soft);color:var(--accent)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-none{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.up{color:var(--up)} .down{color:var(--down)}
button.btn{font:inherit;font-size:14px;font-weight:500;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
button.btn.danger{color:var(--bad)}
button.btn:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:72px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:520px){.grid3{grid-template-columns:1fr 1fr}}
/* metric rows */
.metric{display:grid;grid-template-columns:1fr 96px 74px;gap:8px;align-items:center;padding-block:9px;border-bottom:1px solid var(--line)}
.metric:last-child{border-bottom:0}
.metric .lbl{min-width:0}
.metric .lbl b{font-weight:500;font-size:14px;display:block}
.metric .lbl span{font-size:12px;color:var(--muted)}
.metric input{text-align:right;padding:6px 8px;font-family:var(--mono)}
.metric .res{text-align:right}
.ai-dot{color:var(--accent);font-size:11px;margin-left:4px}
/* segmented */
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;font:inherit;font-size:13px;background:var(--bg);border:0;border-right:1px solid var(--line);color:var(--muted);padding:7px 4px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:700}
.qrow{display:grid;grid-template-columns:1fr minmax(150px,200px);gap:10px;align-items:center;padding-block:8px;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
@media (max-width:440px){.qrow{grid-template-columns:1fr}}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding-block:5px;cursor:pointer}
.chk input{width:18px;height:18px;margin-top:2px;flex:0 0 auto;accent-color:var(--accent)}
/* company chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit;text-align:left;color:var(--ink)}
.chip[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chip small{display:block;color:var(--muted);font-size:11px}
/* verdict */
.verdict{border-left:4px solid var(--line)}
.verdict.v-good{border-left-color:var(--accent)} .verdict.v-warn{border-left-color:var(--warn)} .verdict.v-bad{border-left-color:var(--bad)}
.vtitle{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:2px 0 6px}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
@media (max-width:440px){.bars{grid-template-columns:1fr 1fr}}
.bar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent)}
.kv b{display:block;font-size:18px}
.gates{display:flex;flex-direction:column;gap:4px;margin-top:12px;font-size:13px}
/* portfolio */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:520px){.summary{grid-template-columns:1fr 1fr}}
.summary .kv b{font-size:17px}
.stackbar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--bg);border:1px solid var(--line);margin-top:8px}
.stackbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:var(--c)}
.check{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding-block:9px;border-bottom:1px solid var(--line);font-size:14px}
.check:last-child{border-bottom:0}
.hold{display:flex;flex-direction:column;gap:10px}
.hold-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.hold-head .name{font-weight:700;font-size:16px}
.hold-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:13px}
@media (max-width:520px){.hold-grid{grid-template-columns:1fr 1fr}}
.hold-grid div span{display:block;color:var(--muted);font-size:11px}
.notice{font-size:13px;padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
/* rules */
.rule-group{display:flex;flex-direction:column;gap:0}
.rule{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding-block:10px;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.rule .t{font-weight:500}
.rule .th{font-family:var(--mono);font-size:13px;text-align:right;white-space:nowrap}
.rule .d{grid-column:1/-1;font-size:13px;color:var(--muted)}
.strat{display:flex;flex-direction:column;gap:6px}
.prose p{margin:0 0 10px;max-width:65ch}
.aibox{white-space:pre-wrap;font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:420px;overflow:auto}
.status-line{font-size:12px;color:var(--muted);min-height:18px}
details>summary{cursor:pointer;font-weight:500;padding-block:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* charts */
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--series:#2a78d6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--series:#3987e5}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--series:#3987e5}
.chart .ch-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.ch-box{position:relative}
.chart svg,.bchart svg{width:100%;height:auto;display:block;overflow:visible;touch-action:pan-y}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:13px;font-family:var(--mono)}
.bchart .axis{fill:var(--muted);font-size:12px;font-family:var(--mono)}
.chart .line{fill:none;stroke:var(--series);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--series);opacity:.08}
.chart .ref{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.chart .reftxt{fill:var(--ink)}
.chart .dot,.chart .hdot{fill:var(--series);stroke:var(--surface);stroke-width:2}
.chart .guide{stroke:var(--muted);stroke-width:1}
.chart .tip{position:absolute;top:0;width:150px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.bchart .bbar{fill:var(--series)} .bchart .bbar.neg{fill:var(--bad)}
.bchart .base{stroke:var(--muted);stroke-width:1}
.bchart .vlab{fill:var(--ink);font-size:11px;font-family:var(--mono)}
.bchart figcaption{margin-bottom:2px}
.segbar{display:flex;gap:2px;height:14px;border-radius:4px;overflow:hidden;margin-top:6px}
.segbar i{display:block;height:100%}
.seglegend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:12px}
.seglegend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.hbars{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.hb-row{display:grid;grid-template-columns:minmax(0,7.5em) 1fr auto;gap:8px;align-items:center;font-size:13px}
.hb-lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-track{position:relative;height:10px;background:var(--bg);border-radius:3px}
.hb-track i{position:absolute;top:0;height:100%;border-radius:3px}
.hb-track i.solo{left:0;background:var(--series)}
.hb-track.div i.pos{background:var(--up)} .hb-track.div i.neg{background:var(--down)}
.hb-track .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.hb-val{min-width:4.2em;text-align:right}
.divbox{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--bg)}
.divbox.good{border-color:var(--accent);background:var(--accent-soft)}
@media (max-width:560px){.pcharts,.grid2.hist{grid-template-columns:1fr}}

nav.subtabs{display:flex;gap:6px;overflow-x:auto;max-width:760px;margin:0 auto;padding:6px 16px 10px;scrollbar-width:none}
nav.subtabs:empty{display:none}
nav.subtabs button{flex:0 0 auto;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer}
nav.subtabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:700}
nav.tabs button{font-size:16px;padding:10px 12px}
.rseg{display:inline-flex}
.rseg button{flex:0 0 auto;padding:4px 10px}
.dropcols{} @media (max-width:560px){.dropcols{grid-template-columns:1fr}}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border-radius:10px;padding:10px;min-width:0;display:flex;flex-direction:column;gap:2px}
.slot.full{background:var(--accent-soft)} .slot.full b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.empty{border:1.5px dashed var(--line);background:var(--bg)}
.slot-w{font-size:22px;font-weight:700;color:var(--accent)}
.cmp-row{display:grid;grid-template-columns:2.6em 1fr;gap:8px;align-items:center;margin-top:6px}
.cmp-row .stackbar{margin-top:0}
.acts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.acts li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding-block:9px;border-bottom:1px solid var(--line);font-size:14px}
.acts li:last-child{border-bottom:0}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);font-weight:700;text-decoration:underline}
.linkbtn:focus-visible{outline:2px solid var(--accent)}
@media (max-width:440px){.slots{grid-template-columns:1fr}.slot{flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px 10px}.slot .bar{flex:1 1 100%}}
.br-head{margin:0;font-size:16px;font-weight:700;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.br-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.br-row{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.br-row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.br-main{display:flex;flex-direction:column;min-width:0}
.br-one{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.br-row[aria-expanded="true"] .br-one{white-space:normal}
.br-open{padding:4px 0 12px 20px;border-bottom:1px solid var(--line);font-size:14px}
.br-open p{font-size:14px}
.br-fx{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;margin-top:12px;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.qv{padding-block:10px;border-bottom:1px solid var(--line);font-size:14px}
.qv:last-child{border-bottom:0}
.qv-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px 10px;flex-wrap:wrap;margin-bottom:2px}
.qv-top b{flex:0 0 auto}
.qv-val{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;margin-left:auto}
.pf-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:14px 0 4px}

  if(isNum(val.ncavps) && val.ncavps > 0 && isNum(px) && px < val.ncavps*2/3) add(1, '청산가치보다 싸다', `순유동자산 ${fmtPx(val.ncavps, curOf(m))}의 2/3보다 낮은 가격이다.`);
  const pos = out.filter(x => x.sign > 0).length, neg = out.filter(x => x.sign < 0).length;
  const head = !out.length ? '가격을 판단할 데이터가 부족합니다' : pos > neg ? `저평가 근거 ${pos}개 · 고평가 근거 ${neg}개` : neg > pos ? `고평가 근거 ${neg}개 · 저평가 근거 ${pos}개` : `저평가·고평가 근거가 ${pos}개씩 맞섬`;
  return {items: out, pos, neg, head, ig};
}

const TREND_KW = [
  [/semiconductor/i, {ai_compute_datacenter:2, memory_hbm_supercycle:1}],
  [/electrical equipment|utilities|uranium|specialty industrial machinery|electric/i, {power_grid_nuclear:2}],
  [/aerospace|defense/i, {defense_rearmament:2, space_economy:1}],
  [/software - infrastructure|information technology services|communication equipment|computer hardware|electronic components/i, {ai_compute_datacenter:2}],
  [/biotechnology|drug manufacturers/i, {obesity_glp1:1}],
  [/marine|shipbuild|ship/i, {shipbuilding_masga:2}],
  [/robot|industrial automation/i, {physical_ai_robotics:2}],
];
let trendIndex = null;
function trendList(){ return (S.trends && S.trends.trends) || []; }
function buildTrendIndex(){
  trendIndex = {};
  trendList().forEach(t => Object.values(t.beneficiaries||{}).flat().forEach(b => {
    const mm = String(b).match(/\(([^)]+)\)/); if(!mm) return;
    mm[1].split('/').forEach(code => {
      let k = code.trim().toUpperCase().replace(/\.SH$/, '.SS');
      (trendIndex[k] ||= {})[t.key] = 3;
      const bare = k.replace(/\.(SS|SZ|HK|KS|KQ)$/, ''); (trendIndex[bare] ||= {})[t.key] = 3;
    });
  }));
}
function autoTrendLinks(r){
  if(!trendIndex) buildTrendIndex();
  const links = {...(trendIndex[(r.t||'').toUpperCase()]||{}), ...(trendIndex[(r.code||'').toUpperCase()]||{})};
  const text = (r.ind||'')+' '+(r.s||'');
  TREND_KW.forEach(([re, ks]) => { if(re.test(text)) Object.entries(ks).forEach(([k,v]) => { links[k] = Math.max(links[k]||0, v); }); });
  if((r.m==='CN'||r.m==='HK') && /technology|semiconductor|software|internet/i.test(text)) links.china_tech_selfreliance = Math.max(links.china_tech_selfreliance||0, 2);
  if((r.m==='KOSPI'||r.m==='KOSDAQ'||r.m==='KR') && /bank|insurance|capital markets|financial/i.test(text)) links.korea_valueup_governance = Math.max(links.korea_valueup_governance||0, 1);
  return links;
}
/* 트렌드 점수 0~100: 노출 강도(0~3) × 모멘텀(−2~+2) */
function trendScore(links, valScore){
  const tl = trendList(); if(!tl.length || !links) return {score:null, hits:[], warn:null};
  const hits = Object.entries(links).filter(([,s]) => s > 0).map(([k,s]) => ({t: tl.find(x => x.key === k), s})).filter(x => x.t);
  if(!hits.length) return {score:null, hits:[], warn:null};
  const vals = hits.map(({t,s}) => s/3 * (0.4 + 0.6*((t.momentum??0)+2)/4));
  const score = Math.round(100*Math.max(...vals));
  const hot = hits.find(({t,s}) => t.stage === '과열' && s >= 2);
  const warn = hot && (valScore ?? 0) < 40 ? `"${hot.t.label}"은 과열 단계입니다. 저평가 근거 없이 트렌드만으로 사면 테마 프리미엄을 비싸게 치를 수 있습니다.` : null;
  return {score, hits, warn};
}

const store = (() => {
  /* Supabase 저장소. 표 하나(docs: collection, id, data)에 아티팩트 시절 구조 그대로 저장한다.
     행 수준 보안(RLS)으로 로그인한 본인 행만 읽고 쓴다. */
  let sb = null, mode = 'init', user = null;
  const timers = {};
  const DEMO_EMAIL = 'demo@valuenote.app';
  /* 방문 기록: 기기마다 무작위 방문자 번호 하나, 페이지를 열 때마다 한 줄 */
  const sid = () => { try{ let v = localStorage.getItem('vn-sid'); if(!v){ v = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()).replace(/-/g,'').slice(0,32); localStorage.setItem('vn-sid', v); } return v; }catch(_){ return 'nosid'; } };
  const device = () => { const u = navigator.userAgent; const os = /iPhone|iPad|iPod/.test(u) ? 'iOS' : /Android/.test(u) ? 'Android' : /Mac/.test(u) ? 'Mac' : /Windows/.test(u) ? 'Windows' : '기타'; return (/Mobi|iPhone|Android/.test(u) ? '모바일' : 'PC') + ' · ' + os; };
  const refHost = () => { try{ if(!document.referrer) return ''; const h = new URL(document.referrer).hostname; return h === location.hostname ? '' : h; }catch(_){ return ''; } };
  return {
    get mode(){ return mode },
    get user(){ return user },
    get client(){ return sb },
    get isDemo(){ return !!user && user.email === DEMO_EMAIL },
    get isGuest(){ return mode === 'guest' },
    async track(kind, page){
      try{ if(!sb) return;
        /* 로컬 테스트·자동화 브라우저는 집계하지 않는다 */
        if(/^(localhost|127\.|0\.0\.0\.0|192\.168\.)/.test(location.hostname) || location.protocol === 'file:' || navigator.webdriver) return;
        const q = new URLSearchParams(location.search);
        let ref = q.get('utm_source') || q.get('ref') || refHost();
        try{ if(ref && !localStorage.getItem('vn-ref')) localStorage.setItem('vn-ref', ref); if(kind !== 'visit') ref = localStorage.getItem('vn-ref') || ref; }catch(_){}
        await sb.from('events').insert({ kind, sid: sid(), path: (page ? '/' + page : location.pathname).slice(0, 200), ref: ref.slice(0, 300), device: device() }); }catch(_){}
    },
    async init(){
      const C = window.HAEJA_CONFIG || {};
      if(!window.supabase || !C.SUPABASE_URL || !C.SUPABASE_ANON_KEY){ mode = 'noconfig'; return; }
      sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
      const { data: { session } } = await sb.auth.getSession();
      if(session){ try{ if(localStorage.getItem('vn-noauto') === '1' && !sessionStorage.getItem('vn-live')){ await sb.auth.signOut(); mode = 'login'; this.track('visit'); return; } sessionStorage.setItem('vn-live', '1'); }catch(_){} }
      if(!session){
        /* 로그인 없이 둘러보기: 로그인 안 된 사람은 누구나 바로 둘러보기 화면으로. ?login·?signup 링크만 로그인 화면 */
        const wantLogin = /[?&#](login|signup)/.test(location.search + location.hash);

      user = session.user; mode = 'db'; this.track('visit');

    async login(email, password){

      return r;
    },
    async signup(email, password){
      const at = new Date().toISOString();
      const r = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin, data: { agreed: at, terms: '2026-10-15', privacy: '2026-10-15', age14: true } } });
      if(!r.error) await this.track('signup');
      return r;
    },
    async logout(){ await sb.auth.signOut(); location.reload(); },
    sub(col, cb){
      const load = async () => {
        const rows = []; let from = 0;
        for(;;){
          const { data, error } = await sb.from('docs').select('id,data').eq('collection', col).range(from, from + 999);
          if(error){ setSave('연결 오류: ' + error.message); return; }
          rows.push(...data); if(data.length < 1000) break; from += 1000;
        }
        cb(rows.map(r => ({ id: r.id, ...r.data })));
      };
      load();
      sb.channel('docs-' + col)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'docs', filter: 'collection=eq.' + col }, () => { clearTimeout(timers[col]); timers[col] = setTimeout(load, 300); })
        .subscribe();
    },
    async set(col, id, data){
      if(this.isDemo || this.isGuest) return; /* 체험 계정·둘러보기: 저장하지 않음 (화면 위 안내 띠로 알림) */

    }
  };

  if(q.circle === false) gates.push({ok:false, t:'능력 범위 밖. 사업을 설명할 수 없으면 사지 않음'});

  // 6. 종합 점수: 숫자 근접도(b) 75% + 정성 25%

}

  const t = (h.ticker||'').trim().toUpperCase(); if(!t) return null;
  return S.companies.find(x => (x.ticker||'').trim().toUpperCase() === t || (x.yf||'').toUpperCase() === t) || null;
}

/* ============ 흔들린 날: 하루 변동을 기회로 바꿔 보여 준다 ============ */
function dayChgOf(...keys){
  for(const k of keys){ if(!k) continue; const d = (S.prices[normKey(k)]?.daily || []).filter(p => isNum(p[1])); if(d.length >= 2 && d[d.length - 2][1] > 0) return (d[d.length - 1][1] / d[d.length - 2][1] - 1) * 100; }
  return null;
}
function dipCard(dayPct){
  const req = cfg().reqMOS ?? 30;
  /* 좋은 회사(근접도 75+) 중 적정 매수가 위 10% 이내 또는 그 아래로 내려온 곳 */
  const near = (S2.screen?.length ? scoredRows() : []).filter(r => isNum(r.b) && r.b >= 75 && isNum(r.mos) && r.mos >= req - 10)
    .map(r => { const gap = ((1 - r.mos / 100) / (1 - req / 100) - 1) * 100; return { r, gap, day: dayChgOf(r.code, r.t) }; })
    .sort((a, b) => a.gap - b.gap);
  const fell = near.filter(x => isNum(x.day) && x.day <= -3);
  const rough = isNum(dayPct) && dayPct <= -2;
  if(!rough && !fell.length) return '';
  const list = (fell.length ? fell : near).slice(0, 3);
  return `<div class="card dip-card">
    <div class="eyebrow">${rough ? '시장이 흔들린 날' : '오늘 크게 내린 좋은 회사'}</div>
    <h3>${rough ? `오늘 계좌가 ${pct(dayPct)} 움직였어요. 팔 이유가 생긴 건지, 살 기회가 생긴 건지부터 보세요.` : `좋은 회사 ${fell.length}곳이 오늘 3% 넘게 내렸어요.`}</h3>
    ${list.length ? `<div class="small muted" style="margin:8px 0 6px">적정 매수가 근처까지 내려온 좋은 회사 ${near.length}곳</div>
    <div class="dip-list">${list.map(({ r, gap, day }) => `<button type="button" class="dip-row" data-act="sc-import" data-t="${esc(r.t)}">
      <span class="dip-n"><b>${esc(r.n)}</b><small>버핏 근접도 ${r.b}${isNum(day) ? ` · 오늘 ${pct(day)}` : ''}</small></span>
      <span class="dip-g ${gap <= 0 ? 'in' : ''}">${gap <= 0 ? '적정 매수가 아래' : `매수가까지 −${fmt(gap, 0)}%`}</span></button>`).join('')}</div>` : ''}
    <p class="small muted" style="margin:10px 0 0">하루 등락은 소음일 때가 많아요. 회사의 이익이 줄었는지만 확인하면 됩니다.</p>
  </div>`;
}

/* ============ 포트폴리오 ============ */
function holdingCalc(h){
  const fx = fxOf(h.currency || curOf(h.market));
  const value = (h.qty||0)*(h.price||0)*fx, cost = (h.qty||0)*(h.avg||0)*fx;
  return {value, cost, pl: value-cost, plPct: cost ? (value/cost-1)*100 : null};
}
function portfolioChecks(rows, total, cashW){
  const out = [];
  const stocks = rows.filter(r => r.h.kind === 'stock');
  rows.forEach(({h, calc, c, ev, w}) => {
    if(h.kind === 'lev') out.push(['bad', `${h.name}: 레버리지 상품. 원칙상 비중 0%. 정리 시점을 결정 일지에 기록`]);
    else if(h.kind === 'etf') out.push(['warn', `${h.name}: 지수 ETF는 현금 대용으로만 인정`]);
    else if(!c) out.push(['warn', `${h.name}: 심사 기록 없이 보유 중. 종목 심사부터 작성`]);
    else {
      if(ev.verdict !== '매수 후보' && ev.verdict !== '도전 후보') out.push(['warn', `${h.name}: 심사 결과 "${ev.verdict}" 상태로 보유`]);
      if(!ev.memoOk) out.push(['warn', `${h.name}: 투자 이유와 매도 조건 2개 이상이 필요`]);
      if(c.thesis?.status === '훼손') out.push(['bad', `${h.name}: 투자 논리 훼손. 매도 검토`]);
      if(c.thesis?.reviewDate && c.thesis.reviewDate < today()) out.push(['warn', `${h.name}: 점검일(${c.thesis.reviewDate}) 지남`]);
    }
    if(ev && w > ev.maxW + 0.5 && h.kind === 'stock') out.push(['warn', `${h.name}: 비중 ${fmt(w,1)}%가 허용 상한 ${ev.maxW}%를 넘음`]);
    if(isNum(calc.plPct) && calc.plPct <= -30 && h.kind === 'stock') out.push(['warn', `${h.name}: ${fmt(calc.plPct,1)}% 손실. 물타기 전에 논리부터 다시 쓰기`]);
  });
  if(stocks.length > 4) out.push(['warn', `개별 종목 ${stocks.length}개. 집중 원칙은 최대 4개`]);
  if(total > 0 && cashW < 10) out.push(['warn', `현금 비중 ${fmt(cashW,1)}%. 기회 대기 자금 10~25% 권장`]);
  return out;
}
/* ============ 집중 구조: 주력 3종목 70~80% · 도전 ≤10% · 현금 10~20% (자동 분류) ============ */
const PLAN = {coreN:3, coreLo:70, coreHi:80, slotLo:20, slotHi:35, slotMax:40, expMax:10, cashLo:10, cashHi:20};
function earnsMoney(c){ const v = c?.val || {}, f = c?.fin || {}; return isNum(v.eps) && v.eps > 0 && !((f.lossYears||0) >= 2); }
/* 보유 종목을 주력/도전/현금성으로 자동 분류한다. 사용자가 고르지 않는다 */
function autoBucket(r){
  const {h, c, ev} = r;
  if(h.kind === 'lev') return {k:'explore', why:'레버리지 상품: 매일 재조정돼 오래 들고 있으면 가치가 깎인다'};
  if(h.kind === 'etf') return {k:'cash', why:'지수 ETF: 현금 대용으로 본다'};
  if(!c || !ev) return {k:'explore', why:'심사 기록이 없어 주력으로 인정하지 않는다'};
  if(ev.gates.length) return {k:'explore', why:'탈락 사유: '+ev.gates[0].t};
  if(c.qual?.revModel === '혁신 의존형') return {k:'explore', why:'혁신 의존형: 아직 꾸준한 이익이 증명되지 않은 미래 기대 사업'};
  if(!earnsMoney(c)) return {k:'explore', why:'이익이 증명되지 않았다(적자 또는 잦은 적자)'};
  if(c.qual?.hold10 === false) return {k:'explore', why:'10년 보유 테스트 미통과'};
  if(isNum(ev.qScore) && ev.qScore < 60) return {k:'explore', why:`품질 점수 ${ev.qScore}점 (주력 기준 60점)`};
  return {k:'core', why:`이익이 증명된 사업 · 품질 ${ev.qScore ?? '–'}점 · ${ev.verdict}`};
}
const IND_MAP = [[/보험|insurance/i,'보험'],[/은행|bank/i,'은행'],[/자동차|auto/i,'자동차'],[/반도체|semiconductor/i,'반도체'],[/소프트웨어|software/i,'소프트웨어'],[/통신|telecom/i,'통신'],[/석유|정유|oil|gas|에너지|energy/i,'에너지'],[/물류|해운|logistics|shipping|freight|trucking/i,'물류'],[/의류|신발|apparel|footwear|textile/i,'의류'],[/결제|payment|credit services/i,'결제'],[/우주|항공|aerospace|space/i,'우주항공'],[/가전|appliance/i,'가전']];
const indOf = c => { const t = [c?.profile?.industry, c?.sector].filter(Boolean).join(' '); if(!t) return ''; const m = IND_MAP.find(([re]) => re.test(t)); return m ? m[1] : t.trim(); };
/* 빈 주력 자리를 채울 후보: 관심 후보·내 종목 중 주력 조건을 통과하고 기존 주력과 업종이 겹치지 않는 회사 */
function coreCandidates(coreRows, n){
  const held = new Set(S.holdings.map(h => companyFor(h)?.id).filter(Boolean));
  const inds = new Set(coreRows.map(r => indOf(r.c)).filter(Boolean));
  let cyc = coreRows.filter(r => r.c?.qual?.revModel === '사이클형').length;
  const RANK = {'매수 후보':0, '좋은 회사, 가격 대기':1, '숫자 우수 · 정성 평가 필요':2, '근접 · 관찰':3};
  const pool = S.companies.filter(c => !held.has(c.id) && c.kind === 'stock' && (c.watch === true || c.pinned || (c.thesis?.memo||'').trim()))
    .map(c => ({c, ev: evaluate(c)}))
    .filter(x => x.ev.verdict in RANK && autoBucket({h:{kind:'stock'}, c:x.c, ev:x.ev}).k === 'core' && x.ev.dataConf !== 'low')
    .sort((a,b) => RANK[a.ev.verdict] - RANK[b.ev.verdict] || (b.ev.total??0) - (a.ev.total??0));
  const out = [];
  for(const x of pool){
    if(out.length >= n) break;
    const ind = indOf(x.c); if(ind && inds.has(ind)) continue;
    const isCyc = x.c.qual?.revModel === '사이클형'; if(isCyc && cyc >= 1) continue;
    out.push(x); if(ind) inds.add(ind); if(isCyc) cyc++;
  }
  return out;
}
function concPlan(rows, total, cashW){
  const R = rows.map(r => ({...r, bk: autoBucket(r)}));
  const core = R.filter(r => r.bk.k === 'core').sort((a,b) => b.w - a.w);
  const exp = R.filter(r => r.bk.k === 'explore');
  const cashLike = R.filter(r => r.bk.k === 'cash').reduce((a,r) => a + r.w, 0);
  const coreW = core.reduce((a,r) => a + r.w, 0), expW = exp.reduce((a,r) => a + r.w, 0), cashAll = cashW + cashLike;
  const top3 = [...R].sort((a,b) => b.w - a.w).slice(0,3).reduce((a,r) => a + r.w, 0);
  const cands = core.length < PLAN.coreN ? coreCandidates(core, PLAN.coreN - core.length) : [];
  const won = p => fmtKRW(total*p/100);
  const acts = [];
  const lev = exp.filter(r => r.h.kind === 'lev');
  if(lev.length) acts.push({lv:'bad', short:`${lev.map(r => r.h.ticker || r.h.name).join(', ')} 정리 1순위 — 레버리지는 원칙상 0% (지금 ${fmt(lev.reduce((a,r)=>a+r.w,0),0)}%)`, t:`${lev.map(r => r.h.name.replace(/\s*\(.*\)$/,'')).join(', ')} 정리가 1순위다. 레버리지 상품은 규칙상 비중 0%이고 현재 ${fmt(lev.reduce((a,r)=>a+r.w,0),0)}%(${won(lev.reduce((a,r)=>a+r.w,0))})다.`});
  if(expW > PLAN.expMax + 0.5){
    const order = [...exp].sort((a,b) => (a.h.kind==='lev'?0:!earnsMoney(a.c)?1:2) - (b.h.kind==='lev'?0:!earnsMoney(b.c)?1:2) || b.w - a.w);
    acts.push({lv:'warn', short:`도전 ${fmt(expW,0)}% → 10% 이하로. 줄일 순서: ${order.map(r => r.h.name.replace(/\s*\(.*\)$/,'')).join(' → ')}`, t:`도전 칸이 ${fmt(expW,0)}%로 상한 ${PLAN.expMax}%보다 ${fmt(expW-PLAN.expMax,0)}%p 많다. 약 ${won(expW-PLAN.expMax)}어치를 줄여 주력 칸으로 옮기는 것이 목표다. 줄이는 순서: ${order.map(r => r.h.name.replace(/\s*\(.*\)$/,'')).join(' → ')}. 한 번에 맞출 필요는 없고, 매도 조건에 닿거나 반등할 때마다 나눠 옮긴다.`});
  }
  if(core.length < PLAN.coreN){
    acts.push({lv:'warn', short:`주력 자리 ${PLAN.coreN - core.length}개 비어 있음. 새 돈은 주력 칸(매수 후보)으로만`, t:`주력 자리 ${PLAN.coreN}개 중 ${core.length}개가 차 있다. ${cands.length ? '빈 자리 후보: '+cands.map(x => `${x.c.name}(${x.ev.verdict})`).join(', ')+'.' : '조건을 통과한 후보가 아직 없다. 관심 후보가 매주 월요일 다시 선정된다.'} 매수는 판정이 "매수 후보"이거나 매수 가격 이하일 때만 한다.`});
  } else if(core.length > PLAN.coreN){
    const weakest = [...core].sort((a,b) => (a.ev?.total??0) - (b.ev?.total??0))[0];
    acts.push({lv:'warn', t:`주력이 ${core.length}개다. 3개로 압축하려면 종합 점수가 가장 낮은 ${weakest.h.name}부터 검토한다.`});
  }
  core.forEach(r => { if(r.w > PLAN.slotMax) acts.push({lv:'warn', t:`${r.h.name} 한 종목이 ${fmt(r.w,0)}%다. 한 종목 상한은 ${PLAN.slotMax}%.`}); });
  if(coreW < PLAN.coreLo && core.length) acts.push({lv:'none', short:`주력 비중 ${fmt(coreW,0)}% → 70~80%`, t:`주력 비중 ${fmt(coreW,0)}% → 목표 ${PLAN.coreLo}~${PLAN.coreHi}%. 새로 넣는 돈과 도전 칸 정리금은 주력 칸으로만 보낸다.`});
  if(cashAll < PLAN.cashLo) acts.push({lv:'none', short:`현금 ${fmt(cashAll,0)}% → 10~20% (설정에서 예수금 입력)`, t:`현금 ${fmt(cashAll,0)}%. 폭락 때 주력 종목을 더 살 대기 자금 ${PLAN.cashLo}~${PLAN.cashHi}%를 둔다. 예수금은 설정에서 자동 반영된다.`});
  core.forEach(r => { if(r.ev && isNum(r.ev.mos) && r.ev.mos < -10) acts.push({lv:'warn', t:`${r.h.name}: 주가가 내재가치보다 ${fmt(-r.ev.mos,0)}% 높다. 매도 조건(내재가치 초과)을 점검할 시점이다.`}); });
  if(!acts.length) acts.push({lv:'good', t:'구조가 목표 안에 있다. 할 일은 매도 조건 점검과 분기 실적 확인뿐이다.'});
  /* 균형 점검 */
  const bal = [];
  const indsCore = core.map(r => indOf(r.c)).filter(Boolean);
  const dupInd = indsCore.length !== new Set(indsCore).size;
  const cycN = core.filter(r => r.c?.qual?.revModel === '사이클형').length;
  const mkts = new Set(core.map(r => grpOf(r.h.market)));
  bal.push({ok: !dupInd, t:'주력 종목끼리 업종이 겹치지 않는다', why: dupInd ? '같은 업종 두 개는 같은 이유로 함께 떨어진다' : ''});
  bal.push({ok: cycN <= 1, t:'경기를 타는 사업(사이클형)은 주력 중 1개 이하', why: cycN > 1 ? `사이클형 ${cycN}개. 불황에 동시에 이익이 줄어든다` : ''});
  bal.push({ok: !core.some(r => r.w > PLAN.slotMax), t:`한 종목 ${PLAN.slotMax}% 이하`});
  bal.push({ok: !core.some(r => r.c?.profile?.dividend?.safety === '위험'), t:'주력 종목 중 배당 삭감 위험 없음'});
  bal.push({ok: core.length < 2 || mkts.size >= 2 || core.every(r => r.c?.qual?.revModel === '통행료형'), t:'한 나라 경기에만 기대지 않는다', why: core.length >= 2 && mkts.size < 2 ? '주력이 모두 한 시장이다. 통행료형이면 괜찮다' : ''});
  return {R, core, exp, coreW, expW, cashAll, top3, cands, acts, bal};
}

function viewPortfolio(){
  const st = cfg();
  if(!S.loaded.h) return `<div class="empty">보유 종목을 불러오는 중</div>`;
  const rows0 = S.holdings.map(h => { const c = companyFor(h); return {h, calc: holdingCalc(h), c, ev: c ? evaluate(c) : null}; });

/* ===== 메가트렌드 사이클: 수혜 기업 묶음 지수 (trends/series) ===== */
const TR_RANGES = [['3M','3개월',3],['6M','6개월',6],['1Y','1년',12],['5Y','5년',60]];
const TCOL_FB = ['#B08A3E','#5C6F8C','#4F7F76','#A8654A','#6B6799','#C2B08A','#7D8C4A','#A35A6B','#3E8AA0','#8E7356','#5B8A5E','#8A5FA0'];
const TCOL = i => `var(--s${i%12+1}, ${TCOL_FB[i%12]})`;
function trSeries(key, rg){
  const sr = S.trendSeries; if(!sr) return null;
  const R = TR_RANGES.find(r => r[0] === rg) || TR_RANGES[2];
  const src = rg === '5Y' ? sr.w?.[key] : sr.d?.[key]; if(!src || src.length < 2) return null;
  const end = new Date(src.at(-1)[0] + 'T00:00:00Z'); end.setUTCMonth(end.getUTCMonth() - R[2]);
  const from = end.toISOString().slice(0,10);
  const pts = src.filter(p => p[0] >= from); if(pts.length < 2) return null;
  const b = pts[0][1]; return pts.map(([d,v]) => [d, Math.round(v/b*1000)/10]);
}
/* 기간 수익률과 5년 안의 위치로 사이클 국면을 정한다 */
function trCycle(key){
  const sr = S.trendSeries; const w = sr?.w?.[key], d = sr?.d?.[key]; if(!w || w.length < 20) return null;
  const ret = rg => { const p = trSeries(key, rg); return p ? p.at(-1)[1] - 100 : null; };
  const vs = w.map(p => p[1]);
  const lastW = w.at(-1)[1], hi = Math.max(...vs), lo = Math.min(...vs);
  const pos = hi > lo ? (lastW - lo)/(hi - lo)*100 : 50, dd = (lastW/hi - 1)*100;
  const r3 = ret('3M'), r6 = ret('6M'), r1 = ret('1Y'), r5 = ret('5Y');
  let ph, lv;
  if(pos >= 85 && (r6 ?? 0) > 0){ ph = '고점권'; lv = 'warn'; }
  else if(pos <= 25){ ph = (r3 ?? 0) > 0 ? '바닥 반등' : '바닥권'; lv = 'good'; }
  else if((r6 ?? 0) > 0 && (r3 ?? 0) >= 0){ ph = '상승'; lv = 'good'; }
  else if((r6 ?? 0) > 0){ ph = '상승 후 조정'; lv = 'warn'; }
  else if((r3 ?? 0) > 0){ ph = '반등 시도'; lv = 'none'; }
  else { ph = '하락'; lv = 'bad'; }
  return {r3, r6, r1, r5, pos, dd, ph, lv};
}

  const id = 'mc'+(++chSeq), W = opts.w || Math.max(300, Math.min(560, (window.innerWidth||560) - 72)), H = opts.h || 240, L = 4, R = 46, T = 12, B = 22;
  const all = lines.flatMap(l => l.points.map(p => p[1]));
  let lo = Math.min(100, ...all), hi = Math.max(100, ...all); const pad = (hi-lo)*0.06 || 5; lo -= pad; hi += pad;
  const log = hi/lo > 4; const tv = v => log ? Math.log(v) : v;
  const y = v => T + (H-T-B)*(1-(tv(v)-tv(lo))/(tv(hi)-tv(lo)));
  const dates = [...new Set(lines.flatMap(l => l.points.map(p => p[0])))].sort();
  const di = Object.fromEntries(dates.map((d,i) => [d,i])); const n = dates.length;
  const x = i => L + (W-L-R)*i/Math.max(1,n-1);
  let ticks = log ? [25,50,100,150,200,300,400,600,800,1200,1600,2400,3200,4800].filter(t => t>=lo && t<=hi) : niceTicks(lo, hi, 4);
  if(ticks.length > 6) ticks = ticks.filter((t,i) => t === 100 || i % 2 === 0);
  const focus = opts.focus;
  const path = l => l.points.map((p,i) => `${i?'L':'M'}${x(di[p[0]]).toFixed(1)},${y(p[1]).toFixed(1)}`).join('');
  const mid = Math.floor((n-1)/2);
  MCH[id] = {lines, dates, di, x, y, W, H, T, B};
  const order = [...lines].sort((a,b) => (a.key===focus) - (b.key===focus));
  return `<figure class="mchart${focus?' has-focus':''}" data-mc="${id}" style="margin:0"><div class="ch-box">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||'트렌드 지수 비교')}">
      ${ticks.map(t => `<line x1="${L}" x2="${W-R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" class="grid${t===100?' base100':''}"/><text x="${W-R+6}" y="${(y(t)+4).toFixed(1)}" class="axis">${t}</text>`).join('')}
      ${order.map(l => `<path d="${path(l)}" class="mline${l.dash?' dash':''}${focus && l.key!==focus?' dim':''}${focus===l.key?' on':''}" style="stroke:${l.color};stroke-width:${l.w||2}"/>`).join('')}
      ${order.filter(l => !l.dash).map(l => { const p = l.points.at(-1); return `<circle cx="${x(di[p[0]]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="3" style="fill:${l.color}" class="${focus && l.key!==focus?'dim':''}"/>`; }).join('')}
      <text x="${L}" y="${H-6}" class="axis">${esc(dates[0].slice(2))}</text>
      <text x="${x(mid).toFixed(1)}" y="${H-6}" class="axis" text-anchor="middle">${esc(dates[mid].slice(2))}</text>
      <text x="${W-R}" y="${H-6}" class="axis" text-anchor="end">${esc(dates.at(-1).slice(2))}</text>
      <line class="guide" x1="0" x2="0" y1="${T}" y2="${H-B}" style="display:none"/>
      <rect x="0" y="0" width="${W-R}" height="${H}" fill="transparent"/>
    </svg><div class="tip mtip" style="display:none"></div></div></figure>`;
}
document.addEventListener('pointermove', e => {
  const fig = e.target.closest && e.target.closest('figure.mchart'); if(!fig) return;
  const c = MCH[fig.dataset.mc]; const svg = fig.querySelector('svg'); if(!c || !svg) return;
  const r = svg.getBoundingClientRect(); const sx = (e.clientX - r.left) * c.W / r.width;
  const n = c.dates.length; let i = Math.round((sx - c.x(0)) / (c.x(n-1) - c.x(0)) * (n-1)); i = Math.max(0, Math.min(n-1, i));
  const d = c.dates[i], px = c.x(i);
  const g = svg.querySelector('.guide'); g.setAttribute('x1', px); g.setAttribute('x2', px); g.style.display = '';
  const vals = c.lines.map(l => { let v = null; for(const p of l.points){ if(p[0] <= d) v = p[1]; else break; } return {l, v}; }).filter(o => o.v !== null).sort((a,b) => b.v - a.v);
  const tip = fig.querySelector('.tip');
  tip.innerHTML = `<div class="muted num">${esc(d)}</div>` + vals.slice(0, 8).map(o => `<div class="mt-row"><i style="background:${o.l.color}"></i><span>${esc(o.l.label)}</span><b class="num ${o.v>=100?'up':'down'}">${pct(o.v-100)}</b></div>`).join('');
  tip.style.display = ''; const left = px / c.W * r.width; tip.style.left = (left > r.width/2 ? Math.max(0, left - 190) : Math.min(left + 12, r.width - 180)) + 'px';
});
document.addEventListener('pointerout', e => {
  const fig = e.target.closest && e.target.closest('figure.mchart'); if(!fig || fig.contains(e.relatedTarget)) return;
  fig.querySelectorAll('.guide,.tip').forEach(el => el.style.display = 'none');
});

}
function trBenchLines(rg){

  return out;
}
function trCompareChart(h, big){

const CH = {}; let chSeq = 0;
function niceTicks(lo, hi, n=3){
  const span = hi - lo || Math.abs(hi) || 1; const raw = span / n;
  const mag = Math.pow(10, Math.floor(Math.log10(raw))); const step = [1,2,2.5,5,10].map(s => s*mag).find(s => s >= raw) || raw;
  const out = []; for(let v = Math.ceil(lo/step)*step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10)); return out;
}
/* 선 차트: points [[날짜, 값]], opts {ref, refLabel, fmtV, h, label} */
function lineChart(points, opts={}){
  points = (points||[]).filter(p => p && isNum(p[1]));
  if(points.length < 2) return `<div class="small muted">가격 기록이 쌓이면 차트가 표시됩니다.</div>`;
  const id = 'ch'+(++chSeq), W = 520, H = opts.h || 220, L = 4, R = 70, T = 14, B = 24;
  const vs = points.map(p => p[1]); if(isNum(opts.ref)) vs.push(opts.ref);
  let lo = Math.min(...vs), hi = Math.max(...vs); const pad = (hi - lo)*0.08 || Math.abs(hi)*0.05 || 1; lo -= pad; hi += pad;
  const x = i => L + (W-L-R)*i/(points.length-1), y = v => T + (H-T-B)*(1-(v-lo)/(hi-lo));
  const f = opts.fmtV || (v => fmt(v, Math.abs(v) < 100 ? 2 : 0));
  const d = points.map((p,i) => `${i?'L':'M'}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join('');
  const area = d + `L${x(points.length-1).toFixed(1)},${H-B}L${x(0).toFixed(1)},${H-B}Z`;
  const ticks = niceTicks(lo, hi, 3);
  const first = points[0][1], last = points.at(-1)[1], chg = (last/first - 1)*100;
  const mid = Math.floor((points.length-1)/2);
  CH[id] = {points, f, x, y, W, H, T, B};
  return `<figure class="chart" data-ch="${id}" style="margin:0">
    <div class="ch-head"><span class="small muted num">${esc(points[0][0])} → ${esc(points.at(-1)[0])}</span><span class="small num"><b>${esc(f(last))}</b> <span class="${chg>=0?'up':'down'}">${pct(chg)}</span></span></div>
    <div class="ch-box">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||'가격 추이')}: ${esc(points[0][0])} ${esc(f(first))}에서 ${esc(points.at(-1)[0])} ${esc(f(last))}">
      ${ticks.map(t => `<line x1="${L}" x2="${W-R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" class="grid"/><text x="${W-R+6}" y="${(y(t)+4).toFixed(1)}" class="axis">${esc(f(t))}</text>`).join('')}
      <path d="${area}" class="area"/>
      ${isNum(opts.ref) ? `<line x1="${L}" x2="${W-R}" y1="${y(opts.ref).toFixed(1)}" y2="${y(opts.ref).toFixed(1)}" class="ref"/><text x="${L+4}" y="${(y(opts.ref)-5).toFixed(1)}" class="axis reftxt">${esc(opts.refLabel||'기준')} ${esc(f(opts.ref))}</text>` : ''}
      <path d="${d}" class="line"/>
      <circle cx="${x(points.length-1).toFixed(1)}" cy="${y(last).toFixed(1)}" r="4" class="dot"/>
      <text x="${L}" y="${H-6}" class="axis">${esc(points[0][0].slice(2))}</text>
      <text x="${x(mid).toFixed(1)}" y="${H-6}" class="axis" text-anchor="middle">${esc(points[mid][0].slice(2))}</text>
      <text x="${W-R}" y="${H-6}" class="axis" text-anchor="end">${esc(points.at(-1)[0].slice(2))}</text>
      <line class="guide" x1="0" x2="0" y1="${T}" y2="${H-B}" style="display:none"/><circle class="hdot" r="5" style="display:none"/>
      <rect x="0" y="0" width="${W-R}" height="${H}" fill="transparent" class="hit"/>
    </svg><div class="tip" style="display:none"></div></div>
  </figure>`;
}
document.addEventListener('pointermove', e => {
  const fig = e.target.closest && e.target.closest('figure.chart'); if(!fig) return;
  const c = CH[fig.dataset.ch]; const svg = fig.querySelector('svg'); if(!c || !svg) return;
  const r = svg.getBoundingClientRect(); const sx = (e.clientX - r.left) * c.W / r.width;
  const n = c.points.length; let i = Math.round((sx - c.x(0)) / (c.x(n-1) - c.x(0)) * (n-1)); i = Math.max(0, Math.min(n-1, i));
  const p = c.points[i], px = c.x(i), py = c.y(p[1]);
  const g = svg.querySelector('.guide'), hd = svg.querySelector('.hdot'), tip = fig.querySelector('.tip');
  g.setAttribute('x1', px); g.setAttribute('x2', px); g.style.display = ''; hd.setAttribute('cx', px); hd.setAttribute('cy', py); hd.style.display = '';
  const chg = (p[1]/c.points[0][1]-1)*100;
  tip.innerHTML = `<b class="num">${esc(c.f(p[1]))}</b><br><span class="muted num">${esc(p[0])} · 시작 대비 ${pct(chg)}</span>`;
  tip.style.display = ''; const left = px / c.W * r.width; tip.style.left = Math.min(Math.max(left - 70, 0), r.width - 150) + 'px';
});
document.addEventListener('pointerout', e => {

/* 연도별 막대: 음수는 기준선 아래로 */
function barChart(labels, values, opts={}){
  const vals = (values||[]).map(v => isNum(v) ? v : null);
  if(vals.filter(isNum).length < 2) return `<div class="small muted">연도별 데이터가 부족합니다.</div>`;
  const W = 300, H = 150, T = 18, B = 20, L = 4, R = 4; const n = vals.length;
  const mx = Math.max(0, ...vals.filter(isNum)), mn = Math.min(0, ...vals.filter(isNum)); const span = (mx - mn) || 1;
  const y = v => T + (H-T-B)*(mx - v)/span; const bw = (W-L-R)/n*0.56, gap = (W-L-R)/n;
  const f = opts.fmtV || (v => fmt(v,0));
  return `<figure class="bchart" style="margin:0"><figcaption class="small"><b>${esc(opts.title||'')}</b> <span class="muted">${esc(opts.unit||'')}</span></figcaption>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.title||'')}: ${labels.map((l,i) => `${l} ${isNum(vals[i])?f(vals[i]):'없음'}`).join(', ')}">
    <line x1="${L}" x2="${W-R}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}" class="base"/>
    ${vals.map((v,i) => { const cx = L + gap*i + gap/2; if(!isNum(v)) return `<text x="${cx}" y="${(y(0)-4).toFixed(1)}" class="axis" text-anchor="middle">–</text>`;
      const y0 = y(Math.max(v,0)), h = Math.max(1, Math.abs(y(v)-y(0)));
      const lab = v >= 0 ? y0 - 4 : y(v) + 12;
      return `<g><title>${esc(labels[i])}: ${esc(f(v))} ${esc(opts.unit||'')}</title><rect x="${(cx-bw/2).toFixed(1)}" y="${y0.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" class="${v<0?'bbar neg':'bbar'}"/>
        <text x="${cx}" y="${lab.toFixed(1)}" class="vlab" text-anchor="middle">${esc(f(v))}</text></g>`; }).join('')}
    ${labels.map((l,i) => `<text x="${L + gap*i + gap/2}" y="${H-5}" class="axis" text-anchor="middle">${esc(String(l).replace('FY',"'").replace(/^20/,"'"))}</text>`).join('')}
  </svg></figure>`;
}

    <div class="seglegend">${items.map((s,i) => `<span><i style="background:var(--s${i%6+1})"></i>${esc(s.name)} <b class="num">${fmt(s.share, s.share<10?1:0)}%</b></span>`).join('')}</div>`;

/* 가로 막대(값 라벨 포함). rows [{label, v, sub}] */

    return `<div class="hb-row"><span class="hb-lab">${esc(r.label)}</span>${bar}<span class="hb-val num ${diverge?(r.v>=0?'up':'down'):''}">${esc(opts.fmtV ? opts.fmtV(r.v) : fmt(r.v,1))}</span></div>`; }).join('')}</div>`;

/* ============ 기간 선택 가격 차트 ============ */
const PC = {}; let pcSeq = 0;
const RANGES = [['1M','1개월'],['3M','3개월'],['1Y','1년'],['5Y','5년']];
function seriesFor(key){
  const d = S.prices[normKey(key)]; if(d) return {daily:d.daily||[], weekly:d.points||[], monthly:d.monthly||[]};
  const f = S.fx?.series?.[key] || S.rates?.series?.[key]; if(f) return {daily:f.daily||[], weekly:f.points||[], monthly:f.monthly||[]};
  return null;
}
function rangePoints(s, r){
  const d = s.daily, w = s.weekly, m = s.monthly;
  if(r === '1M') return d.length >= 5 ? d.slice(-22) : [];
  if(r === '3M') return d.length >= 20 ? d.slice(-66) : w.slice(-14);
  if(r === '1Y') return w.length >= 10 ? w.slice(-53) : m.slice(-13);
  return m.length >= 6 ? m : w;
}
function priceChart(key, opts={}){
  const s = seriesFor(key); if(!s) return `<div class="small muted">가격 기록이 쌓이면 차트가 표시됩니다.</div>`;
  const id = 'pc'+(++pcSeq); PC[id] = {key, opts, r: (S.rangePref||{})[normKey(key)] || '1Y'};
  return `<div class="pchart" id="${id}">${pcInner(id)}</div>`;
}
function pcInner(id){
  const p = PC[id], s = seriesFor(p.key) || {daily:[],weekly:[],monthly:[]};
  const avail = RANGES.filter(([r]) => rangePoints(s, r).length >= 2);
  if(!avail.some(([r]) => r === p.r) && avail.length) p.r = avail.at(-1)[0] === '5Y' && avail.some(([r]) => r==='1Y') ? '1Y' : avail[0][0];
  const freq = {'1M':'일간','3M':'일간','1Y':'주간','5Y':'월간'}[p.r];
  return `<div class="row" style="justify-content:space-between;margin-bottom:6px"><div class="seg rseg" role="group">${avail.map(([r,l]) => `<button type="button" data-act="ch-range" data-pc="${id}" data-r="${r}" aria-pressed="${p.r===r}">${l}</button>`).join('')}</div><span class="small muted">${freq} 종가</span></div>${lineChart(rangePoints(s, p.r), p.opts)}`;
}

/* ============ 금리: 주식 가치의 중력 ============ */
const RATE_L = {
  USPOL:'미국 기준금리', EUPOL:'유로존 기준금리', KRPOL:'한국 기준금리', JPPOL:'일본 기준금리',
  US10Y:'미국 10년', US2Y:'미국 2년', KR10Y:'한국 10년', JP10Y:'일본 10년', DE10Y:'독일 10년', FR10Y:'프랑스 10년', IT10Y:'이탈리아 10년', GB10Y:'영국 10년',
  US10_2:'미국 장단기 차이', FR_DE:'프랑스−독일 차이',
};
/* 주간 작업이 적은 최신값(manual)이 자동 수집값(auto)보다 새로우면 그 값을 쓴다 */
function rateOf(k){
  const R = S.rates || {}, a = R.auto?.[k], m = R.manual?.[k];
  if(m && isNum(m.v) && (!a || String(m.date || '') >= String(a.date || ''))) return { ...a, ...m };
  return a && isNum(a.v) ? a : (m && isNum(m.v) ? m : null);
}
const ppt = v => isNum(v) ? (v > 0 ? '+' : v < 0 ? '−' : '') + fmt(Math.abs(v), 2) + '%p' : '–';
function rateRow(k, note){
  const o = rateOf(k); if(!o) return '';
  const d = String(o.date || ''), dd = d ? `${+d.slice(5, 7)}/${+d.slice(8, 10) || 1}` : '';
  return `<div class="rt-row"><span class="rt-n">${esc(RATE_L[k])}${note ? `<small>${esc(note)}</small>` : ''}</span><b class="num">${fmt(o.v, 2)}%</b>
    <span class="num rt-c ${isNum(o.chg1y) ? (o.chg1y > 0 ? 'up' : o.chg1y < 0 ? 'down' : '') : ''}">${ppt(o.chg1y)}</span><span class="small muted num rt-d">${esc(dd)}${o.freq === '월간' ? ' 월간' : ''}</span></div>`;
}
function rateSensitivity(){
  const st = cfg(), y = st.bondKR || 4.3; return Math.round((1 - y / (y + 1)) * 100);
}
/* 여러 선 시계열 차트 (계단식 가능, 끝값 라벨, 마우스 따라 값 표시) */
const ML = {}; let mlSeq = 0;
function mlChart(series, o = {}){
  series = series.filter(s => (s.pts || []).length > 1); if(!series.length) return '';
  const id = 'ml' + (++mlSeq), W = 420, H = o.h || 220, L = 30, Rg = 46, T = 14, B = 22;
  const all = series.flatMap(s => s.pts), t0 = Math.min(...all.map(p => Date.parse(p[0]))), t1 = Math.max(...all.map(p => Date.parse(p[0])));
  const vs = all.map(p => p[1]); let lo = Math.min(0, ...vs), hi = Math.max(...vs); const st = (hi - lo) > 5 ? 2 : 1; hi = Math.ceil((hi + .2) / st) * st; lo = lo < 0 ? Math.floor((lo - .1) / st) * st : 0;
  const X = d => L + (Date.parse(d) - t0) / ((t1 - t0) || 1) * (W - L - Rg), Y = v => T + (1 - (v - lo) / ((hi - lo) || 1)) * (H - T - B);
  const path = pts => pts.map((p, i) => i && o.step ? `H${X(p[0]).toFixed(1)}V${Y(p[1]).toFixed(1)}` : `${i ? 'L' : 'M'}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('');
  const grid = []; for(let v = lo; v <= hi + 1e-9; v += st) grid.push(v);
  const y0 = new Date(t0).getFullYear(), y1 = new Date(t1).getFullYear(), ystep = y1 - y0 > 6 ? 2 : 1, yrs = [];
  for(let y = y0 + 1; y <= y1; y += ystep) yrs.push(y);
  const ends = series.map(s => ({s, y: Y(s.pts.at(-1)[1])})).sort((a, b) => a.y - b.y);
  for(let i = 1; i < ends.length; i++) if(ends[i].y - ends[i - 1].y < 13) ends[i].y = ends[i - 1].y + 13;
  ML[id] = {series, X, W, f: o.fmtV || (v => fmt(v, 2) + '%')};
  return `<div class="ml-wrap" data-ml="${id}"><svg viewBox="0 0 ${W} ${H}" class="ml-svg" role="img" aria-label="${esc(o.label || '')}">
    ${grid.map(v => `<line x1="${L}" x2="${W - Rg}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)"${v === 0 && lo < 0 ? ' stroke-width="1.6" stroke="var(--muted)"' : ''}/><text x="${L - 6}" y="${(Y(v) + 3.5).toFixed(1)}" text-anchor="end" class="rd-ax">${fmt(v, 0)}${o.unit ?? '%'}</text>`).join('')}
    ${yrs.map(y => `<text x="${X(y + '-01-01').toFixed(1)}" y="${H - 6}" text-anchor="middle" class="rd-ax">${y}</text>`).join('')}
    ${(o.marks || []).map(([d, n]) => `<line x1="${X(d).toFixed(1)}" x2="${X(d).toFixed(1)}" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="2 3"/><text x="${(X(d) + 4).toFixed(1)}" y="${T + 9}" class="rd-ax">${esc(n)}</text>`).join('')}
    ${series.map(s => `<path d="${path(s.pts)}" fill="none" stroke="${s.c}" stroke-width="${s.w || 2.2}" stroke-linejoin="round"${s.dash ? ' stroke-dasharray="5 4"' : ''}/><circle cx="${X(s.pts.at(-1)[0]).toFixed(1)}" cy="${Y(s.pts.at(-1)[1]).toFixed(1)}" r="3.5" fill="${s.c}"/>`).join('')}
    ${ends.map(e => `<text x="${W - Rg + 6}" y="${(e.y + 4).toFixed(1)}" class="ml-end">${esc(ML[id].f(e.s.pts.at(-1)[1]))}</text>`).join('')}
    <line class="ml-cross" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="3 3" opacity="0"/>
    <rect class="ml-hit" x="${L}" y="${T}" width="${W - L - Rg}" height="${H - T - B}" fill="transparent"/></svg><div class="rd-tip" hidden></div></div>
    <div class="rd-legend">${series.map(s => `<span><i style="background:${s.c}"></i>${esc(s.n)}</span>`).join('')}</div>`;
}
document.addEventListener('pointermove', e => {
  const wraps = document.querySelectorAll('.ml-wrap'); if(!wraps.length) return;
  const hit = e.target.closest?.('.ml-hit'), cur = hit?.closest('.ml-wrap');
  wraps.forEach(w => { if(w !== cur){ const t = w.querySelector('.rd-tip'); if(t && !t.hidden){ t.hidden = true; w.querySelector('.ml-cross').setAttribute('opacity', 0); } } });
  if(!cur) return; const c = ML[cur.dataset.ml]; if(!c) return;
  const svg = hit.ownerSVGElement, bx = svg.getBoundingClientRect(), x = (e.clientX - bx.left) / bx.width * c.W;

  return `<span class="pill p-good" title="원/100엔이 최근 ${y.years}년 평균(${fmt(y.avg,0)}원)으로 돌아오면 주가가 그대로여도 원화 환산 가치가 이만큼 늘어난다. 엔화가 더 약해지면 반대로 손실.">엔 회복 시 +${fmt(y.up,0)}%</span>`;
}
function yenSectionHtml(){
  const y = yenInfo(); if(!y) return '';
  const jp = scoredRows().filter(r => grpOf(r.m) === 'JP').sort((a,b) => (b.tb ?? -1) - (a.tb ?? -1)).slice(0, 8);
  const down10 = -10;
  return `<h2>엔저와 일본 주식</h2>
  <div class="card stack">
    <div class="summary">
      <div class="kv"><span class="eyebrow">지금 원/100엔</span><b class="num">${fmt(y.cur,1)}</b><span class="small muted">${y.pctl <= 2 ? `최근 ${y.years}년 중 최저 수준` : `최근 ${y.years}년 중 하위 ${y.pctl}%`}</span></div>
      <div class="kv"><span class="eyebrow">${y.years}년 평균</span><b class="num">${fmt(y.avg,0)}</b><span class="small muted">범위 ${fmt(y.lo,0)}~${fmt(y.hi,0)}</span></div>
      <div class="kv"><span class="eyebrow">평균 회복 시 환차익</span><b class="num up">+${fmt(y.up,1)}%</b><span class="small muted">주가 변동 없을 때</span></div>
    </div>
    ${hbars([{label:'최고 회복', v:y.upHi},{label:'평균 회복', v:y.up},{label:'10% 더 약세', v:down10}], {fmtV: v => pct(v)})}
    <p class="small" style="margin:0">일본 주식을 원화로 사서 들고 있으면 주가와 별개로 엔화 가치 변화가 수익에 더해진다. 지금처럼 엔화가 역사적으로 싼 구간에서 사면, 엔화가 평균 쪽으로 돌아올 때 같은 주가에서도 원화 기준 수익이 늘어난다. 다만 엔화가 바닥이라는 보장은 없고(840원대가 바닥이 아닐 수 있다는 전망도 있다) 시점도 알 수 없다.</p>
    <p class="small muted" style="margin:0">엔화가 강해지면 수출 비중이 큰 일본 기업(자동차·전자·기계)은 엔화 환산 이익이 줄어 주가가 눌릴 수 있어 환차익이 일부 상쇄된다. 은행·보험·통신·내수 소비처럼 국내 매출 중심 기업이 엔화 회복의 덕을 더 온전히 받는다. 환헤지형 ETF로 사면 이 효과는 없다.</p>
    ${jp.length ? `<div><div class="eyebrow">스크리너의 일본 기업 (근접도 순)</div>${jp.map(r => { const p = profileFor(r.t, r.code); const d = p?.dividend; return `<div class="check" style="grid-template-columns:minmax(0,1fr) auto"><div style="min-width:0"><b>${esc(r.n)}</b> <span class="small muted">${esc(r.code||r.t)}${p?.industry?' · '+esc(p.industry):''}</span>${d ? `<div class="small muted">배당 ${esc(d.verdict)}${isNum(d.yield)&&d.yield>0?' '+fmt(d.yield,1)+'%':''}</div>` : ''}</div><span class="pill ${scoreCls(r.b)}">근접도 ${r.b ?? '–'}</span></div>`; }).join('')}</div>` : ''}
  </div>`;
}

const DROP_CLS = {'일시적 가능성 높음':'p-good','판단 보류':'p-warn','구조적 훼손 우려':'p-bad'};
function dropCheckHtml(c){
  const d = c && c.dropCheck; if(!d) return '';
  const tr = t => t === '개선' ? 'p-good' : t === '악화' ? 'p-bad' : 'p-none';
  return `<div class="dropbox">
    <div class="row" style="justify-content:space-between"><b>급락 점검 <span class="num ${d.drawdown<0?'down':''}">${isNum(d.drawdown)?fmt(d.drawdown,1)+'%':''}</span> <span class="small muted">52주 고점 대비</span></b><span class="pill ${DROP_CLS[d.verdict]||'p-none'}">${esc(d.verdict||'')}</span></div>
    ${d.cause ? `<p class="small" style="margin:6px 0 0">${esc(d.cause)}</p>` : ''}
    <details style="margin-top:6px"><summary class="small">근거와 점검 지표 보기</summary>
    <div class="grid2 dropcols" style="margin-top:8px">
      <div><div class="eyebrow">일시적 요인</div><ul class="small" style="margin:4px 0 0;padding-left:18px">${(d.temporary||[]).map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
      <div><div class="eyebrow">구조적 우려</div><ul class="small" style="margin:4px 0 0;padding-left:18px">${(d.structural||[]).map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
    </div>
    ${(d.indicators||[]).length ? `<div style="margin-top:8px"><div class="eyebrow">점검 지표</div>${d.indicators.map(i => `<div class="check" style="grid-template-columns:minmax(0,1fr) auto;padding-block:6px"><div style="min-width:0"><b class="small">${esc(i.name)}</b><div class="small">${esc(i.value||'')}</div><div class="small muted">${esc(i.why||'')}</div></div><span class="pill ${tr(i.trend)}">${esc(i.trend||'')}</span></div>`).join('')}</div>` : ''}
    ${d.valuation ? `<p class="small" style="margin:6px 0 0"><b>가격</b> ${esc(d.valuation)}</p>` : ''}
    ${d.verdictWhy ? `<p class="small" style="margin:6px 0 0"><b>판정 이유</b> ${esc(d.verdictWhy)}</p>` : ''}
    ${(d.nextCheck||[]).length ? `<div class="small" style="margin-top:6px"><b>다음 확인</b> ${d.nextCheck.map(n => `<span class="num">${esc(n.date)}</span> ${esc(n.what)}`).join(' · ')}</div>` : ''}
    </details>
    <div class="small muted" style="margin-top:6px">${esc(d.at||'')}${(d.sources||[]).filter(safeUrl).slice(0,4).map((u,i) => ` · <a href="${esc(u)}" target="_blank" rel="noopener" style="color:var(--accent)">출처${i+1}</a>`).join('')}</div>
  </div>`;
}

  const g = missions(); const pg = prog();
  if(!pg.lastLevel){ saveProg({lastLevel: g.lv.n}); return; }

}

async function pfShareGo(){
  await cardFonts();
  const q = QZ.res || savedQz(), d = pfShareData(), [h1, h2] = pfHook(d);
  const cvs = [...(q ? [drawTestCard(q)] : []), drawPfCard()];
  const files = await Promise.all(cvs.map((cv, i) => new Promise(r => cv.toBlob(b => r(new File([b], `valuenote-${i + 1}.png`, { type: 'image/png' })), 'image/png'))));
  const who = q ? `나는 ${QZ_R[q.k].who} "${QZ_R[q.k].name}". ` : '';
  const text = `${who}${h1} ${h2}. 그레이엄·버핏·멍거 기준으로 내 포트폴리오를 채점해 봤어요. 너는 몇 점?`;
  const url = inviteUrl();
  store.track('view', 'share-pf' + (q ? '-2' : '-1'));
  try{ if(navigator.canShare && navigator.canShare({ files })){ await navigator.share({ files, text: text + '\n' + url }); return; } }catch(e){ if(e && e.name === 'AbortError') return; }
  for(const f of files){ const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; a.click(); await new Promise(r => setTimeout(r, 300)); }
  try{ await navigator.clipboard.writeText(text + '\n' + url); toastMsg(`카드 ${files.length}장을 저장했고, 소개 문구와 링크를 복사했어요.`); }catch(_){ toastMsg(`카드 ${files.length}장을 저장했어요.`); }
}

     <p>ValueNote는 세 사람에게 각각 <b>거부권</b>을 준다. 멍거의 탈락 조건을 넘고, 버핏의 품질 기준을 넘고, 그레이엄의 안전마진까지 채운 회사만 "매수 후보"가 된다. 그래서 후보가 적게 나오는 것이 정상이다. 버크셔도 1년에 새로 사는 종목이 몇 개 안 된다.</p>`],
    ['벤저민 그레이엄은 무엇을 지향했나', `<p><b>철학.</b> 그레이엄(1894~1976)은 버핏의 스승이자 『현명한 투자자』『증권분석』의 저자다. 1929년 대공황에서 재산 대부분을 잃은 뒤 "먼저 잃지 않는 법"을 체계로 만들었다. 핵심은 세 가지다.</p>
     <ul><li><b>안전마진:</b> 가치를 정확히 알 수는 없으니, 가치보다 훨씬 싸게 사서 계산이 틀려도 손해가 작게 한다.</li>
     <li><b>미스터 마켓:</b> 시장은 매일 기분에 따라 값을 부르는 동업자일 뿐이다. 그 값에 끌려가지 말고, 싸게 부를 때만 이용한다.</li>
     <li><b>투자와 투기의 구분:</b> 철저한 분석, 원금의 안전, 적절한 수익. 이 셋이 없으면 투기다.</li></ul>
     <p><b>그레이엄의 방어적 투자자 기준</b>(『현명한 투자자』 14장)은 충분한 규모, 유동비율 2 이상, 10년 연속 흑자, 20년 연속 배당, 10년간 주당이익 3분의 1 이상 성장, 과거 3년 평균 이익 대비 PER 15배 이하, PBR 1.5배 이하(또는 PER×PBR 22.5 이하)였다.</p>
     <p><b>ValueNote에 넣은 것.</b></p>
     <ul><li>안전마진 30%: 내재가치보다 30% 이상 쌀 때만 매수 후보.</li>
     <li>그레이엄 넘버 √(22.5 × EPS × BPS)와 PER×PBR 22.5 한도.</li>
     <li>이익수익률(1/PER)과 국채 금리 비교: 국채의 2배 이상이면 저평가 근거.</li>
     <li>정상 이익: 한 해 이익이 아니라 여러 해 평균 이익으로 본다(이익이 정점일 때 싸 보이는 함정 방지).</li>
     <li>재무 안전: 유동비율과 적자 연도를 보조 근거로.</li></ul>
     <p><b>그대로 따르지 않은 것.</b> 20년 연속 배당과 유동비율 2 이상은 지금 기준으로 너무 엄격해 애플·알파벳 같은 회사까지 떨어뜨린다. 유동비율은 1.5로 낮췄고, 배당은 필수가 아니라 배당 탭에서 따로 본다.</p>`],
    ['워런 버핏은 무엇을 지향했나', `<p><b>철학.</b> 버핏은 그레이엄에게서 안전마진을 배웠지만, 멍거와 필립 피셔의 영향으로 "싼 회사"에서 "좋은 회사"로 옮겨 갔다. 1989년 주주서한의 말로 요약된다. <b>적당한 회사를 훌륭한 가격에 사는 것보다, 훌륭한 회사를 적당한 가격에 사는 것이 훨씬 낫다.</b></p>
     <ul><li><b>해자:</b> 경쟁자가 넘어오지 못하는 구조. 브랜드, 바꾸기 어려운 서비스(전환비용), 네트워크 효과, 원가 우위, 허가.</li>
     <li><b>오너이익:</b> 회계 이익이 아니라 주인이 실제로 가져갈 수 있는 돈. 순이익에 감가상각을 더하고 사업 유지에 필요한 투자만 뺀다(1986년 주주서한).</li>
     <li><b>자기자본이익률(ROE):</b> 빚 없이 자본 대비 높은 이익을 꾸준히 내는가.</li>
     <li><b>능력 범위와 10년 보유:</b> 이해하는 사업만 사고, 10년 들고 있을 생각이 없으면 10분도 들지 않는다.</li></ul>
     <p><b>ValueNote에 넣은 것.</b></p>
     <ul><li><b>숫자 품질 13개 지표</b>(0~100점): ROE 5년 평균·최저 연도, ROIC, 매출총이익률, 순이익률, EPS 성장, 적자 연도, FCF ÷ 순이익, 설비투자 ÷ 순이익, 장기차입금 ÷ 순이익, 이자보상배율, 유동비율, 주식 수 변화.</li>
     <li><b>오너이익 DCF:</b> 주당 오너이익을 10년 성장시킨 뒤 영구성장으로 마무리해 내재가치를 낸다. 성장률은 과거 이익·매출 성장률 중 낮은 값의 절반(0~8%)으로 보수적으로 잡는다. 스톡옵션 같은 주식보상비용은 오너이익에서 뺀다.</li>
     <li><b>역DCF:</b> 지금 주가가 가정한 10년 성장률을 거꾸로 풀어, 회사가 실제로 보여 준 성장률보다 낮으면 저평가 근거로 본다. PER이 높아도 싼 회사(코카콜라 1988형)를 놓치지 않기 위해서다.</li>
     <li><b>정성 평가:</b> 해자 유형·강도, 가격결정력, 경영진, 지배구조, 10년 보유 테스트. AI가 공시·뉴스로 근거와 함께 채운다.</li>
     <li><b>은행·보험 전용 평가:</b> FCF가 의미 없는 금융사는 ROE ÷ 할인율과 PBR을 비교한다.</li></ul>
     <p><b>그대로 따르지 않은 것.</b> 회사를 통째로 사는 인수, 보험 플로트 활용, 경영진을 직접 만나 판단하는 일은 개인이 따라 할 수 없어 뺐다.</p>`],
    ['찰리 멍거는 무엇을 지향했나', `<p><b>철학.</b> 멍거는 버핏의 50년 동업자다. 버핏을 "싼 주식"에서 "좋은 회사"로 이끌었고, 투자 실패의 대부분이 숫자가 아니라 사람의 심리에서 나온다고 봤다.</p>
     <ul><li><b>뒤집어 생각하기:</b> 어떻게 성공할지보다 무엇이 실패하게 만드는지를 먼저 묻는다.</li>
     <li><b>너무 어려운 것 바구니:</b> 모르는 것은 "예/아니오"가 아니라 "너무 어려움"으로 분류하고 넘긴다.</li>
     <li><b>심리적 오판:</b> 남 따라 하기, 손실 회피, 조급함 같은 인간의 판단 오류를 체크리스트로 막는다.</li>
     <li><b>집중과 기다림:</b> 확신 있는 몇 개에 크게 걸고 오래 기다린다. 큰돈은 사고파는 데서가 아니라 기다리는 데서 번다.</li></ul>
     <p><b>ValueNote에 넣은 것.</b></p>
     <ul><li><b>즉시 탈락:</b> 능력 범위 밖(돈 버는 방식을 한 문장으로 설명 못 함), 지배구조 위험(쪼개기 상장, 반복 유상증자·CB, 대주주 사익추구).</li>
     <li><b>위험 신호 감점:</b> 잦은 적자, 차입 부담, 주식 희석, 현금 전환 약함, 이익 정점 가능, 성장 감속. 개당 −8점, 최대 3개.</li>
     <li><b>뒤집어 생각하기 칸:</b> 회사마다 "이 회사를 망가뜨리는 시나리오"를 먼저 적는다.</li>
     <li><b>혁신 의존형은 도전 칸으로:</b> 다음 제품이 성공해야 가치가 유지되는 회사는 주력 자리에 넣지 않는다.</li>
     <li><b>집중 구조:</b> 주력 3종목 70~80%, 도전 칸 10% 이하, 현금 10~20%.</li>
     <li><b>행동 장치:</b> 매도 조건을 미리 2개 이상 적고, 결정 일지에 그때의 심리(근거 기반·조급함·남들 따라 등)를 남기고, 모델 준수율을 잰다.</li></ul>`],
    ['세 공식을 묶으면 무엇이 좋은가', `<p>투자에서 큰 손실은 대개 네 가지 실수에서 나온다. 셋을 묶으면 각 실수를 다른 사람이 막아 준다.</p>
     <table class="g-tbl"><thead><tr><th>실수 유형</th><th>실제 사례</th><th>누가 막나</th></tr></thead><tbody>
      <tr><td>싸지만 나쁜 회사</td><td>IBM(2011), HP(2022): 숫자는 싸 보였지만 사업이 줄어들었다</td><td><b>버핏</b> 품질 70점·10년 보유 테스트, <b>멍거</b> 성장 감속 감점</td></tr>
      <tr><td>좋지만 너무 비싼 회사</td><td>크래프트(2015): 버핏 스스로 비싸게 샀다고 인정</td><td><b>그레이엄</b> 안전마진 30%, 역DCF</td></tr>
      <tr><td>정점 이익의 싼 PER</td><td>코노코필립스(2008): 유가 정점에서 PER 6배로 샀다가 큰 손실</td><td><b>그레이엄</b> 정상 이익, <b>멍거</b> 이익 정점 경고, 가치 범위 표시</td></tr>
      <tr><td>원칙을 깨는 행동</td><td>테마 추격, 공포에 팔기, 한 종목 몰빵</td><td><b>멍거</b> 매도 조건 사전 작성, 결정 일지, 집중 구조 상한</td></tr>
     </tbody></table>
     <p><b>세 가지 장점으로 정리하면</b></p>
     <ul><li><b>실수가 겹치지 않는다.</b> 가격, 사업, 행동을 각각 다른 기준이 지켜서 한 기준의 사각지대를 다른 기준이 메운다.</li>
     <li><b>점수로 비교할 수 있다.</b> 필터 하나라도 걸리면 탈락시키는 대신 감점 방식으로 바꿔, 기준에 "얼마나 가까운지" 순위를 낼 수 있다. 그래서 220여 개 회사를 한 줄로 세울 수 있다.</li>
     <li><b>실제 기록으로 고쳤다.</b> 버크셔의 실제 매수 62건(성공·실패 포함)과 고전 사례 10건에 이 공식을 다시 돌려 봤다. 품질 점수는 이후 수익률과 상관이 없었고(버크셔는 이미 좋은 회사만 고르므로) 저평가 점수만 수익률과 같이 움직여서, 버핏 근접도를 품질 40% + 저평가 60%로 정했다. 경기순환 업종 감점은 성공 사례(뉴코어, 일본 상사)만 깎아서 경고로 바꿨다.</li></ul>`],
    ['한 회사를 심사하는 순서', `<ol class="g-steps">
      <li><b>탈락 관문 (멍거):</b> 능력 범위 밖이거나 지배구조 위험이 있으면 점수를 보지 않고 탈락.</li>
      <li><b>숫자 품질 (버핏):</b> 13개 재무 지표를 0~100점으로. 시장별 기준이 다르다(예: ROE 미국 15%, 한국 12%).</li>
      <li><b>저평가 (그레이엄 + 버핏):</b> 안전마진(가중 2), 역DCF 성장률 차이(가중 2), 이익수익률 ÷ 국채 금리, PER×PBR을 0~100점으로.</li>
      <li><b>위험 신호 (멍거):</b> 해당하는 개수만큼 감점. 경기순환·지주회사·주식보상·혁신 의존은 감점 없이 경고만.</li>
      <li><b>버핏 근접도:</b> 품질 40% + 저평가 60% − 감점.</li>
      <li><b>종합 점수:</b> 근접도 65% + 정성 평가 20% + 트렌드 15%.</li>
      <li><b>판정:</b> 종합 75점 이상 + 품질 70 이상 + 10년 보유 통과 + 안전마진 30% → 매수 후보. 가격만 비싸면 "좋은 회사, 가격 대기".</li>
      <li><b>포트폴리오 (멍거):</b> 주력 3종목에 넣을지, 도전 칸으로 보낼지 자동 분류.</li>
     </ol>`],
    ['내재가치는 어떻게 계산하나 (예시)', `<p>주당 오너이익이 1,000원, 성장률 5%, 할인율 10%, 영구성장 2%인 회사를 예로 든다.</p>
     <ul><li>앞으로 10년간 오너이익이 매년 5%씩 늘어난다고 보고, 각 해의 돈을 10%로 할인해 지금 가치로 더한다. 약 7,800원.</li>
     <li>10년 뒤부터는 매년 2%씩 영원히 늘어난다고 보고 그 가치를 지금으로 할인한다. 약 8,000원.</li>
     <li>합치면 내재가치는 약 15,800원이다. 이것이 <b>적정 가격</b>이다. 안전마진 30%를 적용한 <b>적정 매수가는 약 11,100원</b>이다. 지금 주가가 1만 원이면 상승 여력은 약 +58%다.</li></ul>
     <p><b>성장 투자 보정.</b> 공장을 크게 늘리는 회사는 그 투자 때문에 현금흐름이 일시적으로 작아 보인다. 버핏의 오너이익은 유지 투자만 빼므로, 설비투자가 순이익보다 크고 ROIC가 15% 이상인 회사는 현금흐름 대신 여러 해 평균 이익(최근 이익보다 크지 않게)을 기준으로 쓴다.</p>
     <p><b>가치 범위.</b> 이익이 사이클을 타는 회사는 "과거 평균 이익으로 돌아갈 때"와 "최근 12개월 이익이 계속될 때"의 가치를 함께 보여 준다. 예를 들어 삼성전자는 최근 이익이 5년 평균의 4배여서 범위가 약 6.9만~28만 원으로 넓다. 적정 매수가는 보수적인 쪽(평균 이익)으로 정한다. 지금 주가는 슈퍼사이클 이익이 오래 간다는 쪽에 걸려 있다는 뜻이다.</p>`],
    ['세 사람의 판단이 엇갈리면 어떻게 되나요?', `<p>각자 거부권을 가진다. 멍거의 탈락 조건(능력 범위, 지배구조)에 걸리면 바로 탈락이다. 버핏의 품질 70점과 10년 보유 테스트를 넘어야 하고, 그레이엄의 안전마진 30%까지 채워야 "매수 후보"가 된다.</p>
     <p>품질은 통과했는데 가격만 비싸면 "좋은 회사, 가격 대기"로 분류해 관심 목록에 남긴다. 버크셔가 애플·코카콜라를 지금 가격에 더 사지 않고 보유만 하는 것과 같은 판단이다. 적정 매수가에 닿으면 알림이 온다.</p>`],
  ]},
  {g:'점수와 판정', items:[
    ['점수는 몇 점이면 어떤 뜻인가요?', () => `<p><b>종합 점수(0~100)</b>는 "이 회사가 그레이엄·버핏·멍거의 기준에 얼마나 가까운가"를 뜻한다. 주가가 오를 확률이 아니다.</p>

/* ============ 환율 탭 ============ */
function fxExposure(){
  const st = cfg(); let usd = 0, tot = st.cashKRW || 0;
  S.holdings.forEach(h => { const v = holdingCalc(h).value; tot += v; if((h.currency||curOf(h.market)) === 'USD') usd += v; });
  const usdAmt = S.holdings.filter(h => (h.currency||curOf(h.market)) === 'USD').reduce((a,h) => a + (h.qty||0)*(h.price||0), 0);
  return {usd, tot, w: tot ? usd/tot*100 : 0, usdAmt};
}

/* ============ 시각화 묶음 ============ */
const SER = i => `var(--s${i%6+1})`;
/* 도넛: items [{label, v, color}] */
function donut(items, centerTop, centerSub){
  const tot = items.reduce((a,x) => a + Math.max(0, x.v), 0) || 1;
  const R = 70, r = 46, cx = 90, cy = 90; let a0 = -Math.PI/2;
  const arc = (a1, a2) => { const g = 0.012; a1 += g; a2 -= g; if(a2 <= a1) return '';
    const p = (rad, ang) => [cx + rad*Math.cos(ang), cy + rad*Math.sin(ang)].map(n => n.toFixed(2)).join(',');
    const large = a2 - a1 > Math.PI ? 1 : 0;
    return `M${p(R,a1)} A${R},${R} 0 ${large} 1 ${p(R,a2)} L${p(r,a2)} A${r},${r} 0 ${large} 0 ${p(r,a1)} Z`; };
  const segs = items.map(x => { const a1 = a0, a2 = a0 + Math.max(0,x.v)/tot*2*Math.PI; a0 = a2; return `<path d="${arc(a1,a2)}" fill="${x.color}"><title>${esc(x.label)} ${fmt(x.v/tot*100,1)}%</title></path>`; }).join('');
  return `<div class="donut-wrap"><svg viewBox="0 0 180 180" class="donut" role="img" aria-label="${esc(items.map(x => `${x.label} ${fmt(x.v/tot*100,0)}%`).join(', '))}">${segs}
    <text x="90" y="88" text-anchor="middle" class="dn-top">${esc(centerTop||'')}</text><text x="90" y="108" text-anchor="middle" class="dn-sub">${esc(centerSub||'')}</text></svg>
    <div class="dn-legend">${items.map(x => `<div><i style="background:${x.color}"></i><span>${esc(x.label)}</span><b class="num">${fmt(x.v/tot*100,1)}%</b></div>`).join('')}</div></div>`;
}
/* 스파크라인 */
function sparkline(points, w=96, h=30){
  const pts = (points||[]).filter(p => isNum(p[1])); if(pts.length < 2) return '';
  const vs = pts.map(p => p[1]), lo = Math.min(...vs), hi = Math.max(...vs), sp = (hi-lo) || 1;
  const d = pts.map((p,i) => `${i?'L':'M'}${(i/(pts.length-1)*(w-4)+2).toFixed(1)},${(h-3-(p[1]-lo)/sp*(h-6)).toFixed(1)}`).join('');
  const up = vs.at(-1) >= vs[0];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><path d="${d}" fill="none" stroke="${up ? 'var(--up)' : 'var(--down)'}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
/* 현재 보유 수량 기준 포트폴리오 가치 추이(일간, 모든 종목 시세가 있는 구간) */
function portfolioSeries(){
  const hs = S.holdings.filter(h => (h.qty||0) > 0);
  const ser = hs.map(h => ({h, fx: fxOf(h.currency || curOf(h.market)), d: (S.prices[normKey(h.ticker)]?.daily || []).filter(p => isNum(p[1]))}));
  if(!ser.length || ser.some(s => s.d.length < 5)) return null;
  const start = ser.map(s => s.d[0][0]).sort().at(-1);
  const dates = [...new Set(ser.flatMap(s => s.d.map(p => p[0])))].filter(d => d >= start).sort();
  const idx = ser.map(() => 0), last = ser.map(() => null);
  const out = dates.map(dt => { let v = 0; ser.forEach((s,i) => { while(idx[i] < s.d.length && s.d[idx[i]][0] <= dt){ last[i] = s.d[idx[i]][1]; idx[i]++; } v += (last[i] ?? 0) * s.h.qty * s.fx; }); return [dt, v]; });
  const cost = hs.reduce((a,h) => a + (h.qty||0)*(h.avg||0)*fxOf(h.currency || curOf(h.market)), 0);
  return {points: out, cost};
}

function viewValidation(){
  const V = VALIDATION, P = V.purchases;
  const bucket = b => b === null || b === undefined ? 'n/a' : b >= 75 ? '75점 이상' : b >= 60 ? '60~74점' : '60점 미만';
  const groups = ['75점 이상','60~74점','60점 미만'].map(k => { const rs = P.filter(r => bucket(r.b) === k); const so = rs.map(r => r.ret).sort((a,b)=>a-b); const med = so.length ? Math.round(so.length % 2 ? so[(so.length-1)/2] : (so[so.length/2-1]+so[so.length/2])/2) : null;
    return {k, n:rs.length, s:rs.filter(r=>r.o==='success').length, m:rs.filter(r=>r.o==='mixed').length, f:rs.filter(r=>r.o==='failure').length, med}; });
  const mean = (arr) => arr.length ? Math.round(arr.reduce((a,b)=>a+b,0)/arr.length) : null;
  const sq = mean(P.filter(r=>r.o==='success'&&isNum(r.q)).map(r=>r.q)), fq = mean(P.filter(r=>r.o==='failure'&&isNum(r.q)).map(r=>r.q));
  const sv = mean(P.filter(r=>r.o==='success'&&isNum(r.v)).map(r=>r.v)), fv = mean(P.filter(r=>r.o==='failure'&&isNum(r.v)).map(r=>r.v));
  const pill = (o) => { const l = OUT_LABEL[o]||['p-none',o]; return `<span class="pill ${l[0]}">${l[1]}</span>`; };
  const sc = s => isNum(s) ? `<span class="pill ${scoreCls(s)}">${s}</span>` : '<span class="pill p-none">–</span>';
  return `
  <h2>버크셔 역검증 <span class="small muted num">${esc(V.asOf)}</span></h2>

    <p><b>결론: 점수만으로 버크셔의 성공작을 고를 수는 없지만, 실패를 피하는 데는 도움이 됐다.</b> 버크셔 실제 매수 ${P.length}건을 매수 시점 재무와 가격으로 채점했더니 75점 이상은 ${groups[0].n}건뿐이었다. 그 안에서도 성공 ${groups[0].s}건, 실패 ${groups[0].f}건으로 갈렸다. 성공 사례의 평균 품질 점수는 ${sq}점으로 실패 사례(${fq}점)보다 오히려 낮았다. 반면 저평가 점수는 성공 ${sv}점, 실패 ${fv}점으로 차이가 났다.</p>

const MKT_TABS = [['ALL','전체'],['KR','한국'],['US','미국'],['JP','일본'],['CN','중국 A'],['HK','홍콩']];
const SORTS = [['tb','근접도 + 트렌드'],['b','버핏 근접도'],['q','숫자 품질'],['v','저평가'],['mos','안전마진']];

function saveScreenPrefs(){ try{ localStorage.setItem('ml-screen', JSON.stringify({mkt:S2.mkt, sort:S2.sort, hideFlags:S2.hideFlags, tag:S2.tag})); }catch(_){} }
let scoredCache = null;
function scoredRows(){
  if(scoredCache) return scoredCache;
  const st = cfg();
  const STRAT = new Set(['품질 상위 10%','마법공식 상위 10%','F≥8 저PBR','넷넷','안전마진 30%+']);
  scoredCache = S2.screen.map(r => {
    const sc = scoreRow(r, null, st.reqMOS);
    const tags = (r.tags||[]).filter(t => !STRAT.has(t));
    if(r.dataConf === 'low') tags.push('데이터 신뢰도 낮음');
    if(isNum(sc.mos) && sc.mos >= st.reqMOS) tags.push('안전마진 30%+');
    const tr = trendScore(autoTrendLinks(r), sc.v);
    const tb = sc.b === null ? null : tr.score === null ? sc.b : Math.round(sc.b*0.8 + tr.score*0.2);
    return {...r, ...sc, tags, trend:tr.score, trendLabels:tr.hits.map(h => h.t.label), trendWarn:tr.warn, tb};
  });
  /* 시장별 숫자 품질 상위 10% */
  const byM = {}; for(const r of scoredCache) (byM[r.m] ||= []).push(r);
  for(const rs of Object.values(byM)){
    const qs = rs.map(r => r.q).filter(isNum).sort((a,b) => b-a); const q10 = qs.length ? qs[Math.max(0, Math.floor(qs.length/10) - 1)] : 101;
    for(const r of rs) if(isNum(r.q) && r.q >= q10 && r.dataConf !== 'low') r.tags.push('품질 상위 10%');
  }
  return scoredCache;
}
function screenFor(h){
  const t = (h.ticker||'').trim().toUpperCase(); if(!t) return null;
  return scoredRows().find(r => r.t.toUpperCase() === t || (r.code||'').toUpperCase() === t) || null;
}
function filteredRows(){
  let rows = scoredRows();
  if(S2.mkt !== 'ALL') rows = rows.filter(r => r.m === S2.mkt || (S2.mkt === 'KR' && (r.m === 'KOSPI' || r.m === 'KOSDAQ')));
  if(S2.hideFlags) rows = rows.filter(r => !(r.flags||[]).filter(f => f !== '경기순환·이익 변동').length);
  if(S2.tag) rows = rows.filter(r => (r.tags||[]).includes(S2.tag));
  const q = S2.q.trim().toLowerCase();
  if(q) rows = rows.filter(r => (r.n+' '+(r.en||'')+' '+r.t+' '+(r.s||'')+' '+(r.ind||'')).toLowerCase().includes(q));
  const key = S2.sort;
  return [...rows].sort((a,b) => (isNum(b[key])?b[key]:-1e9) - (isNum(a[key])?a[key]:-1e9));
}
const scoreCls = s => !isNum(s) ? 'p-none' : s >= 75 ? 'p-good' : s >= 60 ? 'p-warn' : 'p-bad';

function screenListHtml(){

function screenCard(r, i){

/* ===== 모델 준수: 결정 시점의 모델 판정을 기록하고 따랐는지 본다 ===== */
const BUY_ACTIONS = ['신규 매수','추가 매수'];
const MODEL_OK = ['매수 후보','도전 후보','공격 슬롯 후보'];
function findCompanyByText(t){
  const k = normKey(t); if(!k) return null;
  return S.companies.find(c => [c.ticker, c.yf, c.name].map(normKey).includes(k)) || S.companies.find(c => normKey(c.name).includes(k) || k.includes(normKey(c.name))) || null;
}
function modelSnapshot(c){
  if(!c) return null; const ev = evaluate(c);
  return {verdict:ev.verdict, total:ev.total, b:ev.b, mos:isNum(ev.mos)?Math.round(ev.mos):null, flags:ev.flags.slice(0,4), at:today()};
}
/* followed: 매수인데 모델이 매수 후보였나 / 매도인데 논리 훼손 또는 목표가였나 */
function followedModel(j){
  const m = j.model; if(!m) return null;
  if(BUY_ACTIONS.includes(j.action)) return MODEL_OK.includes(m.verdict);
  if(j.action === '전량 매도' || j.action === '비중 축소') return m.verdict === '탈락' || m.verdict === '기준과 거리 있음' || (m.status && m.status !== '유효') || (isNum(m.mos) && m.mos <= 0);
  return null;
}
function complianceStats(){
  const js = S.journal.filter(j => j.model && followedModel(j) !== null);
  const f = js.filter(j => followedModel(j)), n = js.filter(j => !followedModel(j));
  return {n:js.length, followed:f.length, ignored:n.length, ignoredList:n};
}
function complianceHtml(){
  const st = complianceStats();
  if(!st.n) return `<div class="card"><div class="small muted">결정 일지에 매매를 기록하면 "모델을 따른 결정"과 "무시한 결정"의 비율이 여기에 쌓입니다. 이 모델의 가장 큰 위험은 모델이 아니라 모델을 무시하는 순간입니다.</div></div>`;
  const pct = Math.round(st.followed/st.n*100);
  return `<div class="card stack" style="gap:8px">
    <div class="row" style="justify-content:space-between"><div><b>모델 준수율</b> <span class="small muted">${st.n}건 중 ${st.followed}건</span></div><span class="pill ${pct>=80?'p-good':pct>=50?'p-warn':'p-bad'}" style="font-size:15px">${pct}%</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    ${st.ignoredList.length ? `<div class="small"><b>모델과 다르게 한 결정</b>${st.ignoredList.slice(0,5).map(j => `<div class="muted">${esc(j.date)} ${esc(j.ticker)} ${esc(j.action)} · 당시 모델 판정 "${esc(j.model.verdict)}"${isNum(j.model.total)?` ${j.model.total}점`:''}</div>`).join('')}</div>` : '<div class="small muted">모델과 다르게 한 결정이 없습니다.</div>'}
    <div class="small muted">분기마다 두 그룹의 수익률을 비교하면 이 모델이 나에게 실제로 도움이 되는지 알 수 있습니다.</div>
  </div>`;
}

    <div class="rule"><span class="t">도전 칸</span><span class="th">≤10%</span><span class="d">레버리지, 적자 기업, 혁신 의존형, 10년 보유 미통과는 자동으로 여기로 간다. 0원이 돼도 판단이 흔들리지 않을 금액만</span></div>
    <div class="rule"><span class="t">현금</span><span class="th">10~20%</span><span class="d">폭락 때 주력 종목을 더 살 대기 자금</span></div>
    <div class="rule"><span class="t">균형</span><span class="th">업종 중복 없음 · 사이클형 ≤1</span><span class="d">집중하되 같은 이유로 함께 무너지지 않게. 같은 업종 두 개, 경기 타는 사업 두 개를 주력에 함께 두지 않는다</span></div>
    <div class="rule"><span class="t">매도</span><span class="th">내재가치 초과 · 논리 훼손</span><span class="d">주가가 올랐다는 이유가 아니라 내재가치를 10% 넘게 웃돌거나 매도 조건에 닿았을 때 점검한다</span></div>
  </div>

  <h2>2단계. 숫자로 보는 해자</h2>
  <div class="card"><div class="eyebrow">사업의 질</div><div class="rule-group">${grp('사업의 질')}</div>
    <div class="eyebrow" style="margin-top:14px">재무 안전</div><div class="rule-group">${grp('재무 안전')}</div>
    <div class="eyebrow" style="margin-top:14px">자본 배분</div><div class="rule-group">${grp('자본 배분')}</div>
    <p class="small muted" style="margin:12px 0 0">각 지표는 통과·탈락이 아니라 0~100점 연속 점수다. 기준값이면 70점, 우수값이면 100점, 나쁨값 이하면 0점. ROE, ROIC, FCF 전환율, 차입금, 적자 이력은 가중치 2배.</p>
