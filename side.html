<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>까치 채널 관리</title>
<link rel="icon" type="image/png" href="/favicon-64.png?v=5">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2.0.5/fonts/variable/woff2/SUIT-Variable.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<!--
  'From Korea, With Love'(진행자 까치) 관리자 — 2026-10-28 완전 자동 운영판
  대표님 지시: "체크박스 이런 것도 필요 없어. 다 너가 체크할 거야… 비상상황에 매뉴얼로 해야 될 경우를 대비해서만 놔두면 되지."
  → 대표님이 하는 일은 두 가지뿐: 영상·기획안 '중단', 트렌드에서 '이거 만들어 줘' 요청. 나머지는 보기만 한다.
  - 기획·제작: 예약 작업 "까치 채널 작업자" / 업로드: "From Korea, With Love 쇼츠 업로드" (대표님 Chrome)
  - 중단 = status 'rework' + feedback {type:'stop', text, youtube_id?}. 사유가 있으면 고치고, 없으면 다른 이야기로 교체
  - 직접 올리기(비상용)는 각 카드의 접힌 칸에만 둔다
  - 표: sc_videos / sc_plans / sc_trends / sc_hot(조회수 수집) / sc_settings(slots, per_day, auto, learn)
-->
<style>
:root{
  --bg:#F6F5F2; --surface:#FFFFFF; --ink:#16181D; --ink2:#3A3F4A; --muted:#6E7380; --line:#E7E4DE;
  --accent:#1F3A5F; --accent-ink:#FFFFFF; --soft:#EAF0F7; --heart:#D94F45; --heart-bg:#FBEAE8;
  --good:#1E7A45; --good-bg:#DDF3E5; --warn:#A35B07; --warn-bg:#FCEFD6; --bad:#B42318; --bad-bg:#FDE4E1; --bar:#8FB0D6;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1117; --surface:#161B24; --ink:#E8EAEE; --ink2:#C6CBD4; --muted:#949AA6; --line:#252C38;
  --accent:#8DB4E2; --accent-ink:#0E1117; --soft:#1B2636; --heart:#F07A70; --heart-bg:#3A1C1A;
  --good:#5BD08A; --good-bg:#123221; --warn:#F2B451; --warn-bg:#33260F; --bad:#F2877C; --bad-bg:#3A1714; --bar:#4A6F9C;
}}
:root[data-theme="dark"]{
  --bg:#0E1117; --surface:#161B24; --ink:#E8EAEE; --ink2:#C6CBD4; --muted:#949AA6; --line:#252C38;
  --accent:#8DB4E2; --accent-ink:#0E1117; --soft:#1B2636; --heart:#F07A70; --heart-bg:#3A1C1A;
  --good:#5BD08A; --good-bg:#123221; --warn:#F2B451; --warn-bg:#33260F; --bad:#F2877C; --bad-bg:#3A1714; --bar:#4A6F9C;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"SUIT Variable","SUIT","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;word-break:keep-all;overflow-wrap:break-word;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.hd{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.hd .nm{font-weight:850;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd .tag{flex:none;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--heart);background:var(--heart-bg);border-radius:999px;padding:3px 9px}
.hd .r{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
.btn{height:36px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13.5px;font-weight:750;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:5px;text-decoration:none}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.no{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
nav.tabs{max-width:1080px;margin:0 auto;padding:0 10px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;border:0;background:none;color:var(--muted);font:inherit;font-size:15px;font-weight:800;padding:10px 12px 11px;border-bottom:2px solid transparent;cursor:pointer}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--heart)}
nav.tabs .cnt{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--heart);color:#FFFFFF;font-size:11px;text-align:center;margin-left:4px;padding:0 5px}
main{max-width:1080px;margin:0 auto;padding:16px 16px 70px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid{display:grid;gap:10px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:700}
.kpi .v{font-size:22px;font-weight:900;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.25}
.kpi .s{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}
h2{font-size:16.5px;margin:24px 0 10px;font-weight:850}
h2 .n{display:block;font-size:12.5px;color:var(--muted);font-weight:700;margin-top:3px;line-height:1.5}
.note{font-size:13px;color:var(--muted);line-height:1.6}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}
.badge{display:inline-flex;align-items:center;font-size:11.5px;font-weight:800;border-radius:999px;padding:2px 8px;background:var(--soft);color:var(--accent);white-space:nowrap}
.badge.good{background:var(--good-bg);color:var(--good)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.mut{background:var(--line);color:var(--muted)}.badge.heart{background:var(--heart-bg);color:var(--heart)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
textarea,input[type=text],input[type=email],input[type=password],input[type=number]{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
textarea{min-height:64px;resize:vertical}
details.fold>summary{cursor:pointer;list-style:none;font-size:15px;font-weight:850;padding:6px 0}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"▸ ";color:var(--muted)}
details.fold[open]>summary::before{content:"▾ "}
details.mini>summary{cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:700}
/* 편성표 */
.sched{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.sday{display:grid;gap:6px;align-content:start}
.sd{font-size:13px;font-weight:850;color:var(--ink2);padding:2px 2px 0}
.scell{display:grid;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:74px;align-content:start;text-decoration:none;color:var(--ink)}
.scell .sh{font-size:12px;font-weight:850;color:var(--muted);font-variant-numeric:tabular-nums}
.scell b{font-size:12.5px;line-height:1.4;font-weight:750;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scell .badge{justify-self:start}
.scell.past{opacity:.55}
/* 목록 */
.item{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:start}
.item .th{width:64px;aspect-ratio:9/16;border-radius:8px;background:var(--line);overflow:hidden;display:block}
.item .th img{width:100%;height:100%;object-fit:cover;display:block}
.item .tt{font-weight:850;font-size:15px;line-height:1.4}
.item .cl{font-size:12.5px;color:var(--ink2);line-height:1.5;background:var(--soft);border-radius:8px;padding:6px 9px}
.item .cl.owner{background:var(--warn-bg)}
.item .meta{display:grid;gap:6px;min-width:0}
/* 트렌드 */
.bars{display:grid;gap:9px}
.bar-row{display:grid;grid-template-columns:96px minmax(0,1fr) 62px;gap:8px;align-items:center;font-size:13px}
.bar-row .track{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.bar-row .fill{height:100%;background:var(--bar);border-radius:6px}
.bar-row .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink2);font:inherit;font-size:13px;font-weight:750;border-radius:999px;padding:6px 12px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hot{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.hot a{display:grid;gap:6px;text-decoration:none;color:var(--ink)}
.hot .th{position:relative;aspect-ratio:9/14;border-radius:10px;overflow:hidden;background:var(--line)}
.hot img{width:100%;height:100%;object-fit:cover;display:block}
.hot .rk{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.66);color:#FFFFFF;font-size:11.5px;font-weight:800;border-radius:6px;padding:2px 6px}
.hot .vw{position:absolute;left:6px;bottom:6px;right:6px;display:flex;justify-content:space-between;gap:4px;color:#FFFFFF;font-size:12px;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.hot .t{font-size:12.5px;font-weight:700;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hot .c{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idea{display:grid;gap:8px}
.idea .t{font-size:15.5px;font-weight:850;line-height:1.4}
.ev{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.ev::-webkit-scrollbar{display:none}
.ev a{flex:none;width:70px;display:grid;gap:3px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:700}
.ev img{width:70px;height:104px;object-fit:cover;border-radius:8px;background:var(--line)}
.cal .it{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cal .it:last-child{border-bottom:0}
.cal .d{font-size:13px;font-weight:850;color:var(--heart);text-align:center;background:var(--heart-bg);border-radius:10px;padding:6px 0;line-height:1.3}
.cal .d small{display:block;font-size:11px;color:var(--ink2);font-weight:700}
/* 성과 */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:800;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.learn{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.learn li{font-size:13.5px;line-height:1.6;color:var(--ink2);padding:9px 11px;background:var(--soft);border-radius:10px}
.learn li small{display:block;color:var(--muted);font-size:11.5px;font-weight:700}
.login{max-width:380px;margin:40px auto;display:grid;gap:10px}
.login label{display:grid;gap:5px;font-size:13px;color:var(--muted);font-weight:700}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer;background:var(--surface)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;transition:.2s;z-index:50;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.bad{background:var(--bad);color:#FFFFFF}
@media (max-width:760px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sched{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hd .nm{font-size:15.5px}
  .hd .r .lg{display:none}
  .hot{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .tbl .m{display:none}
}
@media (max-width:380px){ .hot{grid-template-columns:repeat(2,minmax(0,1fr))} }
</style>
</head>
<body>
<header>
  <div class="hd"><span class="nm" id="chname">From Korea, With Love</span><span class="tag">KACHI</span>
    <div class="r"><a class="btn sm" href="/admin"><span class="lg">밸류노트&nbsp;</span>관리자</a><button class="btn sm" id="out" hidden>로그아웃</button></div></div>
  <nav class="tabs" id="tabs" hidden></nav>
</header>
<main id="main"><div class="empty">불러오는 중</div></main>

<script>
const C = window.HAEJA_CONFIG || {};
const sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short = v => { v = +v || 0; if (v >= 1e8) return (v/1e8).toFixed(1).replace(/\.0$/,'') + '억'; if (v >= 1e4) return (v/1e4).toFixed(v >= 1e5 ? 0 : 1).replace(/\.0$/,'') + '만'; return Math.round(v).toLocaleString('ko-KR'); };
const kst = iso => { if (!iso) return '–'; const d = new Date(Date.parse(iso) + 9*3600e3); return `${d.getUTCMonth()+1}/${d.getUTCDate()} ${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`; };
const kstLong = iso => { if (!iso) return '–'; const d = new Date(Date.parse(iso) + 9*3600e3); return `${d.getUTCMonth()+1}월 ${d.getUTCDate()}일(${'일월화수목금토'[d.getUTCDay()]}) ${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`; };
const dayKST = off => new Date(Date.now() + 9*3600e3 + off*864e5).toISOString().slice(0,10);
const todayKST = () => dayKST(0);
const dday = d => { const n = Math.round((Date.parse(d + 'T00:00:00+09:00') - Date.parse(todayKST() + 'T00:00:00+09:00')) / 864e5); return n === 0 ? 'D-DAY' : n > 0 ? 'D-' + n : 'D+' + (-n); };
const ts = x => Date.parse(x || '2100-01-01');
const cleanTitle = t => String(t || '').replace(/\s*#shorts\b/ig, '').replace(/\s{2,}/g, ' ').trim();
const withShortsTag = d => { d = String(d || '').trim(); return /#shorts\b/i.test(d) ? d : (d ? d + ' #shorts' : '#shorts'); };
const thumbOf = id => `https://i.ytimg.com/vi/${encodeURIComponent(id)}/hqdefault.jpg`;
let toastT; function toast(t, bad){ let el = $('#toast'); if(!el){ el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = t; el.classList.toggle('bad', !!bad); el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2600); }
const store = { get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(_) { return d; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(_){} } };

const EMO = { mom:'엄마', grand:'할머니·할아버지', animal:'동물 가족', kind:'작은 친절', korea:'한국 문화', underdog:'역경·반전', style:'미니어처 감성' };
const SLOT_NOTE = { '03:00': '유럽 저녁', '08:00': '미국 동부 저녁', '13:00': '미국 서부 저녁', '22:00': '인도 저녁·유럽 낮' };
const S = { tab: store.get('sc-tab3', 'sched'), trends: [], hot: [], plans: [], videos: [], settings: {}, err: '', queue: {}, hotCat: 'all', hotSort: 'per_day' };
const SLOTS = () => (S.settings.slots && S.settings.slots.length ? S.settings.slots : ['03:00', '08:00', '13:00', '22:00']);
const isEmo = v => v.kind === 'short' && !v.parent_id;
const lastNote = fb => { fb = (fb || []).filter(f => f && f.text); return fb[fb.length - 1]; };

/* ---------- 로그인 ---------- */
function loginView(msg){
  $('#tabs').hidden = true; $('#out').hidden = true;
  $('#main').innerHTML = `<div class="card login"><div style="font-weight:850;font-size:17px">관리자 로그인</div>
    <div class="note">밸류노트 관리자 계정으로 로그인하세요.</div>
    <label>이메일<input id="em" type="email" autocomplete="email"></label>
    <label>비밀번호<input id="pw" type="password" autocomplete="current-password"></label>
    <button class="btn pri" id="go">로그인</button><div class="note" id="msg">${esc(msg||'')}</div></div>`;
  $('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('#go').click(); });
  $('#go').onclick = async () => {
    $('#msg').textContent = '확인 중';
    const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
    if (error) { $('#msg').textContent = '로그인하지 못했습니다: ' + error.message; return; }
    boot();
  };
}

/* ---------- 데이터 ---------- */
async function loadAll(){
  const since = new Date(Date.now() - 3*864e5).toISOString().slice(0,10);
  const [t, h, p, v, s] = await Promise.all([
    sb.from('sc_trends').select('*').neq('kind', 'legacy').order('collected_at', { ascending: false }).limit(200),
    sb.from('sc_hot').select('*').gte('day', since).order('views', { ascending: false }).limit(600),
    sb.from('sc_plans').select('*').order('created_at', { ascending: false }).limit(300),
    sb.from('sc_videos').select('*').order('created_at', { ascending: false }).limit(300),
    sb.from('sc_settings').select('value').eq('id', 1).maybeSingle()
  ]);
  const err = [t, p, v, s].find(r => r.error);
  S.err = err ? err.error.message : '';
  S.trends = t.data || []; S.hot = h.error ? [] : (h.data || []); S.plans = p.data || []; S.videos = v.data || []; S.settings = (s.data && s.data.value) || {};
  if (S.settings.channel_name) $('#chname').textContent = S.settings.channel_name;
  try { const q = await fetch('/social/side/queue.json?t=' + Date.now()).then(r => r.ok ? r.json() : []); S.queue = {}; (q || []).forEach(m => { S.queue[m.id] = m; }); } catch(_) { S.queue = {}; }
}

/* ---------- 탭 ---------- */
const TABS = [
  ['sched', '편성', () => S.videos.filter(x => isEmo(x) && x.status === 'rework').length + S.plans.filter(p => p.status === 'rework').length],
  ['trend', '트렌드', () => 0],
  ['perf', '성과', () => 0],
  ['set', '설정', () => 0]
];
function renderTabs(){
  $('#tabs').hidden = false;
  $('#tabs').innerHTML = TABS.map(([k, name, cnt]) => { const c = cnt(); return `<button data-k="${k}" class="${S.tab === k ? 'on' : ''}">${name}${c ? `<span class="cnt">${c}</span>` : ''}</button>`; }).join('');
  $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => { S.tab = b.dataset.k; store.set('sc-tab3', S.tab); render(); window.scrollTo(0, 0); });
}
function render(){
  renderTabs();
  if (S.err) { $('#main').innerHTML = `<div class="card empty">불러오지 못했습니다: ${esc(S.err)}</div>`; return; }
  if (!TABS.find(t => t[0] === S.tab)) S.tab = 'sched';
  ({ sched: viewSched, trend: viewTrend, perf: viewPerf, set: viewSet })[S.tab]();
}
function kpi(l, v, s){ return `<div class="card kpi"><div class="l">${esc(l)}</div><div class="v">${esc(v)}</div>${s ? `<div class="s">${esc(s)}</div>` : ''}</div>`; }

/* ---------- 편성 ---------- */
// 칸마다 영상(예약·대기·수정) 또는 기획안(제작 예정·제작 중)을 붙인다
function slotEntries(){
  const now = Date.now(), near = (x, t) => x && Math.abs(ts(x) - t) <= 30*60e3;
  const vids = S.videos.filter(v => isEmo(v) && ['uploaded','approved','review','rework'].includes(v.status));
  const plans = S.plans.filter(p => ['approved','producing','pending','requested','rework'].includes(p.status));
  return [0,1,2,3,4].map(off => { const d = dayKST(off); return { d, cells: SLOTS().map(hm => {
    const t = Date.parse(`${d}T${hm}:00+09:00`);
    const v = vids.find(v => near(v.scheduled_at, t)); const p = !v && plans.find(p => near(p.publish_at, t));
    return { hm, t, past: t < now, v, p };
  }) }; });
}
function stateOf(x){
  if (x.v) { const v = x.v; if (v.status === 'uploaded') return x.past ? ['공개됨', 'good'] : ['유튜브 예약됨', 'good'];
    return v.status === 'approved' ? ['완성 · 예약 대기', ''] : v.status === 'rework' ? ['수정 중', 'bad'] : ['완성', ''] }
  if (x.p) return x.p.status === 'producing' ? ['제작 중', 'warn'] : x.p.status === 'rework' ? ['기획 수정 중', 'bad'] : ['제작 예정', 'mut'];
  return x.past ? ['지남', 'mut'] : ['비어 있음', 'bad'];
}
function viewSched(){
  const grid = slotEntries();
  const now = Date.now();
  const cells = grid.flatMap(g => g.cells);
  const future = cells.filter(c => !c.past);
  const done48 = future.filter(c => c.t < now + 48*3600e3);
  const ready48 = done48.filter(c => c.v && ['uploaded','approved','review'].includes(c.v.status)).length;
  const nextPub = cells.find(c => !c.past && c.v && c.v.status === 'uploaded');
  const wk = d => { const x = new Date(d + 'T00:00:00+09:00'); return `${x.getMonth()+1}/${x.getDate()}(${'일월화수목금토'[x.getDay()]})`; };
  const auto = S.settings.auto !== false;
  // 아래 목록: 앞으로 올라갈 것(영상+기획안) 시간순
  const list = future.filter(c => c.v || c.p);
  const fixing = S.videos.filter(v => isEmo(v) && v.status === 'rework' && !future.find(c => c.v === v));
  const live = S.videos.filter(v => isEmo(v) && v.status === 'uploaded' && ts(v.scheduled_at) <= now).sort((a,b) => ts(b.scheduled_at) - ts(a.scheduled_at));
  const box = S.videos.filter(v => v.status === 'archived' || v.status === 'rejected' || (!isEmo(v) && v.status !== 'uploaded'));

    <div class="card" style="display:grid;gap:6px">
      <div class="row"><span class="badge ${auto ? 'good' : 'warn'}">${auto ? '자동 진행 중' : '자동 꺼짐'}</span><b>하루 ${S.settings.per_day || SLOTS().length}편 · ${SLOTS().join(' / ')}</b></div>
      <div class="note">Claude가 기획 → 제작 → 유튜브 예약까지 합니다. 대표님은 아니다 싶은 것만 <b>중단</b>을 누르시면 됩니다.
        앞으로 48시간 ${done48.length}칸 중 <b>${ready48}칸 완성</b>${nextPub ? ` · 다음 공개 <b>${kst(nextPub.v.scheduled_at)}</b>` : ''}.</div>
    </div>
    <h2>편성표 <span class="n">앞으로 5일 · 칸을 누르면 아래 해당 편으로 이동</span></h2>
    <div class="sched">${grid.map(g => `<div class="sday"><div class="sd">${wk(g.d)}${g.d === dayKST(0) ? ' · 오늘' : ''}</div>${g.cells.map(c => { const [l, k] = stateOf(c); const it = c.v || c.p;
      return `<a class="scell${c.past ? ' past' : ''}" ${it ? `href="#i-${esc(it.id)}"` : ''}><div class="sh">${c.hm}</div><span class="badge ${k}">${l}</span>${it ? `<b>${esc(cleanTitle(it.title))}</b>` : ''}</a>`; }).join('')}</div>`).join('')}</div>
    <h2>올라갈 순서 <span class="n">마음에 안 들면 '중단' · 사유를 적으면 고치고, 비워 두면 다른 이야기로 바꿉니다</span></h2>
    ${list.length || fixing.length ? `<div class="grid">${list.map(c => itemCard(c.v || c.p, !!c.v, c)).join('')}${fixing.map(v => itemCard(v, true, null)).join('')}</div>` : '<div class="card empty">아직 편성된 것이 없습니다. Claude가 곧 채웁니다.</div>'}
    ${live.length ? `<details class="fold" style="margin-top:18px"><summary>공개된 영상 ${live.length}편</summary><div class="grid">${live.slice(0, 40).map(v => itemCard(v, true, null)).join('')}</div></details>` : ''}
    ${box.length ? `<details class="fold" style="margin-top:6px"><summary>보관함 ${box.length}편 (중단·이전 방향)</summary><div class="grid">${box.map(v => itemCard(v, true, null)).join('')}</div></details>` : ''}`;
  bindSched();

function itemCard(x, isVid, cell){
  const now = Date.now();

    : (x.status === 'producing' ? ['제작 중', 'warn'] : x.status === 'rework' ? ['기획 수정 중', 'bad'] : ['제작 예정', 'mut']);
  const n = lastNote(x.feedback);
  const views = isVid && x.stats && x.stats.now ? `<span class="badge">조회수 ${short(x.stats.now.views)}</span>` : '';
  const thumb = isVid ? (x.youtube_id ? thumbOf(x.youtube_id) : x.thumb) : '';
  const canStop = isVid ? (['approved','review'].includes(x.status) || (x.status === 'uploaded' && ts(when) > now)) : ['approved','producing','pending'].includes(x.status);
  const canBack = ['rejected','archived'].includes(x.status) || x.status === 'rework';
  const Q = isVid ? (S.queue[x.id] || {}) : {};
  const desc = isVid ? withShortsTag(Q.description || x.description || '') : '';
  const tags = isVid ? (Q.tags || x.tags || []).filter(t => !/^#?shorts$/i.test(t)).join(', ') : '';
  const cp = (text, label) => text ? `<button class="btn sm" data-copy="${esc(text)}" data-what="${esc(label)}">${label}</button>` : '';
  return `<div class="card" id="i-${esc(x.id)}" data-id="${esc(x.id)}" data-kind="${isVid ? 'v' : 'p'}"><div class="item">
    ${isVid ? `<a class="th" href="${esc(x.video_url || '#')}" target="_blank" rel="noopener">${thumb ? `<img src="${esc(thumb)}" alt="" loading="lazy">` : ''}</a>` : `<div class="th"></div>`}
    <div class="meta">
      <div class="row"><span class="badge ${st[1]}">${st[0]}</span>${x.emotion ? `<span class="badge heart">${esc(EMO[x.emotion] || x.emotion)}</span>` : ''}${views}<span class="note" style="margin-left:auto">${when ? kstLong(when) : ''}</span></div>

      <div class="row">
        ${canStop ? `<button class="btn sm no" data-stop>중단</button>` : ''}
        ${canBack ? `<button class="btn sm" data-back>${x.status === 'rework' ? '중단 취소' : '되살리기'}</button>` : ''}

      </div>
      ${isVid && x.video_url && ['approved','review','uploaded'].includes(x.status) ? `<details class="mini"><summary>비상시 직접 올리기</summary>

        <div class="note" style="margin-top:6px">예약 ${kstLong(when)} · 아동용 아님 · 변경·합성 콘텐츠 아니요</div></details>` : ''}

}
function bindSched(){
  document.querySelectorAll('[data-id]').forEach(card => {
    const id = card.dataset.id, isVid = card.dataset.kind === 'v';
    const x = isVid ? S.videos.find(v => v.id === id) : S.plans.find(p => p.id === id); if (!x) return;
    const table = isVid ? 'sc_videos' : 'sc_plans';
    const upd = async (obj, msg) => { const { error } = await sb.from(table).update(Object.assign({ updated_at: new Date().toISOString() }, obj)).eq('id', id); if (error) { toast('저장하지 못했습니다: ' + error.message, true); return; } await reload(); toast(msg); };
    const on = (sel, f) => { const b = card.querySelector(sel); if (b) b.onclick = f; };
    on('[data-stop]', () => {
      const sched = isVid && x.status === 'uploaded';
      const t = prompt((sched ? '유튜브에 예약된 영상입니다. 비공개로 돌리고 처리합니다.\n\n' : '') + '중단 사유를 적으면 그대로 고칩니다. 비워 두면 다른 이야기로 바꿉니다.', '');
      if (t === null) return;
      const entry = { at: new Date().toISOString(), by: 'owner', type: 'stop', text: t.trim() || '중단 (사유 없음 → 다른 이야기로 교체)' };
      if (isVid && x.youtube_id) entry.youtube_id = x.youtube_id;
      const fb = (x.feedback || []).concat([entry]);
      if (isVid) upd({ status: 'rework', note: t.trim() || null, youtube_id: null, uploaded_at: null, feedback: fb }, sched ? '중단했습니다. 비공개로 돌리고 처리합니다' : '중단했습니다. Claude가 처리합니다');
      else upd(t.trim() ? { status: 'rework', note: t.trim(), feedback: fb } : { status: 'rejected', feedback: fb }, t.trim() ? '중단했습니다. 고쳐서 다시 만듭니다' : '중단했습니다. 다른 이야기로 채웁니다');
    });
    on('[data-back]', () => upd({ status: isVid ? 'approved' : 'approved' }, '되돌렸습니다'));
    on('[data-up]', () => {
      const raw = prompt('직접 올린 쇼츠 주소를 붙여 넣어 주세요', ''); if (raw === null) return;
      const m = String(raw).match(/(?:v=|youtu\.be\/|shorts\/)([\w-]{11})/); const yid = m ? m[1] : String(raw).trim();
      if (!/^[\w-]{11}$/.test(yid)) { toast('주소에서 영상 ID를 찾지 못했습니다', true); return; }
      upd({ status: 'uploaded', youtube_id: yid, uploaded_at: new Date().toISOString() }, '올림으로 표시했습니다');
    });
    card.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {
      try { await navigator.clipboard.writeText(b.dataset.copy); toast(b.dataset.what.replace(' 복사', '') + ' 복사했습니다'); } catch(_) { prompt('아래 내용을 길게 눌러 복사하세요', b.dataset.copy); }
    });
  });
}

async function requestPlan(text, trend){
  const pid = 'R' + new Date(Date.now() + 9*3600e3).toISOString().slice(2,19).replace(/[-T:]/g, '');
  const row = { id: pid, line: 'emo', status: 'requested', title: (trend ? trend.keyword : text).slice(0, 80), note: text || null, outline: [],
    feedback: [{ at: new Date().toISOString(), by: 'owner', type: 'request', text: text || ('트렌드에서 요청: ' + (trend ? trend.keyword : '')) }] };
  if (trend) Object.assign(row, { trend_id: trend.id, emotion: trend.emotion, korea: trend.korea, title_ko: trend.apply || null, signal: { evidence: trend.evidence || [] } });
  const { error } = await sb.from('sc_plans').insert(row);
  if (error) { toast('요청하지 못했습니다: ' + error.message, true); return false; }
  if (trend) await sb.from('sc_trends').update({ status: 'picked' }).eq('id', trend.id);
  await reload(); toast('요청했습니다. Claude가 다음 빈칸에 넣어 만듭니다'); return true;
}

  document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { S.hotSort = b.dataset.s; viewTrend(); });
  const hm = $('#hmore'); if (hm) hm.onclick = () => { S.hotMore = true; viewTrend(); };
  $('#reqbtn').onclick = async () => { const t = $('#req').value.trim(); if (!t) { toast('만들고 싶은 이야기를 적어 주세요', true); return; } $('#reqbtn').disabled = true; await requestPlan(t, null); };
  document.querySelectorAll('[data-make]').forEach(b => b.onclick = async () => { const tr = S.trends.find(x => x.id === +b.dataset.make); b.disabled = true; if (!(await requestPlan('', tr))) b.disabled = false; });
}

/* ---------- 성과 ---------- */
function viewPerf(){
  const now = Date.now();
  const up = S.videos.filter(v => v.status === 'uploaded' && isEmo(v) && ts(v.scheduled_at) <= now).sort((a,b) => ts(b.scheduled_at) - ts(a.scheduled_at));
  const vw = v => +(v.stats?.now?.views ?? 0);
  const tot = up.reduce((a, v) => a + vw(v), 0);
  const best = up.slice().sort((a,b) => vw(b) - vw(a))[0];
  const h24 = up.map(v => +(v.stats?.h24?.views)).filter(x => x >= 0 && !isNaN(x)).sort((a,b) => a - b);
  const med = h24.length ? h24[Math.floor(h24.length / 2)] : null;
  const plan = v => S.plans.find(p => p.id === v.plan_id) || {};
  const fmt = v => (plan(v).spec || {}).format || plan(v).emotion || '–';
  const learn = (S.settings.learn || []).slice(-8).reverse();
  const cell = (v, k) => v.stats?.[k] ? short(v.stats[k].views) : '–';
  const judge = v => { const x = +(v.stats?.h24?.views); if (!med || isNaN(x)) return ''; return x >= med * 2 ? '<span class="badge good">잘 됨</span>' : x < med * 0.5 ? '<span class="badge bad">약함</span>' : ''; };
  $('#main').innerHTML = `
    <div class="grid kpis">
      ${kpi('공개된 쇼츠', up.length + '편', '')}
      ${kpi('누적 조회수', short(tot), '매일 아침 갱신')}
      ${kpi('24시간 중앙값', med != null ? short(med) + '회' : '–', '이 값의 2배면 잘 됨, 절반 미만이면 약함')}
      ${kpi('최고 영상', best ? short(vw(best)) + '회' : '–', best ? cleanTitle(best.title).slice(0, 26) : '')}
    </div>
    <h2>Claude가 배운 것 <span class="n">반응을 보고 다음 기획에 반영하는 내용</span></h2>
    ${learn.length ? `<ul class="learn">${learn.map(l => `<li><small>${kst(l.at)}</small>${esc(l.text)}</li>`).join('')}</ul>` : '<div class="card empty">아직 판단할 만큼 데이터가 없습니다. 공개 후 24시간이 지난 영상이 쌓이면 여기에 정리합니다.</div>'}
    <h2>영상별 조회수</h2>
    ${up.length ? `<div class="card tbl-wrap" style="padding:4px 8px"><table class="tbl"><thead><tr><th>영상</th><th style="text-align:right">6시간</th><th style="text-align:right">24시간</th><th style="text-align:right" class="m">48시간</th><th style="text-align:right">지금</th><th></th></tr></thead><tbody>
      ${up.map(v => `<tr><td><div style="font-weight:800">${esc(cleanTitle(v.title))}</div><div class="note">${kst(v.scheduled_at)} · ${esc(EMO[fmt(v)] || fmt(v))}${v.stats?.studio?.viewed_pct != null ? ` · 시청 선택 ${v.stats.studio.viewed_pct}%` : ''}${v.youtube_id ? ` · <a href="https://youtube.com/shorts/${esc(v.youtube_id)}" target="_blank" rel="noopener">보기</a>` : ''}</div></td>
        <td class="n">${cell(v,'h6')}</td><td class="n">${cell(v,'h24')}</td><td class="n m">${cell(v,'h48')}</td><td class="n"><b>${v.stats?.now ? short(vw(v)) : '–'}</b></td><td>${judge(v)}</td></tr>`).join('')}
    </tbody></table></div>` : '<div class="card empty">아직 공개된 영상이 없습니다.</div>'}`;
}

/* ---------- 설정 ---------- */
function viewSet(){
  const s = S.settings;
  $('#main').innerHTML = `<div class="card" style="display:grid;gap:14px">
    <label class="chk" style="width:max-content"><input type="checkbox" id="s-auto" ${s.auto !== false ? 'checked' : ''}> 자동 진행 (끄면 기획·제작·업로드가 멈춥니다)</label>
    <label class="note" style="display:grid;gap:5px;font-weight:700">업로드 시각 (한국 시각, 쉼표로 구분 · 칸 수 = 하루 편수)<input type="text" id="s-slots" value="${esc(SLOTS().join(', '))}"></label>
    <div class="note">${SLOTS().map(h => `${h} ${SLOT_NOTE[h] || ''}`).join(' · ')}</div>
    <label class="note" style="display:grid;gap:5px;font-weight:700">핸들 (유튜브에서 실제로 정한 것)<input type="text" id="s-handle" value="${esc(s.handle || '')}" placeholder="@KachiFromKorea"></label>
    <div><button class="btn pri" id="s-save">저장</button></div></div>`;
  $('#s-save').onclick = async () => {
    const slots = $('#s-slots').value.split(/[,\s]+/).filter(x => /^\d{1,2}:\d{2}$/.test(x)).map(x => x.padStart(5, '0')).sort();
    if (!slots.length) { toast('업로드 시각을 하나 이상 적어 주세요', true); return; }
    const h = $('#s-handle').value.trim().replace(/^@+/, '');
    const value = Object.assign({}, S.settings, { auto: $('#s-auto').checked, auto_plan: $('#s-auto').checked, slots, per_day: slots.length, handle: h ? '@' + h : '' });
    const { error } = await sb.from('sc_settings').upsert({ id: 1, value });
    if (error) { toast('저장하지 못했습니다: ' + error.message, true); return; }
    await reload(); toast('저장했습니다');
  };
}

/* ---------- 시작 ---------- */
async function reload(){ const y = window.scrollY; await loadAll(); render(); window.scrollTo(0, y); }
async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return loginView();
  const { data: admin } = await sb.rpc('is_admin');
  if (!admin) { await sb.auth.signOut(); return loginView('관리자 계정이 아닙니다.'); }
  $('#out').hidden = false;
  $('#out').onclick = async () => { await sb.auth.signOut(); loginView(); };
  await reload();
}
boot();
</script>
</body>
</html>
