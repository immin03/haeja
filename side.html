<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>황제의 일기 관리자</title>
<link rel="icon" type="image/png" href="/favicon-64.png?v=6">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2.0.5/fonts/variable/woff2/SUIT-Variable.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<style>@font-face{font-family:"VN Arrow";src:url(/fonts/vn-arrow-400.woff2) format("woff2");font-weight:100 599;unicode-range:U+2190-21FF,U+27F6;font-display:swap}@font-face{font-family:"VN Arrow";src:url(/fonts/vn-arrow-700.woff2) format("woff2");font-weight:600 1000;unicode-range:U+2190-21FF,U+27F6;font-display:swap}
:root{
  --bg:#F6F5F2; --surface:#FFFFFF; --ink:#16181D; --ink2:#3A3F4A; --muted:#6E7380; --line:#E7E4DE;
  --accent:#1F3A5F; --accent-ink:#FFFFFF; --soft:#EAF0F7; --heart:#A8822E; --heart-bg:#F5EDDA;
  --good:#1E7A45; --good-bg:#DDF3E5; --warn:#A35B07; --warn-bg:#FCEFD6; --bad:#B42318; --bad-bg:#FDE4E1; --bar:#8FB0D6;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1117; --surface:#161B24; --ink:#E8EAEE; --ink2:#C6CBD4; --muted:#949AA6; --line:#252C38;
  --accent:#8DB4E2; --accent-ink:#0E1117; --soft:#1B2636; --heart:#D6B160; --heart-bg:#30281A;
  --good:#5BD08A; --good-bg:#123221; --warn:#F2B451; --warn-bg:#33260F; --bad:#F2877C; --bad-bg:#3A1714; --bar:#4A6F9C;
}}
:root[data-theme="dark"]{
  --bg:#0E1117; --surface:#161B24; --ink:#E8EAEE; --ink2:#C6CBD4; --muted:#949AA6; --line:#252C38;
  --accent:#8DB4E2; --accent-ink:#0E1117; --soft:#1B2636; --heart:#D6B160; --heart-bg:#30281A;
  --good:#5BD08A; --good-bg:#123221; --warn:#F2B451; --warn-bg:#33260F; --bad:#F2877C; --bad-bg:#3A1714; --bar:#4A6F9C;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"VN Arrow","SUIT Variable","SUIT","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;word-break:keep-all;overflow-wrap:break-word;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.hd{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.hd .nm{font-weight:850;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd .tag{flex:none;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--heart);background:var(--heart-bg);border-radius:999px;padding:3px 9px}
.hd .r{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
.btn{height:36px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13.5px;font-weight:750;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:5px;text-decoration:none}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.no{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
nav.tabs{max-width:1080px;margin:0 auto;padding:0 10px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;border:0;background:none;color:var(--muted);font:inherit;font-size:15px;font-weight:800;padding:10px 12px 11px;border-bottom:2px solid transparent;cursor:pointer}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--heart)}
nav.tabs .cnt{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--heart);color:#FFFFFF;font-size:11px;text-align:center;margin-left:4px;padding:0 5px}
main{max-width:1080px;margin:0 auto;padding:16px 16px 70px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid{display:grid;gap:10px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:700}
.kpi .v{font-size:22px;font-weight:900;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.25}
.kpi .s{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}
h2{font-size:16.5px;margin:24px 0 10px;font-weight:850}
h2 .n{display:block;font-size:12.5px;color:var(--muted);font-weight:700;margin-top:3px;line-height:1.5}
.note{font-size:13px;color:var(--muted);line-height:1.6}
/* 수익 창출 목표 카드 (밸류노트 관리자 브리핑과 같은 구성) */
.gl{margin-top:10px;border-left:4px solid var(--ink);display:grid;gap:10px}
.gl-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.gl-top b{font-size:16.5px;font-weight:850;line-height:1.4}
.gl-k{font-size:12px;color:var(--muted);font-weight:700}
.gl-rule{font-size:13px;color:var(--ink2);line-height:1.55}
.gl-row{display:grid;gap:5px}
.gl-h{display:flex;justify-content:space-between;gap:10px;font-size:14px;flex-wrap:wrap}
.gl-h b{font-weight:800}
.gl-h span{color:var(--ink2);font-variant-numeric:tabular-nums;font-weight:650}
.gl-bar{height:9px;border-radius:5px;background:var(--line);overflow:hidden}
.gl-bar i{display:block;height:100%;border-radius:5px;background:var(--ink)}
.gl-s{font-size:12px;color:var(--muted);line-height:1.5}
.gl-foot{font-size:12.5px;color:var(--muted);line-height:1.5;border-top:1px solid var(--line);padding-top:9px}
.gl-ch{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:4px}
.gl-cht{font-size:13.5px;font-weight:800}
.gl-cht span{font-size:12px;color:var(--muted);font-weight:650;margin-left:4px}
.gl-ch svg{display:block;overflow:visible}
.gl-ch text{font-size:11px;fill:var(--muted);font-family:inherit;font-variant-numeric:tabular-nums}
.gl-ch text.lv{fill:var(--ink);font-weight:800;font-size:12px}
.gl-ch .gr{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.gl-ch .ln{fill:none;stroke:var(--heart);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.gl-ch .ar{fill:var(--heart-bg);opacity:.7}
.gl-ch .dt{fill:var(--surface);stroke:var(--heart);stroke-width:1.6;vector-effect:non-scaling-stroke}
.gl-ch .dt.last{fill:var(--heart)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}
.badge{display:inline-flex;align-items:center;font-size:11.5px;font-weight:800;border-radius:999px;padding:2px 8px;background:var(--soft);color:var(--accent);white-space:nowrap}
.badge.gold{background:var(--heart-bg);color:var(--heart)}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.thumbs a{display:grid;gap:4px;text-decoration:none;color:var(--ink2);font-size:12px;line-height:1.4}
.thumbs img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:var(--line);display:block}
.badge.good{background:var(--good-bg);color:var(--good)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.mut{background:var(--line);color:var(--muted)}.badge.heart{background:var(--heart-bg);color:var(--heart)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
textarea,input[type=text],input[type=email],input[type=password],input[type=number]{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
textarea{min-height:64px;resize:vertical}
details.fold>summary{cursor:pointer;list-style:none;font-size:15px;font-weight:850;padding:6px 0}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"▸ ";color:var(--muted)}
details.fold[open]>summary::before{content:"▾ "}
details.mini>summary{cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:700}
/* 편성표 */
.sched{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.sday{display:grid;gap:6px;align-content:start}
.sd{font-size:13px;font-weight:850;color:var(--ink2);padding:2px 2px 0}
.scell{display:grid;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:74px;align-content:start;text-decoration:none;color:var(--ink)}
.scell .sh{font-size:12px;font-weight:850;color:var(--muted);font-variant-numeric:tabular-nums}
.scell b{font-size:12.5px;line-height:1.4;font-weight:750;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scell .badge{justify-self:start}
.scell.past{opacity:.55}
/* 목록 */
.item{display:grid;grid-template-columns:80px minmax(0,1fr);gap:12px;align-items:start}
button.th{position:relative;padding:0;border:0;cursor:pointer;width:80px!important}
button.th .pl{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.18)}
button.th .pl i{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;font-style:normal;font-size:12px;color:#111;padding-left:2px}
.vmodal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.86);display:grid;place-items:center;padding:16px}
.vmodal .box{position:relative;width:min(420px,100%);max-height:100%;display:grid;gap:10px}
.vmodal video{width:100%;max-height:calc(100vh - 110px);aspect-ratio:9/16;background:#000;border-radius:12px;object-fit:contain}
.vmodal .vt{color:#fff;font-weight:700;font-size:14.5px;word-break:keep-all;padding-right:44px}
.vmodal .x{position:absolute;top:-4px;right:0;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:18px;cursor:pointer}
.vmodal .ld{color:#ddd;font-size:13.5px;text-align:center;padding:40px 0}
.item .th{width:64px;aspect-ratio:9/16;border-radius:8px;background:var(--line);overflow:hidden;display:block}
.item .th img{width:100%;height:100%;object-fit:cover;display:block}
.item .tt{font-weight:850;font-size:15px;line-height:1.4}
.item .cl{font-size:12.5px;color:var(--ink2);line-height:1.5;background:var(--soft);border-radius:8px;padding:6px 9px}
.item .cl.owner{background:var(--warn-bg)}
.item .meta{display:grid;gap:6px;min-width:0}
/* 트렌드 */
.bars{display:grid;gap:9px}
.bar-row{display:grid;grid-template-columns:96px minmax(0,1fr) 62px;gap:8px;align-items:center;font-size:13px}
.bar-row .track{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.bar-row .fill{height:100%;background:var(--bar);border-radius:6px}
.bar-row .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink2);font:inherit;font-size:13px;font-weight:750;border-radius:999px;padding:6px 12px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hot{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.hot a{display:grid;gap:6px;text-decoration:none;color:var(--ink)}
.hot .th{position:relative;aspect-ratio:9/14;border-radius:10px;overflow:hidden;background:var(--line)}
.hot img{width:100%;height:100%;object-fit:cover;display:block}
.hot .rk{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.66);color:#FFFFFF;font-size:11.5px;font-weight:800;border-radius:6px;padding:2px 6px}
.hot .vw{position:absolute;left:6px;bottom:6px;right:6px;display:flex;justify-content:space-between;gap:4px;color:#FFFFFF;font-size:12px;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.hot .t{font-size:12.5px;font-weight:700;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hot .c{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idea{display:grid;gap:8px}
.idea .t{font-size:15.5px;font-weight:850;line-height:1.4}
.ev{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.ev::-webkit-scrollbar{display:none}
.ev a{flex:none;width:70px;display:grid;gap:3px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:700}
.ev img{width:70px;height:104px;object-fit:cover;border-radius:8px;background:var(--line)}
.cal .it{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cal .it:last-child{border-bottom:0}
.cal .d{font-size:13px;font-weight:850;color:var(--heart);text-align:center;background:var(--heart-bg);border-radius:10px;padding:6px 0;line-height:1.3}
.cal .d small{display:block;font-size:11px;color:var(--ink2);font-weight:700}
/* 성과 */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:800;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.wk th,.wk td{text-align:center;white-space:nowrap}.wk th:first-child,.wk td:first-child{text-align:left;min-width:120px}.wk td:first-child small{display:block;color:var(--muted);font-size:11.5px;font-weight:600;margin-top:2px}.wk .td{background:rgba(201,162,39,.10)}.wk th.td{color:#a07d12}.wk .sum td{font-weight:800}.wk .off td{opacity:.5}.wk .dash{color:var(--muted)}
.learn{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.learn li{font-size:13.5px;line-height:1.6;color:var(--ink2);padding:9px 11px;background:var(--soft);border-radius:10px}
.learn li small{display:block;color:var(--muted);font-size:11.5px;font-weight:700}
.imp{display:grid;gap:8px}
.imp .t{font-size:15.5px;font-weight:850;line-height:1.4}
.imp .sec{font-size:13px;line-height:1.6;color:var(--ink2)}
.imp .sec b{display:block;font-size:11.5px;color:var(--muted);font-weight:800;margin-bottom:1px}
.imp .ap{background:var(--good-bg);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.6;color:var(--ink)}
.imp .ap b{display:block;font-size:11.5px;color:var(--good);font-weight:800}
.imp.done{opacity:.72}
.bk .sub{font-size:11.5px;font-weight:800;color:var(--heart)}
.login{max-width:380px;margin:40px auto;display:grid;gap:10px}
.login label{display:grid;gap:5px;font-size:13px;color:var(--muted);font-weight:700}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer;background:var(--surface)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;transition:.2s;z-index:50;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.bad{background:var(--bad);color:#FFFFFF}
/* 브리핑 · 통합 요청칸 (2026-10-30) */
.ask{max-width:1080px;margin:0 auto;padding:2px 16px 10px;display:flex;gap:6px;align-items:flex-start}
.ask textarea{min-height:38px;height:38px;padding:8px 11px;font-size:14px;resize:none;line-height:1.45;overflow:hidden}
.ask .btn{height:38px;flex:none}
.asknote{max-width:1080px;margin:-6px auto 0;padding:0 16px 8px;font-size:11.5px;color:var(--muted);font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-size:13.5px;font-weight:800;padding:7px 14px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.hl{font-size:16px;font-weight:800;line-height:1.6}
.hl p{margin:0}.hl p+p{margin-top:4px;font-weight:700;color:var(--ink2);font-size:15px}
.ck{display:grid;gap:7px;padding:12px 0;border-bottom:1px solid var(--line)}
.ck:first-child{padding-top:2px}.ck:last-child{border-bottom:0;padding-bottom:2px}
.ck .t{font-weight:850;font-size:14.5px;line-height:1.45;display:flex;gap:8px;align-items:baseline}
.ck .b{font-size:13px;color:var(--ink2);line-height:1.6}
.ck .nx{font-size:12.5px;color:var(--muted);line-height:1.55}
.ck .cmt{display:flex;gap:6px}
.ck .cmt input{height:32px;padding:5px 10px;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--bar);transform:translateY(-1px)}
.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}.dot.good{background:var(--good)}.dot.mut{background:var(--muted)}
.pv{display:grid;grid-template-columns:46px minmax(0,1fr);gap:11px;padding:11px 0;border-bottom:1px solid var(--line);align-items:start}
.pv:first-child{padding-top:2px}.pv:last-child{border-bottom:0;padding-bottom:2px}
.pth{position:relative;width:46px;aspect-ratio:9/16;border-radius:7px;overflow:hidden;background:var(--line);border:0;padding:0;cursor:pointer;display:block}
.pth img{width:100%;height:100%;object-fit:cover;display:block}
.pth i{position:absolute;inset:auto 0 4px 0;margin:auto;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.92);color:#111;font-size:9px;font-style:normal;display:grid;place-items:center;padding-left:1px}
.pv .tt{font-weight:800;font-size:14px;line-height:1.4}
.nums{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:3px}
.nums b{color:var(--ink);font-weight:800}
.pv .why{font-size:12.5px;color:var(--ink2);line-height:1.5;margin-top:4px}
.lp{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.lp:first-child{padding-top:2px}.lp:last-child{border-bottom:0;padding-bottom:2px}
.lp .t{font-weight:850;font-size:14px;line-height:1.45}
.lp .s{font-size:12.5px;color:var(--muted);line-height:1.5}
.sub-h{font-size:12.5px;font-weight:850;color:var(--muted);margin:2px 0 4px}
details.fold .card{margin-top:8px}
@media (max-width:760px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sched{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hd .nm{font-size:15.5px}
  .hd .r .lg{display:none}
  .hot{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .tbl .m{display:none}
}
@media (max-width:380px){ .hot{grid-template-columns:repeat(2,minmax(0,1fr))} }
.rvw{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.rvc{display:grid;gap:8px;align-content:start}
.rvc video{width:100%;aspect-ratio:9/16;background:#000;border-radius:10px;object-fit:contain}
.rvc .badge{justify-self:start}
.rvc .tt{font-weight:850;font-size:14.5px;line-height:1.4;word-break:keep-all}
.rvc textarea{width:100%;min-height:38px;font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.bfr{width:100%;height:78vh;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
</style>
</head>
<body>
<header>
  <div class="hd"><span class="nm">황제의 일기 관리자</span><span class="tag">EMPEROR</span>
    <div class="r"><a class="btn sm" href="/admin"><span class="lg">밸류노트&nbsp;</span>관리자</a><button class="btn sm" id="out" hidden>로그아웃</button></div></div>
  <nav class="tabs" id="tabs" hidden></nav>
  <div class="ask" id="ask" hidden><textarea id="askt" rows="1" placeholder="요청·피드백 적고 Enter" aria-label="Claude에게 요청"></textarea><button class="btn pri" id="askb">보내기</button></div>
  <div class="asknote" id="askn" hidden>요청은 매일 08:43 성과 분석 때 읽고, 대화창에서 작업할 때 바로 처리합니다 · 상태는 검수 탭 '내 요청'</div>
</header>
<main id="main"><div class="empty">불러오는 중</div></main>

<script>
/*
  황제의 일기 / THE EMPEROR'S DIARY 관리자 (2026-11-02 대표 지시: "관리자 페이지 전부 바꿔줘 지금까지 논의한 내용에 맞게")
  - 채널: 유튜브 쇼츠(황제의 일기) · 인스타 릴스 · 틱톡 · 쓰레드 (emperors.diary)
  - 데이터: ed_posts(편성) · ed_stats(3시간마다 수집, 틱톡은 매일 20:37 크롬) · ed_reports(매일 08:43 분석) · ed_requests(요청)
  - 설정: app_config ed_paused / ed_slots / ed_length — 모두 RPC ed_admin_* 로만 읽고 쓴다 (관리자 확인)
  - 2026-11-14 대표 지시: 검수·성과·개선만 보는 화면으로 정리 — 탭 4개(검수·성과·개선·벤치마킹) + 운영 기록. 밸류노트 관리자(/admin)와 같은 순서
  - 2026-11-04 정리: 고정 편성 07:40/12:20/20:30 + 카드 18:40 + 롱폼 소개 19:30, 틱톡 상태, 롱폼(썸네일 A/B), 자동 작업표 — app_config ed_ops
*/
const C = window.HAEJA_CONFIG || {};
const sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => v == null || v === '' ? '–' : Math.round(+v).toLocaleString('ko-KR');
const kst = iso => { if (!iso) return '–'; const d = new Date(Date.parse(iso) + 9*3600e3); return `${d.getUTCMonth()+1}/${d.getUTCDate()} ${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`; };
const dayOf = iso => new Date(Date.parse(iso) + 9*3600e3).toISOString().slice(0,10);
const today = () => new Date(Date.now() + 9*3600e3).toISOString().slice(0,10);
const SITE = 'https://www.valuenote.co.kr';
const url = p => !p ? '' : /^https?:/.test(p) ? p : SITE + p;
const store = { get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(_) { return d; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(_){} } };
let toastT; function toast(t, bad){ let el = $('#toast'); if(!el){ el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = t; el.classList.toggle('bad', !!bad); el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2600); }

const PL = { youtube: '유튜브', instagram: '인스타', tiktok: '틱톡', threads: '쓰레드' };
const TABS = [['review','검수'],['perf','성과'],['improve','개선'],['bench','벤치마킹·핫토픽'],['ops','운영 기록']];
const S = { tab: TABS.some(t => t[0] === store.get('ed-tab', 'review')) ? store.get('ed-tab', 'review') : 'review', d: null, rv: null };

function loginView(msg){
  $('#tabs').hidden = true; $('#out').hidden = true; $('#ask').hidden = true; $('#askn').hidden = true;
  $('#main').innerHTML = `<div class="card login"><div style="font-weight:850;font-size:17px">관리자 로그인</div>
    <div class="note">밸류노트 관리자 계정으로 로그인하세요.</div>
    <label>이메일<input id="em" type="email" autocomplete="email"></label>
    <label>비밀번호<input id="pw" type="password" autocomplete="current-password"></label>
    <button class="btn pri" id="go">로그인</button><div class="note" id="msg">${esc(msg||'')}</div></div>`;
  $('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('#go').click(); });
  $('#go').onclick = async () => {
    $('#msg').textContent = '확인 중';
    const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
    if (error) { $('#msg').textContent = '로그인하지 못했습니다: ' + error.message; return; }
    boot();
  };
}

async function loadAll(){
  const { data, error } = await sb.rpc('ed_admin_data');
  if (error) { $('#main').innerHTML = `<div class="card empty">불러오지 못했습니다: ${esc(error.message)}</div>`; return false; }
  S.d = data;
  try { const r = await fetch('/docs/emperor/review/review.json?t=' + Date.now()); S.rv = r.ok ? await r.json() : (S.rv || { items: [] }); } catch(_) { S.rv = S.rv || { items: [] }; }
  return true;
}

/* 최신 수치: 플랫폼·게시물별 가장 최근 줄 */
function latest(){
  const m = {};
  for (const r of S.d.stats || []) { if (r.id === 'monetize') continue; const k = r.platform + '|' + r.id; if (!m[k] || (r.day + r.at) > (m[k].day + m[k].at)) m[k] = r; }
  return Object.values(m);
}
function accountOn(platform, day){
  const r = (S.d.stats || []).filter(x => x.platform === platform && x.id === 'account' && (!day || x.day <= day)).sort((a,b) => (a.day + a.at) < (b.day + b.at) ? 1 : -1)[0];
  return r ? r.m : null;
}
const viewsOf = (ep, platform) => { const r = latest().find(x => x.platform === platform && x.ep === ep); return r ? (r.m.views ?? null) : null; };

/* 검수 대기: 저장소 docs/emperor/review/review.json (Claude가 새 영상을 만들면 여기에 올린다). 승인·수정은 요청함(ed_requests)으로 간다 */
function rvItems(){ return ((S.rv || {}).items || []).filter(x => x.status !== 'done'); }
function rvState(id){ const r = (S.d.requests || []).find(q => String(q.text || '').startsWith('[검수] ' + id + ' ')); return r ? (/승인/.test(r.text) ? 'ok' : 'fix') : ''; }
function renderTabs(){
  const nRv = rvItems().filter(x => !rvState(x.id)).length;
  $('#tabs').innerHTML = TABS.map(([k, l]) => `<button data-t="${k}" class="${S.tab === k ? 'on' : ''}">${l}${k === 'review' && nRv ? `<span class="cnt">${nRv}</span>` : ''}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => { S.tab = b.dataset.t; store.set('ed-tab', S.tab); render(); window.scrollTo(0, 0); });
}
function render(){
  if (!S.d) return; $('#tabs').hidden = false; renderTabs();
  $('#main').innerHTML = S.tab === 'perf' ? viewPerf() : S.tab === 'improve' ? viewImprove() : S.tab === 'bench' ? viewBench() : S.tab === 'ops' ? viewOps() : viewReview();
  ({ review: () => { bindBrief(); bindReview(); }, perf: bindBrief, ops: () => { bindSched(); bindSet(); } })[S.tab]?.();
}
const kpi = (l, v, s) => `<div class="card kpi"><div class="l">${esc(l)}</div><div class="v">${esc(v)}</div>${s ? `<div class="s">${esc(s)}</div>` : ''}</div>`;
const delta = (a, b) => a == null || b == null ? '' : (a - b >= 0 ? '+' : '') + num(a - b);

/* ---------- 공통: 편 종류 ---------- */
/* 2026-11-04 정리: 데일리 쇼츠(ep) · 카드뉴스(carousel) · 롱폼 소개(teaser*) · 롱폼 쇼츠(ls*, 대표 지시로 내림) */
function kindOf(p){
  if (p.kind === 'carousel') return { k: 'card', l: '카드뉴스' };
  if (/^teaser/.test(p.id)) return { k: 'teaser', l: '롱폼 소개' };
  if (/^ls\d/.test(p.id)) return { k: 'ls', l: '롱폼 쇼츠' };
  return { k: 'daily', l: p.ep ? p.ep + '편' : '쇼츠' };
}
const isOff = p => p.paused && (/skip/.test(p.tt_status || '') || /skip/.test(p.ig_status || '') || Date.parse(p.scheduled_at) < Date.now());
const lenTag = p => { if (p.kind === 'carousel' || !p.duration_sec) return ''; const L = (S.d.settings.length || {}).rotate || [35,45,55];
  const t = L.reduce((x, y) => Math.abs(y - p.duration_sec) < Math.abs(x - p.duration_sec) ? y : x); return `${Math.round(p.duration_sec)}초(${t}형)`; };
function chans(p){
  const out = [];
  if (p.kind !== 'carousel') out.push(['유튜브', p.yt_video_id ? (Date.parse(p.scheduled_at) <= Date.now() ? 'posted' : 'scheduled') : '–']);
  if (p.to_ig !== false) out.push(['인스타', p.ig_status]);
  out.push(['틱톡', p.tt_status]);
  if (p.to_th) out.push(['쓰레드', p.th_status]);
  return out.map(([n, st]) => `${n} ${stBadge(st)}`).join(' ');
}

/* ---------- 수익 창출 목표 (2026-11-06 대표님: "밸류노트 관리자처럼 수익창출까지 그래프 트래킹해줘") ----------
   숫자: ed_stats youtube/monetize (ed-stats 가 3시간마다 유튜브 분석 API creatorContentType 으로 쇼츠·롱폼을 나눠 저장)
   구독자: ed_stats youtube/account 최신값 · 추이 그래프: 날마다 마지막 account 값
   새로고침 버튼: RPC ed_admin_refresh_yt → ed-stats {only:'youtube'} (LLM 없음, 10~20초). 자동 갱신은 기존 3시간 수집만. */
function monRow(){
  return (S.d.stats || []).filter(x => x.platform === 'youtube' && x.id === 'monetize').sort((a,b) => (a.day + a.at) < (b.day + b.at) ? 1 : -1)[0] || null;
}
function subsHist(){
  const m = {};
  for (const r of S.d.stats || []) if (r.platform === 'youtube' && r.id === 'account' && r.m && r.m.subscribers != null) { if (!m[r.day] || r.at > m[r.day].at) m[r.day] = r; }
  return Object.keys(m).sort().map(d => ({ d, v: +m[d].m.subscribers }));
}
function subsChart(H, W){
  if (H.length < 2) return '';
  W = Math.max(280, Math.round(W || 640)); const Ht = 150, P = { l: 34, r: 12, t: 12, b: 22 };
  const max = Math.max(...H.map(x => x.v)), min = Math.min(0, ...H.map(x => x.v)), top = Math.max(10, Math.ceil(max * 1.15 / 10) * 10);
  const x = i => P.l + i * (W - P.l - P.r) / (H.length - 1), y = v => P.t + (Ht - P.t - P.b) * (1 - (v - min) / (top - min));
  const pts = H.map((h, i) => `${x(i).toFixed(1)},${y(h.v).toFixed(1)}`).join(' ');
  const area = `${x(0).toFixed(1)},${y(min).toFixed(1)} ${pts} ${x(H.length - 1).toFixed(1)},${y(min).toFixed(1)}`;
  const step = Math.max(1, Math.ceil(H.length / Math.max(3, Math.floor(W / 70))));
  const lab = H.map((h, i) => i % step === 0 || i === H.length - 1 ? `<text x="${x(i).toFixed(1)}" y="${Ht - 6}" text-anchor="middle">${esc(+h.d.slice(5, 7))}/${esc(+h.d.slice(8))}</text>` : '').join('');
  const last = H[H.length - 1];
  return `<div class="gl-ch"><div class="gl-cht">구독자 추이 <span>최근 ${H.length}일 · 날마다 마지막 수집값</span></div>
    <svg viewBox="0 0 ${W} ${Ht}" width="${W}" height="${Ht}" role="img" aria-label="구독자 추이 그래프">
      <line x1="${P.l}" x2="${W - P.r}" y1="${y(top).toFixed(1)}" y2="${y(top).toFixed(1)}" class="gr"/><line x1="${P.l}" x2="${W - P.r}" y1="${y((top + min) / 2).toFixed(1)}" y2="${y((top + min) / 2).toFixed(1)}" class="gr"/><line x1="${P.l}" x2="${W - P.r}" y1="${y(min).toFixed(1)}" y2="${y(min).toFixed(1)}" class="gr"/>
      <text x="${P.l - 6}" y="${(y(top) + 4).toFixed(1)}" text-anchor="end">${num(top)}</text><text x="${P.l - 6}" y="${(y(min) + 4).toFixed(1)}" text-anchor="end">${num(min)}</text>
      <polygon points="${area}" class="ar"/><polyline points="${pts}" class="ln"/>
      ${H.map((h, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(h.v).toFixed(1)}" r="${i === H.length - 1 ? 4 : 2.6}" class="${i === H.length - 1 ? 'dt last' : 'dt'}"><title>${esc(h.d)} · ${num(h.v)}명</title></circle>`).join('')}
      <text x="${x(H.length - 1).toFixed(1)}" y="${(y(last.v) - 9).toFixed(1)}" text-anchor="end" class="lv">${num(last.v)}명</text>
      ${lab}
    </svg></div>`;
}
function vGoal(){
  const mr = monRow(), mon = mr ? mr.m : null, acc = accountOn('youtube');
  const after = Date.now() >= Date.parse('2027-02-01T00:00:00+09:00'), Hg = after ? 8000 : 4000, Sg = after ? 20000000 : 10000000;
  const subs = acc?.subscribers != null ? +acc.subscribers : mon?.subs != null ? +mon.subs : null;
  const hours = mon ? +mon.long_watch_h_365 || 0 : null, shorts = mon ? +mon.shorts_views_90 || 0 : null;
  const pct = (v, g) => Math.max(0, Math.min(100, (v || 0) / g * 100));
  const fmt = (v, g) => { const p = pct(v, g); return p < 1 && v ? p.toFixed(2) : String(Math.floor(p)); };
  const nv = v => v == null ? '–' : (v < 100 && v % 1 ? (+v).toFixed(1) : num(v));
  const bar = (label, v, g, unit, sub) => `<div class="gl-row"><div class="gl-h"><b>${label}</b><span>${nv(v)}${unit} / ${num(g)}${unit} · ${fmt(v, g)}%</span></div><div class="gl-bar"><i style="width:${Math.max(pct(v, g), v ? 0.8 : 0)}%"></i></div>${sub ? `<div class="gl-s">${sub}</div>` : ''}</div>`;
  const best = pct(hours, Hg) >= pct(shorts, Sg) ? 'h' : 's';
  /* 예상: 최근 7일(데이터가 7일보다 적으면 있는 만큼) 하루 평균 증가로 1,000명 도달일 */
  const H = subsHist(), w = H.slice(-8);
  const span = w.length >= 2 ? (Date.parse(w[w.length - 1].d) - Date.parse(w[0].d)) / 864e5 : 0;
  const perDay = span > 0 ? (w[w.length - 1].v - w[0].v) / span : null;
  let eta = '';
  if (subs != null && subs >= 1000) eta = '구독자 조건 달성';
  else if (perDay != null && perDay > 0 && subs != null) { const d = new Date(Date.now() + 9 * 3600e3 + Math.ceil((1000 - subs) / perDay) * 864e5); eta = `최근 ${Math.round(span)}일 하루 평균 +${perDay < 10 ? perDay.toFixed(1) : Math.round(perDay)}명 → 이 속도면 1,000명 ${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')} 예상`; }
  else if (perDay != null) eta = `최근 ${Math.round(span)}일 구독자 증가 없음`;
  const busy = S.ytBusy;
  return `<div class="card gl">
    <div class="gl-top"><div><div class="gl-k">목표</div><b>유튜브 수익 창출(광고 수익) 조건 달성</b></div>
      <div class="row" style="justify-content:flex-end"><span class="badge warn">1단계</span><button class="btn sm" id="ytref" ${busy ? 'disabled' : ''} title="유튜브 분석에서 구독자·롱폼 시청시간·쇼츠 조회를 지금 다시 읽어 옵니다 (10~20초, 자동 수집은 3시간마다)">${busy ? '읽는 중…' : '구독자·조회수 새로고침'}</button></div></div>
    ${mr ? `<div class="gl-s" style="margin:-2px 0 6px">숫자 기준: ${kst(mr.at)} (유튜브 분석)${Date.now() - Date.parse(mr.at) > 6 * 3600e3 ? ' · <b style="color:var(--bad)">' + Math.floor((Date.now() - Date.parse(mr.at)) / 3600e3) + '시간 전 숫자</b>' : ''}</div>` : `<div class="gl-s" style="margin:-2px 0 6px">시청시간·쇼츠 조회는 다음 수집(3시간마다) 또는 새로고침 뒤에 채워집니다</div>`}
    <div class="gl-rule">구독자 1,000명 <b>그리고</b> (롱폼 시청 ${num(Hg)}시간 <b>또는</b> 쇼츠 조회 ${num(Sg)}회)${after ? '' : ' · 2027-02-01부터는 8,000시간 또는 2,000만 회'}</div>
    ${bar('구독자', subs, 1000, '명', `꼭 넘어야 하는 조건${acc?.views != null ? ` · 채널 총 조회 ${num(acc.views)}회` : ''}`)}
    ${bar('롱폼 시청시간 (최근 1년)', hours, Hg, '시간', [best === 'h' ? '두 길 중 지금 더 가까운 쪽' : '', mon && mon.all_watch_h_365 != null ? `참고: 쇼츠 포함 전체 시청 ${nv(mon.all_watch_h_365)}시간(조건에는 롱폼만 셉니다)` : ''].filter(Boolean).join(' · '))}
    ${bar('쇼츠 조회 (최근 90일)', shorts, Sg, '회', [best === 's' ? '두 길 중 지금 더 가까운 쪽' : '', '유튜브 분석 값은 1~2일 늦게 반영되고, 스튜디오 수익 창출 화면의 유효 조회는 이보다 조금 적을 수 있습니다'].filter(Boolean).join(' · '))}
    ${H.length >= 2 ? '<div id="glch"></div>' : ''}
    ${eta ? `<div class="gl-foot">${esc(eta)}</div>` : ''}
  </div>`;
}
async function ytRefresh(){
  if (S.ytBusy) return; S.ytBusy = true; render();
  const before = (monRow() || {}).at || '';
  try {
    const { error } = await sb.rpc('ed_admin_refresh_yt');
    if (error) { toast('새로고침하지 못했습니다: ' + error.message, true); return; }
    for (let i = 0; i < 12; i++) {
      await new Promise(r => setTimeout(r, 3000));
      if (await loadAll() && ((monRow() || {}).at || '') > before) {
        const m = monRow().m, a = accountOn('youtube') || {};
        toast(`구독자 ${num(a.subscribers)}명 · 롱폼 시청 ${m.long_watch_h_365}시간 · 쇼츠 조회 ${num(m.shorts_views_90)}회`); return;
      }
    }
    toast('아직 수집 중입니다. 잠시 뒤 다시 열어 보세요', true);
  } finally { S.ytBusy = false; render(); }
}

/* ---------- 검수 ---------- */
function viewReview(){
  const d = today(), tmr = new Date(Date.parse(d) + 864e5).toISOString().slice(0,10);
  const posts = (S.d.posts || []).filter(p => !isOff(p));
  const dayList = day => posts.filter(p => dayOf(p.scheduled_at) === day).sort((a,b) => Date.parse(a.scheduled_at) - Date.parse(b.scheduled_at));
  const fails = posts.filter(p => /fail/.test(p.ig_status || '') || /fail/.test(p.th_status || '') || /fail/.test(p.tt_status || ''));
  const reqs = S.d.requests || [], R = rvItems();
  const line = p => { const K = kindOf(p), past = Date.parse(p.scheduled_at) <= Date.now();
    return `<div class="lp"${past ? ' style="opacity:.62"' : ''}><div class="t"><span class="badge ${K.k === 'teaser' ? 'warn' : ''}">${esc(K.l)}</span> ${kst(p.scheduled_at).split(' ')[1]} · ${esc(p.title)}</div>
      <div class="s">${lenTag(p) ? lenTag(p) + ' · ' : ''}${p.paused ? '<b>멈춤</b> · ' : ''}${chans(p)}</div></div>`; };
  const card = x => { const st = rvState(x.id);

function stBadge(s){ s = s || '–'; const c = s === 'posted' ? 'good' : /fail/.test(s) ? 'bad' : s === 'pending' ? '' : /^skip/.test(s) || s === '–' ? 'mut' : 'warn';
  const t = { posted: '게시됨', pending: '대기', scheduled: '예약됨', processing: '처리 중', publishing: '올리는 중', failed: '실패', hold: '보류', skip: '안 함' }[s] || (/^scheduled/.test(s) ? '예약 ' + s.slice(10) : /^fail/.test(s) ? '실패' : /^skip/.test(s) ? '안 함' : s);
  return `<span class="badge ${c}" title="${esc(s)}">${esc(t)}</span>`; }
function postCard(p){
  const K = kindOf(p);
  const links = [p.yt_video_id && `<a href="https://youtube.com/shorts/${esc(p.yt_video_id)}" target="_blank" rel="noopener">유튜브</a>`, p.ig_permalink && `<a href="${esc(p.ig_permalink)}" target="_blank" rel="noopener">인스타</a>`, p.th_permalink && `<a href="${esc(p.th_permalink)}" target="_blank" rel="noopener">쓰레드</a>`].filter(Boolean).join(' · ');
  const past = Date.parse(p.scheduled_at) < Date.now();
  const vs = ['youtube','instagram','tiktok','threads'].map(x => viewsOf(p.ep, x));
  const nums = K.k === 'card' || !p.ep || vs.every(v => v == null) ? '' : `<span>유튜브 <b>${num(viewsOf(p.ep,'youtube'))}</b></span><span>인스타 <b>${num(viewsOf(p.ep,'instagram'))}</b></span><span>틱톡 <b>${num(viewsOf(p.ep,'tiktok'))}</b></span><span>쓰레드 <b>${num(viewsOf(p.ep,'threads'))}</b></span>`;
  return `<div class="card item" style="margin-bottom:10px">
    <button class="th" data-v="${esc(url(p.video_path))}" data-i="${esc(K.k === 'card' ? url(p.cover_path) : '')}" data-t="${esc(p.title)}" aria-label="보기"><img src="${esc(url(p.cover_path))}" alt="" loading="lazy" onerror="this.style.display='none'">${K.k === 'card' ? '' : '<span class="pl"><i>▶</i></span>'}</button>
    <div class="meta">
      <div class="tt"><span class="badge ${K.k === 'card' ? 'gold' : K.k === 'teaser' ? 'warn' : ''}">${esc(K.l)}</span> ${esc(p.title)}</div>
      <div class="nums"><span>${kst(p.scheduled_at)}</span>${lenTag(p) ? `<span><b>${esc(lenTag(p))}</b></span>` : ''}${nums}</div>
      <div class="row" style="font-size:13px">${chans(p)}${p.paused ? ' <span class="badge warn">멈춤</span>' : ''}</div>
      ${links ? `<div class="note">${links}</div>` : ''}
      ${!past ? `<div class="row"><button class="btn sm ${p.paused ? 'pri' : 'no'}" data-pause="${esc(p.id)}" data-to="${p.paused ? 'false' : 'true'}">${p.paused ? '다시 진행' : '이 편 멈추기'}</button>
        <input type="datetime-local" data-when="${esc(p.id)}" style="width:auto;height:32px;padding:4px 8px;font-size:13px" value="${new Date(Date.parse(p.scheduled_at) + 9*3600e3).toISOString().slice(0,16)}"><button class="btn sm" data-save="${esc(p.id)}">시각 변경</button></div>
        <div class="note">멈춤·시각 변경은 인스타·쓰레드 자동 게시와 틱톡 업로드 작업에 바로 반영됩니다. 이미 예약된 유튜브 시각은 요청칸에 남겨 주세요.</div>` : ''}
      ${(p.th_text || p.ig_caption) ? `<details class="mini"><summary>글 보기 (쓰레드 · 인스타 · 틱톡)</summary>${p.th_text ? `<div class="note" style="white-space:pre-wrap;margin-top:6px">${esc(p.th_text)}</div>` : ''}<div class="note" style="white-space:pre-wrap;margin-top:6px;border-top:1px solid var(--line);padding-top:6px">${esc(p.ig_caption || '')}</div>${p.tt_text ? `<div class="note" style="white-space:pre-wrap;margin-top:6px;border-top:1px solid var(--line);padding-top:6px">${esc(p.tt_text)}</div>` : ''}</details>` : ''}
    </div></div>`;
}
function viewSched(){
  const all = (S.d.posts || []).slice(), posts = all.filter(p => !isOff(p)), off = all.filter(isOff);
  const F = S.f || 'all', pass = p => F === 'all' || kindOf(p).k === F || (F === 'daily' && kindOf(p).k === 'teaser');
  const up = posts.filter(p => Date.parse(p.scheduled_at) >= Date.now() - 3600e3 && pass(p)).sort((a,b) => Date.parse(a.scheduled_at) - Date.parse(b.scheduled_at));
  const past = posts.filter(p => Date.parse(p.scheduled_at) < Date.now() - 3600e3 && pass(p)).sort((a,b) => Date.parse(b.scheduled_at) - Date.parse(a.scheduled_at));
  const sl = S.d.settings.slots || {};
  return `<div class="seg" style="margin-top:4px">${[['all','전체'],['daily','쇼츠'],['card','카드뉴스']].map(([k, l]) => `<button data-f="${k}" class="${F === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    <h2>예약<span class="n">데일리 쇼츠 ${esc((sl.video || []).join(' / '))} · 롱폼 ${esc(sl.long || '19:30')} 월·수·금·일 · 롱폼 소개 ${esc(sl.teaser || '07:40')} 다음 날</span></h2>
    ${up.length ? up.map(postCard).join('') : '<div class="card empty">예약된 편이 없습니다.</div>'}
    <h2>올린 편</h2>${past.map(postCard).join('') || '<div class="card empty">아직 없습니다.</div>'}
    ${off.length ? `<details class="fold" style="margin-top:18px"><summary>내린 편·교체된 편 ${off.length}개</summary><div class="card">${off.map(p => `<div class="lp"><div class="t">${esc(kindOf(p).l)} · ${esc(p.title)}</div><div class="s">${kst(p.scheduled_at)}${p.yt_video_id ? ' · 유튜브 ' + esc(p.yt_video_id) + ' (비공개 · 삭제는 대표님이 직접)' : ''}</div></div>`).join('')}</div></details>` : ''}`;
}
function playVideo(src, title){
  const m = document.createElement('div'); m.className = 'vmodal';
  m.innerHTML = `<div class="box"><div class="vt">${esc(title)}</div><button class="x" aria-label="닫기">✕</button><video src="${esc(src)}" controls autoplay playsinline></video></div>`;
  m.onclick = e => { if (e.target === m || e.target.classList.contains('x')) m.remove(); };
  document.body.appendChild(m);
}
function bindSched(){
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { S.f = b.dataset.f; render(); });
  document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { if (b.dataset.i) return window.open(b.dataset.i, '_blank'); if (b.dataset.v && /\.mp4/.test(b.dataset.v)) playVideo(b.dataset.v, b.dataset.t); });
  document.querySelectorAll('[data-pause]').forEach(b => b.onclick = async () => {
    const { error } = await sb.rpc('ed_admin_post', { p_id: b.dataset.pause, patch: { paused: b.dataset.to === 'true' } });
    if (error) return toast('저장하지 못했습니다: ' + error.message, true); toast(b.dataset.to === 'true' ? '이 편을 멈췄습니다' : '다시 진행합니다'); reload(); });
  document.querySelectorAll('[data-save]').forEach(b => b.onclick = async () => {
    const v = document.querySelector(`[data-when="${b.dataset.save}"]`).value; if (!v) return;
    const iso = new Date(v + ':00+09:00').toISOString();
    const { error } = await sb.rpc('ed_admin_post', { p_id: b.dataset.save, patch: { scheduled_at: iso } });
    if (error) return toast('저장하지 못했습니다: ' + error.message, true); toast('게시 시각을 ' + kst(iso) + '로 바꿨습니다'); reload(); });
}

/* ---------- 성과 ---------- */
function viewPerf(){
  const posts = (S.d.posts || []).filter(p => p.ep && p.kind !== 'carousel' && !isOff(p)).sort((a,b) => b.ep - a.ep || Date.parse(b.scheduled_at) - Date.parse(a.scheduled_at));
  const L = latest();
  const g = (ep, p) => L.find(x => x.ep === ep && x.platform === p)?.m || {};
  const comp = (ep, dur) => { const m = g(ep, 'instagram'); return m.ig_reels_avg_watch_time && dur ? Math.round(m.ig_reels_avg_watch_time / 10 / dur) + '%' : '–'; };
  const rows = posts.map(p => { const y = g(p.ep,'youtube'), i = g(p.ep,'instagram'), t = g(p.ep,'tiktok'), h = g(p.ep,'threads');
    return `<tr><td><b>${esc(p.ep)}</b></td><td>${esc(p.title)}<div class="note">${kst(p.scheduled_at)}${p.duration_sec ? ' · ' + esc(p.duration_sec) + '초' : ''}</div></td>
      <td class="n">${num(y.views)}<div class="note">♥ ${num(y.likes)}</div></td>
      <td class="n">${num(i.views)}<div class="note">완주 ${comp(p.ep, p.duration_sec)}</div></td>
      <td class="n">${num(t.views)}<div class="note">♥ ${num(t.likes)}</div></td>
      <td class="n">${num(h.views)}<div class="note">♥ ${num(h.likes)}</div></td></tr>`; }).join('');
  // 길이별 평균 (인스타 완주율·유튜브 조회)
  const buckets = {};
  for (const p of posts) { if (!p.duration_sec) continue; const b = Math.round(p.duration_sec / 5) * 5; (buckets[b] ||= []).push(p); }
  const brow = Object.keys(buckets).sort((a,b) => a - b).map(b => { const ps = buckets[b];
    const avg = f => { const v = ps.map(f).filter(x => x != null && !isNaN(x)); return v.length ? v.reduce((s,x) => s + x, 0) / v.length : null; };
    const c = avg(p => { const m = g(p.ep,'instagram'); return m.ig_reels_avg_watch_time ? m.ig_reels_avg_watch_time / 10 / p.duration_sec : null; });
    return `<tr><td>약 ${b}초</td><td class="n">${ps.length}편</td><td class="n">${num(avg(p => g(p.ep,'youtube').views))}</td><td class="n">${c == null ? '–' : Math.round(c) + '%'}</td><td class="n">${num(avg(p => g(p.ep,'tiktok').views))}</td></tr>`; }).join('');
  const yt = accountOn('youtube'), ig = accountOn('instagram'), th = accountOn('threads'), tt = accountOn('tiktok');
  const total = p => L.filter(x => x.platform === p && x.id !== 'account').reduce((s, x) => s + (+x.m.views || 0), 0);
  return `<div class="grid kpis">
    ${kpi('유튜브 구독자', num(yt?.subscribers), '누적 조회 ' + num(total('youtube')))}
    ${kpi('인스타 팔로워', num(ig?.followers), '누적 조회 ' + num(total('instagram')))}
    ${kpi('틱톡 팔로워', num(tt?.followers), '누적 조회 ' + num(total('tiktok')))}
    ${kpi('쓰레드 팔로워', num(th?.followers), '누적 조회 ' + num(total('threads')))}
  </div>
  ${vGoal()}
  ${best3()}
  <h2>편별 최신 수치<span class="n">인스타·쓰레드·유튜브 3시간마다 · 틱톡 매일 20:37 · 완주 = 인스타 평균 시청 ÷ 길이</span></h2>
    <div class="card tbl-wrap"><table class="tbl"><thead><tr><th>편</th><th>제목</th><th>유튜브</th><th>인스타</th><th>틱톡</th><th>쓰레드</th></tr></thead><tbody>${rows || '<tr><td colspan="6" class="note">아직 수치가 없습니다</td></tr>'}</tbody></table></div>
    <h2>길이 실험<span class="n">단계마다 3편 이상 쌓이면 분석이 다음 길이를 제안합니다</span></h2>
    <div class="card tbl-wrap"><table class="tbl"><thead><tr><th>길이</th><th>편수</th><th>유튜브 평균 조회</th><th>인스타 완주율</th><th>틱톡 평균 조회</th></tr></thead><tbody>${brow || '<tr><td colspan="5" class="note">아직 없습니다</td></tr>'}</tbody></table></div>
`;
}

/* ---------- 설정 ---------- */
function viewSet(){
  const st = S.d.settings, sl = st.slots || {}, len = st.length || {}, ops = st.ops || {};
  return `<h2>게시 설정</h2><div class="card grid" style="gap:14px">
    <label class="chk"><input type="checkbox" id="auto" ${st.paused === true ? '' : 'checked'}> 자동 게시 켜기 (끄면 인스타·쓰레드 예약 글과 다음 날 제작이 멈춥니다)</label>
    <label class="note">데일리 쇼츠 게시 시각 (한국 시각, 쉼표로 구분 · 유튜브·인스타·틱톡·쓰레드 같은 시각)<input type="text" id="slots" value="${esc((sl.video || []).join(', '))}"></label>
    <div class="note">카드뉴스 중단(인스타 팔로워 1,000명 때 재개) · 롱폼 ${esc(sl.long || '19:30')} 월·수·금·일 · 롱폼 소개 쇼츠 ${esc(sl.teaser || '07:40')} 다음 날 · 쓰레드는 영상과 같은 시각</div>
    <div class="note">길이 실험: 대본 ${esc((len.rotate || [35,45,55]).join(' · '))}초 전후를 시간대마다 날마다 돌림 (±${esc(len.tolerance ?? 4)}초)</div>
    <div><button class="btn pri" id="saveset">저장</button></div></div>
  <h2>계정</h2>
  <div class="card note">${esc(ops.handles || '')}</div>`;
}
function bindSet(){
  $('#saveset').onclick = async () => {
    const video = $('#slots').value.split(',').map(s => s.trim()).filter(s => /^\d{1,2}:\d{2}$/.test(s)).map(s => s.padStart(5, '0'));
    if (!video.length) return toast('시각을 07:40 처럼 적어 주세요', true);
    const slots = { ...(S.d.settings.slots || {}), video, threads_delay_min: 0, tz: 'Asia/Seoul' };
    for (const [k, v] of [['ed_paused', !$('#auto').checked], ['ed_slots', slots]]) {
      const { error } = await sb.rpc('ed_admin_set', { k, v }); if (error) return toast('저장하지 못했습니다: ' + error.message, true);
    }
    toast('저장했습니다'); reload();
  };
}

/* ---------- 시작 ---------- */
async function reload(){ const y = window.scrollY; if (await loadAll()) { render(); window.scrollTo(0, y); } }
async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return loginView();
  const { data: admin } = await sb.rpc('is_admin');
  if (!admin) { await sb.auth.signOut(); return loginView('관리자 계정이 아닙니다.'); }
  $('#out').hidden = false; $('#ask').hidden = false; $('#askn').hidden = false;
  $('#out').onclick = async () => { await sb.auth.signOut(); location.reload(); };
  bindAsk();
  await reload();
}
function bindAsk(){
  const ta = $('#askt'), btn = $('#askb');
  const fit = () => { ta.style.height = '38px'; ta.style.height = Math.min(140, ta.scrollHeight + 2) + 'px'; ta.style.overflow = ta.scrollHeight > 138 ? 'auto' : 'hidden'; };
  const send = async () => { const t = ta.value.trim(); if (!t) { ta.focus(); return; }
    btn.disabled = true; const where = (TABS.find(x => x[0] === S.tab) || [, '검수'])[1] + ' 화면';
    const { error } = await sb.rpc('ed_admin_request', { t, w: where }); btn.disabled = false;
    if (error) return toast('보내지 못했습니다: ' + error.message, true);
    ta.value = ''; fit(); ta.blur(); toast("받았습니다. 검수 탭 '내 요청'에 상태가 뜹니다"); reload(); };
  ta.addEventListener('input', fit);
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
  btn.onclick = send;
}
const typing = () => !!document.activeElement?.matches('input,textarea') || !!$('.vmodal');
setInterval(async () => { if (document.hidden || $('#out').hidden || typing()) return; try { await reload(); } catch(_){} }, 5 * 60 * 1000);
boot();
</script>
</body>
</html>
