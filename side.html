<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>사이드 채널 관리</title>
<link rel="icon" type="image/png" href="/favicon-64.png?v=5">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2.0.5/fonts/variable/woff2/SUIT-Variable.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<!--
  사이드 채널 전용 관리자 (2026-10-27)
  - 밸류노트 관리자(admin.html)와 완전히 분리된 페이지. 로그인 계정만 같이 쓴다.
  - 데이터는 sc_trends / sc_plans / sc_videos / sc_settings 테이블에만 저장한다 (supabase/2026-10-27_side_channel.sql).
  - 채널을 접거나 옮길 때는 이 파일과 sc_ 테이블만 들어내면 된다.
-->
<style>
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --ink:#111827; --ink2:#374151; --muted:#6B7280; --line:#E5E7EB;
  --accent:#2563EB; --accent-ink:#FFFFFF; --soft:#EEF2FF;
  --good:#15803D; --good-bg:#DCFCE7; --warn:#B45309; --warn-bg:#FEF3C7; --bad:#B91C1C; --bad-bg:#FEE2E2;
  --bar:#93C5FD;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1220; --surface:#111A2B; --ink:#E5E7EB; --ink2:#CBD5E1; --muted:#94A3B8; --line:#1F2A3D;
  --accent:#60A5FA; --accent-ink:#0B1220; --soft:#16223A;
  --good:#4ADE80; --good-bg:#12301F; --warn:#FBBF24; --warn-bg:#2E2410; --bad:#F87171; --bad-bg:#3A1616; --bar:#3B5F99;
}}
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#111A2B; --ink:#E5E7EB; --ink2:#CBD5E1; --muted:#94A3B8; --line:#1F2A3D;
  --accent:#60A5FA; --accent-ink:#0B1220; --soft:#16223A;
  --good:#4ADE80; --good-bg:#12301F; --warn:#FBBF24; --warn-bg:#2E2410; --bad:#F87171; --bad-bg:#3A1616; --bar:#3B5F99;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"SUIT Variable","SUIT","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;word-break:keep-all;overflow-wrap:break-word;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.hd{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.hd .nm{font-weight:850;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd .tag{flex:none}
.hd .tag{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--accent);background:var(--soft);border-radius:999px;padding:3px 9px}
.hd .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.btn{height:36px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13.5px;font-weight:750;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ok{background:var(--good-bg);color:var(--good);border-color:transparent}
.btn.no{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
nav.tabs{max-width:1080px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;border:0;background:none;color:var(--muted);font:inherit;font-size:14.5px;font-weight:800;padding:10px 12px 11px;border-bottom:2px solid transparent;cursor:pointer}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .cnt{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;text-align:center;margin-left:5px;padding:0 5px}
main{max-width:1080px;margin:0 auto;padding:16px 16px 60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(4,1fr)}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:700}
.kpi .v{font-size:24px;font-weight:900;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
h2{font-size:16px;margin:22px 0 10px;font-weight:850}
.note{font-size:13px;color:var(--muted);line-height:1.6}
.empty{padding:36px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}
.badge{display:inline-block;font-size:11.5px;font-weight:800;border-radius:999px;padding:2px 8px;background:var(--soft);color:var(--accent);white-space:nowrap}
.badge.good{background:var(--good-bg);color:var(--good)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.mut{background:var(--line);color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:800;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .kw{font-weight:800}
.tbl .sub{font-size:12px;color:var(--muted);margin-top:3px}
.mo{display:none!important}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.bars{display:grid;gap:8px}
.bar-row{display:grid;grid-template-columns:90px 1fr 44px;gap:8px;align-items:center;font-size:13px}
.bar-row .track{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.bar-row .fill{height:100%;background:var(--bar);border-radius:6px}
.bar-row .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2);font-weight:700}
.plan{display:grid;gap:8px}
.plan .t{font-size:16px;font-weight:850;line-height:1.4}
.plan .ko{font-size:13.5px;color:var(--ink2)}
.plan ol{margin:4px 0 0;padding-left:20px;font-size:13.5px;line-height:1.65;color:var(--ink2)}
.plan .act{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
textarea,input[type=text],input[type=datetime-local],input[type=email],input[type=password]{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
textarea{min-height:64px;resize:vertical}
.vid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
.vid.short{grid-template-columns:220px minmax(0,1fr)}
.vid video{width:100%;border-radius:10px;background:#000;display:block}
.vid .meta{display:grid;gap:8px;align-content:start}
.langs{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer;background:var(--surface)}
.chk input{margin:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.login{max-width:380px;margin:40px auto;display:grid;gap:10px}
.login label{display:grid;gap:5px;font-size:13px;color:var(--muted);font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;transition:.2s;z-index:50;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.bad{background:var(--bad);color:#fff}
@media (max-width:760px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .vid,.vid.short{grid-template-columns:1fr}
  .vid.short video{max-width:240px}
  .hd .nm{font-size:15.5px}
  .hd .r .lg{display:none}
  .tbl.hide-m .m{display:none}
  .mo{display:flex!important}
}
</style>
</head>
<body>
<header>
  <div class="hd"><span class="nm" id="chname">사이드 채널</span><span class="tag">SIDE</span>
    <div class="r" style="flex:none"><a class="btn" href="/admin" style="text-decoration:none;display:inline-flex;align-items:center"><span class="lg">밸류노트&nbsp;</span>관리자</a><button class="btn" id="out" hidden>로그아웃</button></div></div>
  <nav class="tabs" id="tabs" hidden></nav>
</header>
<main id="main"><div class="empty">불러오는 중</div></main>

<script>
const C = window.HAEJA_CONFIG || {};
const sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n0 = v => (v == null || v === '') ? '–' : (+v).toLocaleString('ko-KR');
const short = v => { v = +v || 0; if (v >= 1e8) return (v/1e8).toFixed(1).replace(/\.0$/,'') + '억'; if (v >= 1e4) return (v/1e4).toFixed(1).replace(/\.0$/,'') + '만'; return v.toLocaleString('ko-KR'); };
const kst = iso => { if (!iso) return '–'; const d = new Date(Date.parse(iso) + 9*3600e3); return d.toISOString().slice(2,16).replace('T',' '); };
const toLocalInput = iso => { if (!iso) return ''; const d = new Date(Date.parse(iso) + 9*3600e3); return d.toISOString().slice(0,16); };
const fromLocalInput = v => v ? new Date(v + ':00+09:00').toISOString() : null;
let toastT; function toast(t, bad){ let el = $('#toast'); if(!el){ el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = t; el.classList.toggle('bad', !!bad); el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2600); }

const LINES = { sports:'스포츠', kpop:'K-팝', drama:'드라마', news:'한국 이슈', life:'한국 생활' };
const LANGS = { es:'스페인어', pt:'포르투갈어', id:'인도네시아어', hi:'힌디어', ja:'일본어', fr:'프랑스어', de:'독일어', vi:'베트남어', th:'태국어', ar:'아랍어', tr:'튀르키예어', it:'이탈리아어', pl:'폴란드어', 'zh-TW':'중국어(번체)', ru:'러시아어', ko:'한국어', nl:'네덜란드어', fil:'필리핀어' };
const S = { tab: 'trend', trends: [], plans: [], videos: [], settings: {}, err: '' };
try { const t = localStorage.getItem('sc-tab'); if (t) S.tab = t; } catch(_){}

/* ---------- 로그인 ---------- */
function loginView(msg){
  $('#tabs').hidden = true; $('#out').hidden = true;
  $('#main').innerHTML = `<div class="card login"><div style="font-weight:850;font-size:17px">관리자 로그인</div>
    <div class="note">밸류노트 관리자 계정으로 로그인하세요.</div>
    <label>이메일<input id="em" type="email" autocomplete="email"></label>
    <label>비밀번호<input id="pw" type="password" autocomplete="current-password"></label>
    <button class="btn pri" id="go">로그인</button><div class="note" id="msg">${esc(msg||'')}</div></div>`;
  $('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('#go').click(); });
  $('#go').onclick = async () => {
    $('#msg').textContent = '확인 중';
    const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
    if (error) { $('#msg').textContent = '로그인하지 못했습니다: ' + error.message; return; }
    boot();
  };
}

/* ---------- 데이터 ---------- */
async function loadAll(){
  const [t, p, v, s] = await Promise.all([
    sb.from('sc_trends').select('*').order('collected_at', { ascending: false }).limit(300),
    sb.from('sc_plans').select('*').order('created_at', { ascending: false }).limit(200),
    sb.from('sc_videos').select('*').order('created_at', { ascending: false }).limit(200),
    sb.from('sc_settings').select('value').eq('id', 1).maybeSingle()
  ]);
  const err = [t, p, v, s].find(r => r.error);
  S.err = err ? err.error.message : '';
  S.trends = t.data || []; S.plans = p.data || []; S.videos = v.data || []; S.settings = (s.data && s.data.value) || {};
  if (S.settings.channel_name) $('#chname').textContent = S.settings.channel_name;
}

/* ---------- 탭 ---------- */
const TABS = [
  ['trend', '트렌드', () => S.trends.filter(x => x.status === 'new').length],
  ['plan', '기획안', () => S.plans.filter(x => x.status === 'pending').length],
  ['review', '검수', () => S.videos.filter(x => x.status === 'review').length],
  ['perf', '성과', () => 0],
  ['set', '설정', () => 0]
];
function renderTabs(){
  $('#tabs').hidden = false;
  $('#tabs').innerHTML = TABS.map(([k, name, cnt]) => { const c = cnt(); return `<button data-k="${k}" class="${S.tab === k ? 'on' : ''}">${name}${c ? `<span class="cnt">${c}</span>` : ''}</button>`; }).join('');
  $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => { S.tab = b.dataset.k; try { localStorage.setItem('sc-tab', S.tab); } catch(_){} render(); });
}
function render(){
  renderTabs();
  if (S.err) {
    const missing = /sc_|relation|does not exist|schema cache/i.test(S.err);
    $('#main').innerHTML = `<div class="card empty">${missing ? '사이드 채널 테이블이 아직 없습니다.<br>Supabase SQL Editor에서 <b>supabase/2026-10-27_side_channel.sql</b> 을 실행하면 바로 열립니다.' : '불러오지 못했습니다: ' + esc(S.err)}</div>`;
    return;
  }
  ({ trend: viewTrend, plan: viewPlan, review: viewReview, perf: viewPerf, set: viewSet })[S.tab]();
}

/* ---------- 트렌드 ---------- */
function viewTrend(){
  const fresh = S.trends.filter(x => x.status === 'new');
  const week = Date.now() - 7*864e5;
  const recent = S.trends.filter(x => Date.parse(x.collected_at) > week);
  const ratios = fresh.map(x => +x.ratio).filter(Boolean).sort((a,b) => a - b);
  const medRatio = ratios.length ? ratios[Math.floor(ratios.length / 2)] : null;
  const byLine = {}; recent.forEach(x => { byLine[x.line] = (byLine[x.line] || 0) + 1; });
  const maxLine = Math.max(1, ...Object.values(byLine));
  const kw = {}; recent.forEach(x => String(x.keyword || '').split(/[\s,·]+/).filter(w => w.length > 2).forEach(w => { const k = w.toLowerCase(); kw[k] = (kw[k] || 0) + 1; }));
  const topKw = Object.entries(kw).sort((a,b) => b[1] - a[1]).slice(0, 8);
  const maxKw = Math.max(1, ...topKw.map(x => x[1]));
  const ranked = fresh.slice().sort((a,b) => (+b.score || 0) - (+a.score || 0) || (+b.ratio || 0) - (+a.ratio || 0));
  const auto = S.settings.auto_pick !== false;

  $('#main').innerHTML = `
    <div class="grid kpis">
      ${kpi('새 후보', fresh.length, '아직 기획 전')}
      ${kpi('후보 배수 중앙값', medRatio ? medRatio + '배' : '–', '채널 평균 대비 조회수')}
      ${kpi('최근 7일 수집', recent.length, '건')}
      ${kpi('진행 방식', auto ? '자동' : '직접 선택', auto ? '점수 1위를 매일 기획안으로' : '설정에서 바꿀 수 있음')}
    </div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-top:12px">
      <div class="card"><div style="font-weight:850;margin-bottom:10px">소재 줄기별 후보 (최근 7일)</div>
        ${Object.keys(byLine).length ? `<div class="bars">${Object.entries(byLine).sort((a,b)=>b[1]-a[1]).map(([k,v]) => `<div class="bar-row"><span>${esc(LINES[k] || k)}</span><div class="track"><div class="fill" style="width:${v/maxLine*100}%"></div></div><span class="n">${v}</span></div>`).join('')}</div>` : '<div class="note">아직 수집된 후보가 없습니다.</div>'}
      </div>
      <div class="card"><div style="font-weight:850;margin-bottom:10px">많이 뜬 키워드 (최근 7일)</div>
        ${topKw.length ? `<div class="bars">${topKw.map(([k,v]) => `<div class="bar-row"><span>${esc(k)}</span><div class="track"><div class="fill" style="width:${v/maxKw*100}%"></div></div><span class="n">${v}</span></div>`).join('')}</div>` : '<div class="note">아직 수집된 후보가 없습니다.</div>'}
      </div>
    </div>
    <h2>추천 소재 순위</h2>
    <div class="note" style="margin:-4px 0 10px">배수 = 근거 영상 조회수 ÷ 그 채널 평균 조회수. 5배 이상만 올라옵니다. 반응 포인트는 근거 영상 상위 댓글에서 뽑았습니다.</div>
    ${ranked.length ? `<div class="card tbl-wrap" style="padding:4px 8px"><table class="tbl hide-m"><thead><tr><th>#</th><th>소재</th><th class="m">줄기</th><th style="text-align:right">배수</th><th style="text-align:right" class="m">조회수</th><th style="text-align:right" class="m">구독자</th><th class="m">유효</th><th style="text-align:right">점수</th><th></th></tr></thead><tbody>
      ${ranked.map((x, i) => `<tr>
        <td class="n">${i + 1}</td>
        <td><div class="kw">${esc(x.keyword)}</div>
          ${x.ref_url ? `<div class="sub"><a href="${esc(x.ref_url)}" target="_blank" rel="noopener">${esc(x.ref_title || '근거 영상')}</a> · ${esc(x.ref_channel || '')}</div>` : ''}
          ${(x.reactions || []).length ? `<div class="sub">반응: ${(x.reactions || []).slice(0,3).map(esc).join(' / ')}</div>` : ''}
          <div class="mo row" style="margin-top:8px"><button class="btn sm pri" data-pick="${x.id}">기획안</button><button class="btn sm" data-skip="${x.id}">제외</button></div></td>
        <td class="m"><span class="badge">${esc(LINES[x.line] || x.line)}</span></td>
        <td class="n"><b>${x.ratio ? x.ratio + '배' : '–'}</b></td>
        <td class="n m">${short(x.ref_views)}</td>
        <td class="n m">${short(x.ref_subs)}</td>
        <td class="m" style="white-space:nowrap">${x.fresh_until ? esc(x.fresh_until.slice(5)) + '까지' : '–'}</td>
        <td class="n">${x.score != null ? (+x.score).toFixed(0) : '–'}</td>
        <td class="m" style="white-space:nowrap"><button class="btn sm pri" data-pick="${x.id}">기획안</button> <button class="btn sm" data-skip="${x.id}">제외</button></td>
      </tr>`).join('')}</tbody></table></div>` : '<div class="card empty">아직 후보가 없습니다. 매일 아침 수집되면 여기 순위로 올라옵니다.</div>'}`;

  document.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => pickTrend(+b.dataset.pick, b));
  document.querySelectorAll('[data-skip]').forEach(b => b.onclick = async () => {
    b.disabled = true; const { error } = await sb.from('sc_trends').update({ status: 'skipped' }).eq('id', +b.dataset.skip);
    if (error) { toast('제외하지 못했습니다', true); b.disabled = false; return; } await reload(); toast('제외했습니다');
  });
}
async function pickTrend(id, btn){
  const t = S.trends.find(x => x.id === id); if (!t) return;
  const note = prompt('이 소재로 기획안을 요청합니다. 원하는 방향이 있으면 적어 주세요(비워 두어도 됩니다).', '');
  if (note === null) return;
  btn.disabled = true;
  const { error } = await sb.from('sc_plans').insert({ trend_id: t.id, line: t.line, title: t.keyword, title_ko: '기획안 작성 대기 — ' + t.keyword, status: 'pending', note: note || null,
    signal: { ratio: t.ratio, views: t.ref_views, subs: t.ref_subs, ref_url: t.ref_url, reactions: t.reactions || [] }, outline: [] });
  if (error) { toast('요청하지 못했습니다: ' + error.message, true); btn.disabled = false; return; }
  await sb.from('sc_trends').update({ status: 'picked' }).eq('id', id);
  await reload(); toast('기획안 요청을 남겼습니다. 다음 제작 때 작성됩니다');
}
function kpi(l, v, s){ return `<div class="card kpi"><div class="l">${esc(l)}</div><div class="v">${esc(v)}</div>${s ? `<div class="s">${esc(s)}</div>` : ''}</div>`; }

/* ---------- 기획안 ---------- */
function viewPlan(){
  const order = { pending: 0, approved: 1, made: 2, rejected: 3 };
  const list = S.plans.slice().sort((a,b) => (order[a.status] - order[b.status]) || (Date.parse(b.created_at) - Date.parse(a.created_at)));
  const stBadge = s => ({ pending: '<span class="badge warn">승인 대기</span>', approved: '<span class="badge good">승인됨</span>', made: '<span class="badge">제작됨</span>', rejected: '<span class="badge mut">반려</span>' })[s] || '';
  $('#main').innerHTML = list.length ? `<div class="grid">${list.map(p => {
    const sig = p.signal || {}; const ready = (p.outline || []).length > 0;
    return `<div class="card plan" data-id="${esc(p.id)}">
      <div class="row">${stBadge(p.status)}<span class="badge">${esc(LINES[p.line] || p.line)}</span>${sig.ratio ? `<span class="badge mut">근거 ${esc(sig.ratio)}배 · ${short(sig.views)}회</span>` : ''}<span class="note" style="margin-left:auto">${kst(p.created_at)}</span></div>
      <div class="t">${esc(p.title)}</div>
      ${p.title_ko ? `<div class="ko">${esc(p.title_ko)}</div>` : ''}
      ${p.hook ? `<div class="note"><b>첫 10초</b> ${esc(p.hook)}</div>` : ''}
      ${ready ? `<ol>${p.outline.map(o => `<li>${esc(typeof o === 'string' ? o : (o.text || o.title || JSON.stringify(o)))}</li>`).join('')}</ol>` : '<div class="note">구성 작성 전입니다.</div>'}
      ${sig.ref_url ? `<div class="note">근거: <a href="${esc(sig.ref_url)}" target="_blank" rel="noopener">${esc(sig.ref_url)}</a></div>` : ''}
      <textarea data-note placeholder="의견을 남기면 다음 수정 때 반영됩니다">${esc(p.note || '')}</textarea>
      <div class="act">
        <label class="note" style="display:flex;align-items:center;gap:6px">게시 시각 <input type="datetime-local" data-at value="${toLocalInput(p.publish_at)}" style="width:auto"></label>
        <span style="flex:1"></span>
        <button class="btn sm" data-save>의견 저장</button>
        ${p.status !== 'approved' && p.status !== 'made' ? `<button class="btn sm ok" data-ok ${ready ? '' : 'disabled title="구성이 작성된 뒤 승인할 수 있습니다"'}>승인</button>` : ''}
        ${p.status === 'pending' ? `<button class="btn sm no" data-no>반려</button>` : ''}
      </div></div>`; }).join('')}</div>` : '<div class="card empty">기획안이 없습니다. 트렌드 탭에서 소재를 고르거나, 자동 진행이 켜져 있으면 매일 올라옵니다.</div>';

  document.querySelectorAll('.plan').forEach(card => {
    const id = card.dataset.id;
    const patch = async (obj, msg) => { const { error } = await sb.from('sc_plans').update(obj).eq('id', id); if (error) { toast('저장하지 못했습니다: ' + error.message, true); return; } await reload(); toast(msg); };
    const note = () => card.querySelector('[data-note]').value.trim() || null;
    const at = () => fromLocalInput(card.querySelector('[data-at]').value);
    card.querySelector('[data-save]').onclick = () => patch({ note: note(), publish_at: at() }, '저장했습니다');
    const ok = card.querySelector('[data-ok]'); if (ok) ok.onclick = () => patch({ status: 'approved', note: note(), publish_at: at() }, '승인했습니다. 제작에 들어갑니다');
    const no = card.querySelector('[data-no]'); if (no) no.onclick = () => patch({ status: 'rejected', note: note() }, '반려했습니다');
  });
}

/* ---------- 검수 ---------- */
function viewReview(){
  const longs = S.videos.filter(v => v.kind === 'long' && v.status !== 'rejected');
  const shortsOf = id => S.videos.filter(v => v.kind === 'short' && v.parent_id === id && v.status !== 'rejected');
  const orphanShorts = S.videos.filter(v => v.kind === 'short' && !v.parent_id && v.status !== 'rejected');
  const order = { review: 0, approved: 1, uploaded: 2 };
  const list = longs.concat(orphanShorts).sort((a,b) => (order[a.status] - order[b.status]) || (Date.parse(a.scheduled_at || a.created_at) - Date.parse(b.scheduled_at || b.created_at)));
  const langCount = S.settings.langs ? S.settings.langs.length : 0;
  $('#main').innerHTML = `<div class="note" style="margin-bottom:10px">롱폼을 승인하면 그 롱폼에서 자른 쇼츠도 함께 승인됩니다. 유튜브 API 심사 전까지는 내려받아 스튜디오에 직접 올리고 '올림'을 눌러 주세요.</div>` +
    (list.length ? `<div class="grid">${list.map(v => item(v, shortsOf(v.id), langCount)).join('')}</div>` : '<div class="card empty">검수할 영상이 없습니다.</div>');
  document.querySelectorAll('[data-vid]').forEach(card => {
    const id = card.dataset.vid, v = S.videos.find(x => x.id === id);
    const kids = shortsOf(id).map(x => x.id);
    const upd = async (obj, ids, msg) => { const { error } = await sb.from('sc_videos').update(obj).in('id', ids); if (error) { toast('저장하지 못했습니다: ' + error.message, true); return; } await reload(); toast(msg); };
    const note = () => (card.querySelector('[data-note]') || {}).value?.trim() || null;
    const ok = card.querySelector('[data-ok]'); if (ok) ok.onclick = () => upd({ status: 'approved', reviewed_at: new Date().toISOString(), note: note() }, [id].concat(kids), kids.length ? `승인했습니다 (쇼츠 ${kids.length}편 포함)` : '승인했습니다');
    const no = card.querySelector('[data-no]'); if (no) no.onclick = () => { if (!confirm('이 영상을 반려할까요?')) return; upd({ status: 'rejected', note: note() }, [id], '반려했습니다'); };
    const up = card.querySelector('[data-up]'); if (up) up.onclick = () => {
      const raw = prompt('올린 유튜브 영상 주소나 ID를 붙여 넣어 주세요', v.youtube_id || ''); if (raw === null) return;
      const m = String(raw).match(/(?:v=|youtu\.be\/|shorts\/)([\w-]{11})/); const yid = m ? m[1] : String(raw).trim();
      upd({ status: 'uploaded', youtube_id: yid || null, uploaded_at: new Date().toISOString() }, [id], '올림으로 표시했습니다');
    };
    const sv = card.querySelector('[data-save]'); if (sv) sv.onclick = () => upd({ note: note() }, [id], '의견을 저장했습니다');
  });
}
function item(v, kids, langCount){
  const st = ({ review: '<span class="badge warn">검수 대기</span>', approved: '<span class="badge good">승인됨 · 업로드 대기</span>', uploaded: '<span class="badge">올림</span>' })[v.status] || '';
  const locN = Object.keys(v.loc || {}).length;
  return `<div class="card" data-vid="${esc(v.id)}"><div class="vid${v.kind === 'short' ? ' short' : ''}">
    <div>${v.video_url ? `<video src="${esc(v.video_url)}" ${v.thumb ? `poster="${esc(v.thumb)}"` : ''} controls preload="none" playsinline></video>` : '<div class="empty">영상 파일 없음</div>'}</div>
    <div class="meta">
      <div class="row">${st}<span class="badge mut">${v.kind === 'long' ? '롱폼' : '쇼츠'}${v.duration ? ' · ' + Math.round(v.duration / 60) + '분' : ''}</span><span class="badge mut">다국어 ${locN}/${langCount}</span></div>
      <div style="font-weight:850;font-size:15.5px;line-height:1.4">${esc(v.title)}</div>
      <div class="note">게시 예정 ${kst(v.scheduled_at)}</div>
      ${v.description ? `<details><summary class="note" style="cursor:pointer">설명 보기</summary><div class="note" style="white-space:pre-wrap;margin-top:6px">${esc(v.description)}</div></details>` : ''}
      ${locN ? `<details><summary class="note" style="cursor:pointer">언어별 제목 보기</summary><div class="note" style="margin-top:6px">${Object.entries(v.loc).map(([k, o]) => `<div><b>${esc(LANGS[k] || k)}</b> ${esc(o && o.title || '')}</div>`).join('')}</div></details>` : ''}
      ${kids.length ? `<div class="note">이 롱폼에서 자른 쇼츠 ${kids.length}편: ${kids.map(k => esc(k.title)).join(' / ')}</div>` : ''}
      ${v.status === 'review' ? `<textarea data-note placeholder="고칠 점을 남기면 다시 렌더합니다">${esc(v.note || '')}</textarea>` : ''}
      <div class="row">
        ${v.video_url ? `<a class="btn sm" href="${esc(v.video_url)}" download style="text-decoration:none;display:inline-flex;align-items:center">내려받기</a>` : ''}
        ${v.thumb ? `<a class="btn sm" href="${esc(v.thumb)}" download style="text-decoration:none;display:inline-flex;align-items:center">썸네일</a>` : ''}
        ${v.status === 'review' ? `<button class="btn sm" data-save>의견 저장</button><button class="btn sm ok" data-ok>승인</button><button class="btn sm no" data-no>반려</button>` : ''}
        ${v.status === 'approved' ? `<button class="btn sm pri" data-up>올림</button>` : ''}
        ${v.status === 'uploaded' && v.youtube_id ? `<a class="btn sm" href="https://youtu.be/${esc(v.youtube_id)}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center">유튜브에서 보기</a>` : ''}
      </div>
    </div></div></div>`;
}

/* ---------- 성과 (48시간 점검) ---------- */
function viewPerf(){
  const up = S.videos.filter(v => v.status === 'uploaded').sort((a,b) => Date.parse(b.uploaded_at || 0) - Date.parse(a.uploaded_at || 0));
  const longs = up.filter(v => v.kind === 'long');
  const ctrs = longs.slice(0, 10).map(v => +(v.stats?.h48?.ctr)).filter(x => x > 0).sort((a,b) => a - b);
  const med = ctrs.length ? ctrs[Math.floor(ctrs.length / 2)] : null;
  const tot = up.reduce((a, v) => a + (+(v.stats?.d7?.views ?? v.stats?.h48?.views ?? 0)), 0);
  const best = up.slice().sort((a,b) => (+(b.stats?.d7?.views ?? b.stats?.h48?.views ?? 0)) - (+(a.stats?.d7?.views ?? a.stats?.h48?.views ?? 0)))[0];
  const flag = v => { const c = +(v.stats?.h48?.ctr); if (!med || !c || v.kind !== 'long') return ''; return c < med * 0.7 ? '<span class="badge bad">썸네일 교체</span>' : c >= med ? '<span class="badge good">좋음</span>' : '<span class="badge mut">보통</span>'; };
  const cell = (v, k, f) => { const x = v.stats?.[k]?.[f]; if (x == null) return '–'; return f === 'ctr' ? (+x).toFixed(1) + '%' : f === 'avg_sec' ? Math.floor(x / 60) + ':' + String(Math.round(x % 60)).padStart(2, '0') : short(x); };
  $('#main').innerHTML = `
    <div class="grid kpis">
      ${kpi('올린 영상', up.length, `롱폼 ${longs.length} · 쇼츠 ${up.length - longs.length}`)}
      ${kpi('누적 조회수', short(tot), '7일 또는 48시간 기준')}
      ${kpi('롱폼 클릭률 중앙값', med ? med.toFixed(1) + '%' : '–', '최근 10편 48시간')}
      ${kpi('최고 영상', best ? short(best.stats?.d7?.views ?? best.stats?.h48?.views ?? 0) : '–', best ? best.title.slice(0, 22) : '')}
    </div>
    <h2>영상별 48시간 점검</h2>
    <div class="note" style="margin:-4px 0 10px">썸네일 A/B 테스트 중인 영상은 결과가 나올 때까지 그대로 둡니다. 클릭률이 채널 중앙값의 70% 미만이면 교체 표시가 붙습니다.</div>
    ${up.length ? `<div class="card tbl-wrap" style="padding:4px 8px"><table class="tbl hide-m"><thead><tr><th>영상</th><th style="text-align:right">24시간</th><th style="text-align:right">48시간</th><th style="text-align:right">클릭률</th><th style="text-align:right" class="m">평균 시청</th><th style="text-align:right" class="m">7일</th><th>판단</th></tr></thead><tbody>
      ${up.map(v => `<tr><td><div class="kw">${esc(v.title)}</div><div class="sub">${v.kind === 'long' ? '롱폼' : '쇼츠'} · ${kst(v.uploaded_at)}${v.youtube_id ? ` · <a href="https://youtu.be/${esc(v.youtube_id)}" target="_blank" rel="noopener">보기</a>` : ''}</div></td>
        <td class="n">${cell(v,'h24','views')}</td><td class="n">${cell(v,'h48','views')}</td><td class="n">${cell(v,'h48','ctr')}</td><td class="n m">${cell(v,'h48','avg_sec')}</td><td class="n m">${cell(v,'d7','views')}</td><td>${flag(v)}</td></tr>`).join('')}
    </tbody></table></div>` : '<div class="card empty">아직 올린 영상이 없습니다.</div>'}`;
}

/* ---------- 설정 ---------- */
function viewSet(){
  const s = S.settings; const on = new Set(s.langs || []);
  $('#main').innerHTML = `<div class="card" style="display:grid;gap:14px">
    <label class="note" style="display:grid;gap:5px;font-weight:700">채널 이름<input type="text" id="s-name" value="${esc(s.channel_name || '')}" placeholder="예: Korean Netizens React"></label>
    <label class="note" style="display:grid;gap:5px;font-weight:700">핸들<input type="text" id="s-handle" value="${esc(s.handle || '')}" placeholder="@..."></label>
    <div><div class="note" style="font-weight:700;margin-bottom:6px">진행 방식</div>
      <label class="chk"><input type="checkbox" id="s-auto" ${s.auto_pick !== false ? 'checked' : ''}> 트렌드 점수 1위를 매일 자동으로 기획안으로 올리기</label></div>
    <div><div class="note" style="font-weight:700;margin-bottom:6px">번역할 언어 (제목·설명·자막) — 기본 영어 외 ${on.size}개</div>
      <div class="langs">${Object.entries(LANGS).filter(([k]) => k !== 'ko').map(([k, n]) => `<label class="chk"><input type="checkbox" value="${k}" ${on.has(k) ? 'checked' : ''}> ${n}</label>`).join('')}</div>
      <div class="note" style="margin-top:6px">음성은 유튜브 자동 더빙이 붙습니다. 위 언어는 제목·설명·자막을 따로 번역해 넣어 검색에 걸리게 합니다.</div></div>
    <label class="chk" style="width:max-content"><input type="checkbox" id="s-dub" ${s.auto_dub !== false ? 'checked' : ''}> 유튜브 자동 더빙 사용</label>
    <div><button class="btn pri" id="s-save">저장</button></div></div>`;
  $('#s-save').onclick = async () => {
    const langs = [...document.querySelectorAll('.langs input:checked')].map(i => i.value);
    const value = Object.assign({}, S.settings, { channel_name: $('#s-name').value.trim(), handle: $('#s-handle').value.trim(), auto_pick: $('#s-auto').checked, auto_dub: $('#s-dub').checked, langs });
    const { error } = await sb.from('sc_settings').upsert({ id: 1, value });
    if (error) { toast('저장하지 못했습니다: ' + error.message, true); return; }
    await reload(); toast('저장했습니다');
  };
}

/* ---------- 시작 ---------- */
async function reload(){ await loadAll(); render(); }
async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return loginView();
  const { data: admin } = await sb.rpc('is_admin');
  if (!admin) { await sb.auth.signOut(); return loginView('관리자 계정이 아닙니다.'); }
  $('#out').hidden = false;
  $('#out').onclick = async () => { await sb.auth.signOut(); loginView(); };
  await reload();
}
boot();
</script>
</body>
</html>
