# 유튜브 준비: 네이버·타입캐스트 키 점검과 성우 샘플 만들기 (keytest.py 를 바꾸면 실행)
name: yt-keytest
on:
  push:
    branches: [main]
    paths: ['scripts/youtube/keytest.py', 'scripts/reels/tts.py']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04  # 2026-10-29 고정: 26 전환 후 브라우저 설치 실패
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q numpy scipy
      - name: 키 점검·샘플 생성
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TYPECAST_API_KEY: ${{ secrets.TYPECAST_API_KEY }}
        run: python3 scripts/youtube/keytest.py
      - name: 샘플을 릴리스에도 올리기
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view voice-samples >/dev/null 2>&1 || gh release create voice-samples --title "성우 샘플" --notes "비교용" --prerelease
          ls scripts/youtube/samples/*.mp3 scripts/youtube/samples/report.json | xargs gh release upload voice-samples --clobber
      - name: 커밋
        run: |
          git config user.name "valuenote-bot"; git config user.email "bot@valuenote.co.kr"
          git add scripts/youtube/samples
          git diff --cached --quiet || git commit -m "유튜브: 키 점검 결과와 성우 샘플"
          git status --short | head -20
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && exit 0; git rebase --abort 2>/dev/null; sleep 5; done; exit 1
