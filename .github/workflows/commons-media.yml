# 위키미디어 공용에서 재사용 허락된 실제 사진 받기 (commons_wants.json 을 바꾸면 실행)
name: commons-media
on:
  push:
    branches: [main]
    paths: ['scripts/blog/media/commons_wants.json', 'scripts/blog/media/commons.py']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-24.04  # 2026-10-29 고정: 26 전환 후 브라우저 설치 실패
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # 2026-11-22: 저장소 전체(약 11GB)를 받지 않고 이 작업에 필요한 폴더만 받는다. 빠진 폴더가 필요해지면 아래 줄을 지운다.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/
            !/social/side/
            !/social/music/
      - run: |
          pip install -q imageio-ffmpeg
          sudo ln -sf "$(python3 -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg
      - run: python3 scripts/blog/media/commons.py
      - name: 커밋
        run: |
          git config user.name "valuenote-bot"; git config user.email "bot@valuenote.co.kr"
          git add scripts/blog/media/lib
          git diff --cached --quiet || git commit -m "위키미디어 공용 사진 받기"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
