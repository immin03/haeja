# 블로그용 무료 실사 사진·영상 받기 (scripts/blog/media/wants.json 을 바꾸면 실행)
name: blog-media
on:
  push:
    branches: [main]
    paths: ['scripts/blog/media/wants.json', 'scripts/blog/media/fetch.py']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-24.04  # 2026-10-29 고정: 26 전환 후 브라우저 설치 실패
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python3 scripts/blog/media/fetch.py
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      - name: 커밋
        run: |
          git config user.name "valuenote-bot"; git config user.email "bot@valuenote.co.kr"
          git add scripts/blog/media/lib
          git diff --cached --quiet || git commit -m "블로그 소스: 무료 사진·영상 받기"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
