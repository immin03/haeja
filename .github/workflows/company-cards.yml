# 매일 저녁: 미리 써 둔 릴스 대본(위기 교과서·비교·은퇴 배당) 배치 후 릴스 렌더 실행 → social/company 커밋 (Vercel 배포 → Supabase가 매시 25·28분에 가져가 21:00 게시)
name: company-cards
on:
  schedule:
    - cron: '20 10 * * *'   # 매일 19:20 KST
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency: company-cards
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 브라우저 준비
        run: |
          npm i --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: 릴스 대본 만들기 (카드뉴스 없이 모든 콘텐츠를 릴스로)
        run: |
          # 2026-10-20 운영자 결정: 틀로 찍어 내는 릴스(오늘의 기업·순위 TOP 10·빈 칸 채우기·이번 주 경제 레이더)는 만들지 않는다.
          # 기승전결이 서는 대본만 올린다. 빈 칸은 비워 둔다. 남은 자동 편성은 미리 써 둔 대본과 결과가 극적인 비교뿐.
          T=$(TZ=Asia/Seoul date -d tomorrow +%F); W=$(TZ=Asia/Seoul date -d tomorrow +%u)   # 1=월 … 7=일
          # 08:30 화·목·토: 위기 교과서(미리 쓴 대본). 대본이 떨어지면 그 칸은 비운다
          if [ "$W" = 2 ] || [ "$W" = 4 ] || [ "$W" = 6 ]; then node scripts/reels/lib_pick.mjs macro $T 08:30 || true; fi
          # 수 18:00 비교 대본(창고에 있을 때만), 토 18:00 은퇴 배당 비교(결과가 밋밋하면 건너뜀)
          if [ "$W" = 3 ]; then node scripts/reels/lib_pick.mjs compare $T 18:00 || true; fi
          if [ "$W" = 6 ]; then node scripts/reels/div_race.mjs pick $T 18:00 || true; fi
      - name: 커밋
        run: |
          git config user.name "valuenote-bot"
          git config user.email "bot@valuenote.co.kr"
          git add social/company scripts/reels/specs scripts/reels/macro scripts/reels/compare scripts/reels/divrace social/reels/low_*.txt 2>/dev/null || git add social/company scripts/reels/specs scripts/reels/macro scripts/reels/compare scripts/reels/divrace
          git diff --cached --quiet && exit 0
          git commit -m "오늘의 기업 카드 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase origin main
          git push
      - name: 릴스 렌더 시작 (bot 커밋은 다른 워크플로를 깨우지 않으므로 직접 실행)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run reels.yml --ref main
