# 매일 저녁 카드뉴스 3편 생성 (오늘 21:00 기업, 내일 11:00 저평가 기업, 내일 15:30 순위) → social/company 커밋 (Vercel 배포 → Supabase가 매시 25·28분에 가져가 21:00 게시)
name: company-cards
on:
  schedule:
    - cron: '20 10 * * *'   # 매일 19:20 KST
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: company-cards
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 브라우저 준비
        run: |
          npm i --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: 카드 만들기
        run: |
          node scripts/company_cards.mjs                      # 오늘 21:00 오늘의 기업
          T=$(TZ=Asia/Seoul date -d tomorrow +%F)
          node scripts/company_cards.mjs $T b                 # 내일 11:00 저평가 기업 분석
          node scripts/company_cards.mjs $T rank              # 내일 15:30 저평가·고평가 TOP 10
      - name: 커밋
        run: |
          git config user.name "valuenote-bot"
          git config user.email "bot@valuenote.co.kr"
          git add social/company
          git diff --cached --quiet && exit 0
          git commit -m "오늘의 기업 카드 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase origin main
          git push
