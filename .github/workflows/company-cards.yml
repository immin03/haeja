# 매일 저녁: 자동 릴스 대본(오늘 21:00, 내일 08:30·11:00·15:30, 빈 12:30·18:00) 생성 후 릴스 렌더 실행 → social/company 커밋 (Vercel 배포 → Supabase가 매시 25·28분에 가져가 21:00 게시)
name: company-cards
on:
  schedule:
    - cron: '20 10 * * *'   # 매일 19:20 KST
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency: company-cards
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 브라우저 준비
        run: |
          npm i --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: 릴스 대본 만들기 (카드뉴스 없이 모든 콘텐츠를 릴스로)
        run: |
          node scripts/company_cards.mjs $(TZ=Asia/Seoul date +%F) ra   # 오늘 21:00 오늘의 기업 (이미 있으면 건너뜀)
          T=$(TZ=Asia/Seoul date -d tomorrow +%F); W=$(TZ=Asia/Seoul date -d tomorrow +%u)   # 1=월 … 7=일
          # 08:30 — 월: 이번 주 경제 레이더, 화·목·토: 위기 교과서(미리 쓴 대본), 그 밖의 날(또는 대본이 떨어지면): 기업
          if [ "$W" = 1 ]; then node scripts/reels/radar_reel.mjs $T || true; fi
          if [ "$W" = 2 ] || [ "$W" = 4 ] || [ "$W" = 6 ]; then node scripts/reels/lib_pick.mjs macro $T 08:30; fi
          node scripts/company_cards.mjs $T rm                # 08:30 칸이 비어 있으면 기업
          # 하루 4편 (2026-10-19): 08:30 매크로·기업 / 12:30 기능 소개(월·수·금·일)·순위 TOP 10(화·목·토) / 18:00 쉬운 팁·상식(수: 비교 대본 우선) / 21:00 기업
          if [ "$W" = 2 ] || [ "$W" = 4 ] || [ "$W" = 6 ]; then node scripts/company_cards.mjs $T rr; fi   # 12:30 순위 (그 칸에 미리 쓴 릴스가 있으면 건너뜀)
          if [ "$W" = 3 ]; then node scripts/reels/lib_pick.mjs compare $T 18:00; fi
          # 토 18:00 은퇴 배당 비교 (2026-10-20): 실제 주가·배당으로 계산, 결과가 밋밋한 묶음은 건너뜀. 실패해도 그 칸은 아래 순위로 채워짐
          if [ "$W" = 6 ]; then node scripts/reels/div_race.mjs pick $T 18:00 || true; fi
          node scripts/company_cards.mjs $T reel1             # 12:30이 비어 있으면 기업
          node scripts/company_cards.mjs $T reel2             # 18:00이 비어 있으면 순위
      - name: 커밋
        run: |
          git config user.name "valuenote-bot"
          git config user.email "bot@valuenote.co.kr"
          git add social/company scripts/reels/specs scripts/reels/macro scripts/reels/compare scripts/reels/divrace social/reels/low_*.txt 2>/dev/null || git add social/company scripts/reels/specs scripts/reels/macro scripts/reels/compare scripts/reels/divrace
          git diff --cached --quiet && exit 0
          git commit -m "오늘의 기업 카드 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase origin main
          git push
      - name: 릴스 렌더 시작 (bot 커밋은 다른 워크플로를 깨우지 않으므로 직접 실행)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run reels.yml --ref main
