# 매일 저녁: 자동 릴스 대본(오늘 21:00, 내일 08:30·11:00·15:30, 빈 12:30·18:00) 생성 후 릴스 렌더 실행 → social/company 커밋 (Vercel 배포 → Supabase가 매시 25·28분에 가져가 21:00 게시)
name: company-cards
on:
  schedule:
    - cron: '20 10 * * *'   # 매일 19:20 KST
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency: company-cards
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 브라우저 준비
        run: |
          npm i --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: 릴스 대본 만들기 (카드뉴스는 쓰지 않는다: 모든 콘텐츠를 릴스로)
        run: |
          node scripts/company_cards.mjs $(TZ=Asia/Seoul date +%F) ra   # 오늘 21:00 오늘의 기업 (이미 있으면 건너뜀)
          T=$(TZ=Asia/Seoul date -d tomorrow +%F)
          node scripts/company_cards.mjs $T rm                # 내일 08:30 좋은 회사, 고평가
          node scripts/company_cards.mjs $T rb                # 내일 11:00 저평가 기업
          node scripts/company_cards.mjs $T rr                # 내일 15:30 저평가·고평가 TOP 5
          node scripts/company_cards.mjs $T reel1             # 내일 12:30 릴스가 비어 있으면 기업 릴스
          node scripts/company_cards.mjs $T reel2             # 내일 18:00 릴스가 비어 있으면 순위 릴스
      - name: 커밋
        run: |
          git config user.name "valuenote-bot"
          git config user.email "bot@valuenote.co.kr"
          git add social/company scripts/reels/specs
          git diff --cached --quiet && exit 0
          git commit -m "오늘의 기업 카드 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase origin main
          git push
      - name: 릴스 렌더 시작 (bot 커밋은 다른 워크플로를 깨우지 않으므로 직접 실행)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run reels.yml --ref main
