# 매일 저녁: 오늘 21:00 기업 릴스·내일 11:00 저평가 기업 릴스 대본, 내일 15:30 순위 카드뉴스 생성 후 릴스 렌더 실행 → social/company 커밋 (Vercel 배포 → Supabase가 매시 25·28분에 가져가 21:00 게시)
name: company-cards
on:
  schedule:
    - cron: '20 10 * * *'   # 매일 19:20 KST
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency: company-cards
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 브라우저 준비
        run: |
          npm i --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: 카드 만들기
        run: |
          node scripts/company_cards.mjs $(TZ=Asia/Seoul date +%F) ra   # 오늘 21:00 오늘의 기업 릴스 대본
          T=$(TZ=Asia/Seoul date -d tomorrow +%F)
          node scripts/company_cards.mjs $T rb                # 내일 11:00 저평가 기업 릴스 대본
          node scripts/company_cards.mjs $T rank              # 내일 15:30 저평가·고평가 TOP 10
          node scripts/company_cards.mjs $T reel1             # 내일 12:30 릴스가 비어 있으면 기업 릴스 대본
          node scripts/company_cards.mjs $T reel2             # 내일 18:00 릴스가 비어 있으면 순위 릴스 대본
          if [[ "$T" > "2026-11-14" ]]; then node scripts/company_cards.mjs $T am; fi   # 기능 카드가 끝난 뒤 08:30 채우기
      - name: 커밋
        run: |
          git config user.name "valuenote-bot"
          git config user.email "bot@valuenote.co.kr"
          git add social/company scripts/reels/specs
          git diff --cached --quiet && exit 0
          git commit -m "오늘의 기업 카드 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase origin main
          git push
      - name: 릴스 렌더 시작 (bot 커밋은 다른 워크플로를 깨우지 않으므로 직접 실행)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run reels.yml --ref main
