# What Korea Says (사이드 채널) 롱폼 렌더 → /side 검수 대기열
# - scripts/side/specs/*.json 원고를 푸시하면 그 원고만 렌더
# - 수동 실행: ids 에 아이디 (비우면 아직 안 만든 원고 전부)
name: side-long
on:
  push:
    branches: [main]
    paths: ['scripts/side/specs/*.json', 'scripts/side/render.py']
  workflow_dispatch:
    inputs:
      ids: { description: '다시 만들 원고 아이디 (띄어쓰기로 구분, 비우면 새 원고 전부)', required: false, default: '' }
permissions:
  contents: write
concurrency: side-long
jobs:
  build:
    runs-on: ubuntu-24.04  # 2026-10-29 고정: 26 전환 후 브라우저 설치 실패
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 도구 설치
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-noto-cjk-extra
          pip install -q numpy scipy pillow
      - name: 음성 캐시
        uses: actions/cache@v4
        with:
          path: scripts/reels/.cache
          key: side-tts-${{ github.run_id }}
          restore-keys: |
            side-tts-
            yt-tts-
      - name: 대상 고르기
        id: pick
        run: |
          ids="${{ github.event.inputs.ids }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            ids=$(git diff --name-only HEAD~1 HEAD -- 'scripts/side/specs/*.json' | xargs -r -n1 basename | sed 's/\.json$//' | tr '\n' ' ')
          fi
          echo "ids=$ids" >> $GITHUB_OUTPUT
      - name: 렌더
        env:
          TYPECAST_API_KEY: ${{ secrets.TYPECAST_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/side/render.py ${{ steps.pick.outputs.ids }}
      - name: 커밋
        run: |
          git config user.name "valuenote-bot"; git config user.email "bot@valuenote.co.kr"
          git add -A social/side social/typecast_usage.json 2>/dev/null || git add -A social/side
          git diff --cached --quiet && exit 0
          git commit -m "사이드 채널 롱폼 $(TZ=Asia/Seoul date '+%F %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && exit 0; git rebase --abort 2>/dev/null; sleep 5; done; exit 1
