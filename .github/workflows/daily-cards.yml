# 매일 아침 이슈 카드뉴스 생성 → social/daily 에 커밋 (Vercel 배포 → Supabase가 게시 대기열로 가져감)
name: daily-cards
on:
  # 2026-11-11 중지: 매일 이슈 카드는 제1 원칙 103(카드뉴스는 v2 한 장 총정리형만, 주 3편 월·수·금 08:30, 장중 시황·속보 금지)과 맞지 않음. 필요하면 수동 실행만.
  # schedule:
  #   - cron: '40 22 * * *'   # 매일 07:40 KST
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: daily-cards
jobs:
  build:
    runs-on: ubuntu-24.04  # 2026-10-29 고정: 26 전환 후 브라우저 설치 실패
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 브라우저 준비
        run: |
          npm i --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: 카드 만들기
        run: node scripts/daily_cards.js
      - name: 커밋
        run: |
          git config user.name "valuenote-bot"
          git config user.email "bot@valuenote.co.kr"
          git add social/daily
          git diff --cached --quiet && exit 0
          git commit -m "일일 이슈 카드 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase origin main
          git push
