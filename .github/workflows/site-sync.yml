name: site-sync
# 사이트 파일(페이지·api·글꼴 등)만 site 브랜치로 복사한다. Vercel 은 site 브랜치만 배포한다.
# main 에는 영상·음성·작업 파일이 함께 있어 Vercel 이 커밋마다 저장소 전체를 받아 비용이 났다(2026-11-22).
# social·docs·media 는 vercel.json rewrite 가 GitHub(main)에서 바로 내준다.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'scripts/**'
      - 'supabase/**'
      - '.github/**'
      - 'naver/**'
      - 'social/**'
      - 'media/**'
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:
  # 워크플로가 올린 커밋은 push 로 다른 워크플로를 깨우지 못한다. 사이트 페이지를 만드는 작업이 끝나면, 그리고 30분마다 한 번 더 맞춘다(바뀐 게 없으면 아무것도 올리지 않는다).
  workflow_run:
    workflows: [company-pages]
    types: [completed]
  schedule:
    - cron: '7,37 * * * *'
concurrency:
  group: site-sync
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/scripts/
            !/supabase/
            !/.github/
            !/naver/
            !/social/
            !/media/
            !/docs/
      - name: push site branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SRC=$(git rev-parse --short HEAD)
          MSG=$(git log -1 --pretty=%s | cut -c1-80)
          mkdir -p /tmp/site
          rsync -a --exclude '.git' --exclude '.github' ./ /tmp/site/
          cd /tmp/site
          du -sh . | cat
          git init -q -b site
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin site 2>/dev/null; then git reset -q --soft FETCH_HEAD; fi
          git add -A
          if git diff --cached --quiet; then echo "no site change"; exit 0; fi
          git -c user.name="site-sync" -c user.email="actions@users.noreply.github.com" commit -q -m "site: ${MSG} (${SRC})"
          git push -q origin HEAD:site
