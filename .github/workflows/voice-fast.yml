# 급한 성우 한 줄 재녹음 (side-gen 대기열을 기다리지 않음). 입력 req = voices_req.json 과 같은 형식의 JSON
name: voice-fast
on:
  workflow_dispatch:
    inputs:
      req: { description: 'voices_req 형식 JSON', required: true }
permissions:
  contents: write
concurrency: voice-fast
jobs:
  rec:
    runs-on: ubuntu-24.04
    timeout-minutes: 45  # 11/13: 47줄 녹음이 15분을 넘겨 커밋 단계에서 잘려 녹음이 전부 사라짐
    env:
      TYPECAST_API_KEY: ${{ secrets.TYPECAST_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      REQ: ${{ github.event.inputs.req }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: printf '%s' "$REQ" > scripts/side/voices_req.json && python3 scripts/side/voices.py
      - name: 커밋 (넉넉히 재시도)
        run: |
          git config user.name "valuenote-bot"; git config user.email "bot@valuenote.co.kr"
          git checkout -- scripts/side/voices_req.json
          git add social/side/voice_samples; git diff --cached --quiet && exit 0
          git commit -qm "급한 재녹음 $(TZ=Asia/Seoul date '+%F %H:%M') [skip ci]"
          for i in 1 2 3 4 5 6 7 8; do timeout 300 git pull --rebase -X theirs -q && timeout 300 git push -q && exit 0; git rebase --abort 2>/dev/null; sleep $((i*10)); done; exit 1
      - name: 커밋 실패·시간 초과 대비 — 새 녹음만 모으기
        if: failure() || cancelled()
        run: mkdir -p /tmp/rescue && git ls-files -o -m social/side/voice_samples | xargs -r -I{} cp --parents {} /tmp/rescue/ || true
      - name: 새 녹음을 실행 결과물로 7일 보관
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with: { name: voice-rescue, path: /tmp/rescue, retention-days: 7, if-no-files-found: ignore }
