# 급한 성우 한 줄 재녹음 (side-gen 대기열을 기다리지 않음). 입력 req = voices_req.json 과 같은 형식의 JSON
name: voice-fast
on:
  workflow_dispatch:
    inputs:
      req: { description: 'voices_req 형식 JSON', required: true }
      force: { description: '캐시 무시하고 전부 새로 녹음 (일부러 다시 받을 때만)', type: boolean, default: false }
permissions:
  contents: write
concurrency: voice-fast
jobs:
  rec:
    runs-on: ubuntu-24.04
    timeout-minutes: 45  # 11/13: 47줄 녹음이 15분을 넘겨 커밋 단계에서 잘려 녹음이 전부 사라짐
    env:
      TYPECAST_API_KEY: ${{ secrets.TYPECAST_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      REQ: ${{ github.event.inputs.req }}
      FORCE: ${{ github.event.inputs.force == 'true' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      # 11/13 같은 녹음은 다시 사지 않기: 저장소 tts_cache(커밋분) + actions/cache(커밋 실패·취소분) 둘 다 쓴다
      - name: 녹음 캐시 되살리기
        uses: actions/cache/restore@v4
        with:
          path: social/side/tts_cache
          key: tts-ed-${{ github.run_id }}
          restore-keys: tts-ed-
      - name: 녹음
        run: mkdir -p social/side/tts_cache && printf '%s' "$REQ" > scripts/side/voices_req.json && python3 scripts/side/voices.py
      - name: 녹음 캐시 저장 (커밋 전에 — 커밋 실패·취소돼도 다음 실행이 재사용)
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: social/side/tts_cache
          key: tts-ed-${{ github.run_id }}
      - name: 커밋 (넉넉히 재시도 — rebase 대신 새로 받아 덮어쓰기, 11/13 rebase 가 45분 넘게 걸려 녹음 유실)
        run: |
          git config user.name "valuenote-bot"; git config user.email "bot@valuenote.co.kr"
          git checkout -- scripts/side/voices_req.json
          mkdir -p /tmp/new && git ls-files -o -m social/side/voice_samples social/side/tts_cache | xargs -r -I{} cp --parents {} /tmp/new/
          [ -z "$(ls -A /tmp/new)" ] && exit 0
          for i in 1 2 3 4 5 6 7 8; do
            timeout 240 git fetch -q --depth 1 origin main && git reset -q --hard origin/main && cp -r /tmp/new/. . \
              && git add social/side/voice_samples social/side/tts_cache && git commit -qm "급한 재녹음 $(TZ=Asia/Seoul date '+%F %H:%M') [skip ci]" \
              && timeout 240 git push -q origin HEAD:main && exit 0
            sleep $((i*10))
          done
          exit 1
      - name: 커밋 실패·시간 초과 대비 — 새 녹음만 모으기
        if: failure() || cancelled()
        run: mkdir -p /tmp/rescue && { cp -r /tmp/new/. /tmp/rescue/ 2>/dev/null; git ls-files -o -m social/side/voice_samples social/side/tts_cache | xargs -r -I{} cp --parents {} /tmp/rescue/; } || true
      - name: 새 녹음을 실행 결과물로 7일 보관
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with: { name: voice-rescue, path: /tmp/rescue, retention-days: 7, if-no-files-found: ignore }
