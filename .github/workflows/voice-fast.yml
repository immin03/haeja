# 급한 성우 한 줄 재녹음 (side-gen 대기열을 기다리지 않음). 입력 req = voices_req.json 과 같은 형식의 JSON
name: voice-fast
on:
  workflow_dispatch:
    inputs:
      req: { description: 'voices_req 형식 JSON', required: true }
permissions:
  contents: write
concurrency: voice-fast
jobs:
  rec:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TYPECAST_API_KEY: ${{ secrets.TYPECAST_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      REQ: ${{ github.event.inputs.req }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: printf '%s' "$REQ" > scripts/side/voices_req.json && python3 scripts/side/voices.py
      - run: |
          git config user.name "valuenote-bot"; git config user.email "bot@valuenote.co.kr"
          git checkout -- scripts/side/voices_req.json
          git add social/side/voice_samples; git diff --cached --quiet && exit 0
          git commit -qm "급한 재녹음 $(TZ=Asia/Seoul date '+%F %H:%M') [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push -q && exit 0; sleep 5; done; exit 1
