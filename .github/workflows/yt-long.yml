# 유튜브 롱폼 자동 렌더 → 관리자 검수 대기열
# - 매일 07:20 KST: 오늘·내일 아침까지 게시할 롱폼을 그날의 최신 숫자로 렌더
# - 매시 50분: 관리자 화면에서 '숫자 오래됨'으로 표시된 롱폼을 다시 렌더
# - 원고(specs)를 바꿔 푸시해도 바로 렌더 (해당 원고만)
name: yt-long
on:
  schedule:
    - cron: '20 22 * * *'
    - cron: '50 * * * *'
  push:
    branches: [main]
    paths: ['scripts/youtube/long/specs/*.json', 'scripts/youtube/long/render.py', 'scripts/youtube/long/render2.py']
  workflow_dispatch:
    inputs:
      ids: { description: '다시 만들 롱폼 아이디 (띄어쓰기로 구분)', required: false, default: '' }
permissions:
  contents: write
concurrency: yt-long
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: 도구 설치
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          pip install -q numpy scipy pillow soundfile sherpa-onnx==1.13.8
          npm i --no-save playwright@1.47.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1 || true
      - name: 음성 캐시 (같은 문장은 타입캐스트에 다시 요청하지 않는다)
        uses: actions/cache@v4
        with:
          path: scripts/reels/.cache
          key: yt-tts-${{ github.run_id }}
          restore-keys: yt-tts-
      - name: 대상 고르기
        id: pick
        run: |
          ids="${{ github.event.inputs.ids }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            ids=$(git diff --name-only HEAD~1 HEAD -- 'scripts/youtube/long/specs/*.json' | grep -v '.data.json' | xargs -r -n1 basename | sed 's/\.json$//' | tr '\n' ' ')
            # 렌더러가 바뀌면 아직 안 올린 롱폼 전부를 다시 만든다 (게시 예정 30시간 안쪽)
            if git diff --name-only HEAD~1 HEAD | grep -qE 'scripts/youtube/long/render2?.py'; then ids="--all-upcoming"; fi
          fi
          echo "ids=$ids" >> $GITHUB_OUTPUT
      - name: 렌더
        env:
          TYPECAST_API_KEY: ${{ secrets.TYPECAST_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/youtube/long/build.py ${{ steps.pick.outputs.ids }}
      - name: 커밋
        run: |
          git config user.name "valuenote-bot"; git config user.email "bot@valuenote.co.kr"
          git add -A social/youtube scripts/youtube/long/specs social/typecast_usage.json 2>/dev/null || git add -A social/youtube scripts/youtube/long/specs
          git diff --cached --quiet && exit 0
          git commit -m "유튜브 롱폼 $(TZ=Asia/Seoul date '+%F %H:%M')"
          # 다른 렌더가 먼저 커밋했으면 이번 결과(더 최신)를 우선해서 합친다. 끝내 못 올리면 실패로 표시
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && exit 0; git rebase --abort 2>/dev/null; sleep 5; done; exit 1
