# 유튜브 롱폼 자동 렌더 → 관리자 검수 대기열
# - 매일 07:20 KST: 오늘·내일 아침까지 게시할 롱폼을 그날의 최신 숫자로 렌더
# - 매시 50분: 관리자 화면에서 '숫자 오래됨'으로 표시된 롱폼을 다시 렌더
# - 원고(specs)를 바꿔 푸시해도 바로 렌더 (해당 원고만)
name: yt-long
on:
  schedule:
    - cron: '20 22 * * *'
    - cron: '50 * * * *'
  push:
    branches: [main]
    paths: ['scripts/youtube/long/specs/*.json', 'scripts/youtube/long/render.py', 'scripts/youtube/long/render2.py']
  workflow_dispatch:
    inputs:
      ids: { description: '다시 만들 롱폼 아이디 (띄어쓰기로 구분)', required: false, default: '' }
      en_only: { description: '1 이면 영상은 그대로 두고 영어 음성 트랙만 다시 만든다', required: false, default: '' }
      draft: { description: '1 이면 검수용 빠른 시안(12fps·960x540·저용량)', required: false, default: '' }
permissions:
  contents: write
concurrency: yt-long
jobs:
  build:
    runs-on: ubuntu-24.04  # 2026-10-29 고정: 26 전환 후 브라우저 설치 실패
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      # 2026-11-19: 도구 설치가 자주 시간 초과 → apt 패키지·pip·playwright 브라우저를 캐시한다 (캐시가 있으면 1~2분)
      - name: apt 캐시 (ffmpeg·한글 글꼴)
        id: aptc
        continue-on-error: true
        timeout-minutes: 15
        uses: awalsh128/cache-apt-pkgs-action@v1.5.0
        with: { packages: ffmpeg fonts-noto-cjk, version: '1' }
      - name: pip 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-ytlong-v1-${{ runner.os }}-py312
      - name: playwright 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            node_modules
          key: pw-ytlong-1.47.2-${{ runner.os }}
      - name: 도구 설치
        timeout-minutes: 20   # 2026-11-12: 이 단계가 75분 넘게 멈춘 일이 있어 상한·재시도를 둔다
        run: |
          if ! ffmpeg -version >/dev/null 2>&1 || ! fc-list | grep -qi "noto sans cjk"; then   # 2026-11-20: 캐시로 ffmpeg 파일만 있고 실행이 안 되는(127) 경우가 있어 실제 실행으로 확인
            for i in 1 2 3; do timeout 300 sudo apt-get update -qq -o Acquire::Retries=3 && timeout 400 sudo apt-get install -y -qq -o Acquire::Retries=3 ffmpeg fonts-noto-cjk && break; echo "apt 재시도 $i"; sleep 10; done
          fi
          timeout 400 pip install -q numpy scipy pillow soundfile opencv-python-headless sherpa-onnx==1.13.8
          if [ ! -d node_modules/playwright ] || [ ! -d ~/.cache/ms-playwright ]; then
            (timeout 300 npm i --no-save playwright@1.47.2 >/dev/null 2>&1 && timeout 400 npx playwright install --with-deps chromium >/dev/null 2>&1) || true
          else
            timeout 300 npx playwright install-deps chromium >/dev/null 2>&1 || true
          fi
      - name: 음성 캐시 (같은 문장은 타입캐스트에 다시 요청하지 않는다)
        uses: actions/cache/restore@v4
        with:
          path: scripts/reels/.cache
          key: tts-all-${{ github.run_id }}   # 2026-11-12 롱폼·쇼츠·빠른 렌더·사이드가 같은 음성 보관함을 쓴다 (같은 문장은 다시 사지 않는다)
          restore-keys: |
            tts-all-
            yt-tts-

      - name: 대상 고르기
        id: pick
        run: |
          ids="${{ github.event.inputs.ids }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            ids=$(git diff --name-only HEAD~1 HEAD -- 'scripts/youtube/long/specs/*.json' | grep -v '.data.json' | xargs -r -n1 basename | sed 's/\.json$//' | tr '\n' ' ')
            # 렌더러가 바뀌면 아직 안 올린 롱폼 전부를 다시 만든다 (게시 예정 30시간 안쪽)
            if git diff --name-only HEAD~1 HEAD | grep -qE 'scripts/youtube/long/render2?.py'; then ids="--all-upcoming"; fi
          fi
          echo "ids=$ids" >> $GITHUB_OUTPUT
      - name: 렌더
        env:
          TYPECAST_API_KEY: ${{ secrets.TYPECAST_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ github.event.inputs.draft }}
        run: |
          if [ "${{ github.event.inputs.en_only }}" = "1" ]; then
            python3 scripts/youtube/long/en_audio.py ${{ steps.pick.outputs.ids }}
          else
            python3 scripts/youtube/long/build.py ${{ steps.pick.outputs.ids }}
          fi
      - name: 음성 캐시 저장 (실패해도 저장)
        if: always()   # 2026-11-21 대표: 렌더가 뒤에서 실패해도 이미 산 음성은 남긴다 → 고쳐서 다시 돌리면 음성은 다시 안 산다
        uses: actions/cache/save@v4
        with:
          path: scripts/reels/.cache
          key: tts-all-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 커밋
        # 2026-10-29: 다른 렌더와 동시에 끝나면 리베이스가 깨져(exit 128) 실패 메일이 왔다. 바뀐 파일만 최신 main 위에 다시 얹는다.
        run: bash scripts/ci/push_results.sh "유튜브 롱폼 $(TZ=Asia/Seoul date '+%F %H:%M')" social/youtube scripts/youtube/long/specs social/typecast_usage.json
