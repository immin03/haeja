# 생성·녹음 결과 되살리기 (2026-11-13): voice-fast·side-gen 이 커밋에 실패하면 새 파일을 실행 결과물(voice-rescue / gen-rescue)로 남긴다.
# 이 워크플로가 그 결과물을 받아 저장소에 커밋한다. 입력: run_id(실패한 실행 번호), name(결과물 이름)
name: rescue-commit
on:
  workflow_dispatch:
    inputs:
      run_id: { description: '결과물을 남긴 실행 번호', required: true }
      name: { description: '결과물 이름 (voice-rescue / gen-rescue)', required: false, default: 'voice-rescue' }
permissions:
  contents: write
  actions: read
concurrency: rescue-commit
jobs:
  rescue:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 결과물 받기
        run: mkdir -p /tmp/new && gh run download ${{ github.event.inputs.run_id }} -R ${{ github.repository }} -n ${{ github.event.inputs.name }} -D /tmp/new && find /tmp/new -type f | head -50 && find /tmp/new -type f | wc -l
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, sparse-checkout: '.github', sparse-checkout-cone-mode: false }
      - name: 커밋 (새로 받아 덮어쓰기, 8회)
        run: |
          git config user.name "valuenote-bot"; git config user.email "bot@valuenote.co.kr"
          for d in $(cd /tmp/new && find . -type f -printf '%h\n' | sort -u); do git sparse-checkout add "/${d#./}"; done
          for i in 1 2 3 4 5 6 7 8; do
            timeout 240 git fetch -q --depth 1 origin main && git reset -q --hard origin/main && cp -r /tmp/new/. . \
              && git add --sparse -A . && git commit -qm "되살린 결과물 (${{ github.event.inputs.name }}, 실행 ${{ github.event.inputs.run_id }}) [skip ci]" \
              && timeout 240 git push -q origin HEAD:main && exit 0
            sleep $((i*10))
          done
          exit 1
