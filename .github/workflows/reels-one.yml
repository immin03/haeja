# 급한 릴스·쇼츠만 바로 렌더 (2026-10-26): render-one 브랜치에 푸시하면 scripts/reels/render_one.txt 의 id 들을
# 동시에(한 편씩 따로 서버에서) 실제 음성으로 렌더하고, 각 대본과 결과(social/reels/<id>)만 main 에 커밋한다.
# 정기 렌더(reels) 대기열을 기다리지 않는다. GITHUB_TOKEN 커밋이라 reels 워크플로를 다시 깨우지 않는다.
name: reels-one
on:
  push:
    branches: [render-one]
permissions:
  contents: write
concurrency: reels-one
jobs:
  ids:
    runs-on: ubuntu-24.04  # 2026-10-29 고정: 26 전환 후 브라우저 설치 실패
    outputs:
      list: ${{ steps.l.outputs.list }}
    steps:
      - uses: actions/checkout@v4   # 2026-11-21: 목록 파일 하나만 받는다 (예전엔 저장소 전체를 받느라 이 단계만 9분)
        with: { fetch-depth: 1, sparse-checkout: scripts/reels/render_one.txt, sparse-checkout-cone-mode: false }
      - id: l
        run: echo "list=$(python3 -c "import json;print(json.dumps(open('scripts/reels/render_one.txt').read().split()))")" >> $GITHUB_OUTPUT
  one:
    needs: ids
    runs-on: ubuntu-24.04  # 2026-10-29 고정: 26 전환 후 브라우저 설치 실패
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJson(needs.ids.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
        # 2026-11-21 대표 "효율 극대화": 렌더에 필요한 scripts/ 만 받는다 (예전엔 social/·naver/ 영상까지 다 받느라 체크아웃만 5~9분)
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /social/typecast_usage.json
      # 2026-11-06: 전체 이력(13.9GB)을 매번 받지 않는다. 아래 커밋 단계는 origin/main 만 다시 받으므로 얕은 클론으로 충분
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 도구 설치
        timeout-minutes: 12
        run: |
          # apt 가 자주 멈춰서(2026-10-26) ffmpeg 는 pip 의 정적 빌드를 쓴다
          pip install -q sherpa-onnx==1.13.8 soundfile scipy numpy pillow opencv-python-headless imageio-ffmpeg
          sudo ln -sf "$(python3 -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg
          ffmpeg -version | head -1
      - name: 음성 캐시 불러오기
        uses: actions/cache/restore@v4
        with:
          path: scripts/reels/.cache
          key: tts-all-${{ github.run_id }}   # 롱폼·쇼츠·빠른 렌더·사이드가 같은 음성 보관함을 쓴다 (같은 문장은 다시 사지 않는다)
          restore-keys: |
            tts-all-
            tts-supertonic-3-int8-2026-05-11-asr-zipformer-ko

      - name: 렌더
        env:
          TYPECAST_API_KEY: ${{ secrets.TYPECAST_API_KEY }}
        run: python3 scripts/reels/build.py ${{ matrix.id }}
      - name: 음성 캐시 저장 (실패해도 저장)
        if: always()   # 2026-11-21 대표: 렌더가 뒤에서 실패해도 이미 산 음성은 남긴다 → 고쳐서 다시 돌리면 음성은 다시 안 산다
        uses: actions/cache/save@v4
        with:
          path: scripts/reels/.cache
          key: tts-all-${{ github.run_id }}-${{ matrix.id }}
      - name: main 에 결과만 커밋
        env:
          TYPECAST_API_KEY: ${{ secrets.TYPECAST_API_KEY }}
        run: |
          git config user.name "valuenote-bot"; git config user.email "bot@valuenote.co.kr"
          id=${{ matrix.id }}; mkdir -p /tmp/keep
          # 2026-11-22: 영상은 Storage 로 올리고 저장소에는 표시(reel.stored)만 남긴다. 올리기에 실패하면 예전처럼 영상을 커밋한다.
          rm -f /tmp/stored.txt; MEDIA_STORE_OUT=/tmp/stored.txt python3 scripts/ci/media_store.py put social/reels/$id/reel.mp4 || true
          if grep -q "social/reels/$id/reel.mp4" /tmp/stored.txt 2>/dev/null; then stat -c %s social/reels/$id/reel.mp4 > social/reels/$id/reel.stored; rm -f social/reels/$id/reel.mp4; fi
          cp scripts/reels/specs/$id.json /tmp/keep/$id.json; cp -r social/reels/$id /tmp/keep/$id
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q origin main && git checkout -q -f -B main origin/main
            cp /tmp/keep/$id.json scripts/reels/specs/$id.json
            rm -rf social/reels/$id && cp -r /tmp/keep/$id social/reels/$id
            git add --sparse scripts/reels/specs/$id.json social/reels/$id
            [ -f social/reels/$id/reel.stored ] && git rm -q --sparse --cached --ignore-unmatch social/reels/$id/reel.mp4 || true   # 예전에 커밋된 영상이 남아 있으면 지운다(사이트가 옛 영상을 내주지 않게)
            git diff --cached --quiet && exit 0
            git commit -q -m "릴스 한 편 바로 렌더: $id"
            git push origin main && exit 0
            sleep $((5 + RANDOM % 10))
          done
          exit 1
