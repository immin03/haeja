# What Korea Says 롱폼 v2 (미니어처 + 진행자 까치) → /side 검수 대기열
# 수동 실행만: 성우·음악·영상 재료가 다 모인 뒤 ids 를 넣어 돌린다
name: side-long2
on:
  workflow_dispatch:
    inputs:
      ids: { description: '원고 아이디 (scripts/side/specs2, 띄어쓰기 구분)', required: true, default: 'S261029-choco-pie' }
permissions:
  contents: write
concurrency: side-long2
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 도구 설치
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-noto-cjk-extra
          pip install -q numpy scipy pillow
      - name: 음성 캐시
        uses: actions/cache@v4
        with:
          path: scripts/side/.cache2
          key: side2-tts-${{ github.run_id }}
          restore-keys: side2-tts-
      - name: 렌더
        env:
          TYPECAST_API_KEY: ${{ secrets.TYPECAST_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/side/render2.py ${{ github.event.inputs.ids }} --all
      - name: 커밋
        if: always()
        run: |
          git config user.name "valuenote-bot"; git config user.email "bot@valuenote.co.kr"
          # 다른 봇(릴스 등)이 그 사이에 올린 커밋과 부딪히지 않게: 결과물만 따로 두고 최신 main 위에 다시 얹는다
          mkdir -p /tmp/out && cp -r social/side /tmp/out/ && cp social/typecast_usage.json /tmp/out/ 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp -r /tmp/out/side social/ && { cp /tmp/out/typecast_usage.json social/ 2>/dev/null || true; }
            git add -A social/side social/typecast_usage.json 2>/dev/null || git add -A social/side
            git diff --cached --quiet && exit 0
            git commit -qm "사이드 채널 롱폼 v2 $(TZ=Asia/Seoul date '+%F %H:%M')"
            git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
