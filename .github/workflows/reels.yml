# 릴스 자동 생성: 3시간마다 시장 급변을 확인해 릴스 대본을 만들고, 바뀐 대본을 영상으로 렌더해 커밋한다.
# 커밋 → Vercel 배포 → Supabase가 매시 15분에 social/reels/queue.json 을 읽어 게시 대기열에 넣는다.
# 정기 편성 대본(scripts/reels/specs)을 바꿔 푸시해도 바로 렌더된다.
name: reels
on:
  schedule:
    - cron: '50 21 * * *'    # 매일 06:50 KST (바뀐 대본 렌더·대기열 갱신)
    - cron: '40 0,3,6,9,12,15,18 * * *'   # 3시간마다 이슈 확인 (09:40·12:40·15:40·18:40·21:40·00:40·03:40 KST)
  push:
    branches: [main]
    paths: ['scripts/reels/specs/**', 'scripts/reels/engine.py', 'scripts/reels/tts.py', 'scripts/reels/verify.py', 'scripts/reels/korean.py']
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: reels
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 도구 설치
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q sherpa-onnx==1.13.8 soundfile scipy numpy pillow
      - name: 음성 모델 캐시
        uses: actions/cache@v4
        with:
          path: scripts/reels/.cache
          key: tts-supertonic-3-int8-2026-05-11-asr-zipformer-ko
      - name: 이슈 확인 (기준금리 결정·물가 발표·지수·환율·국채 금리 급변 → 하루 1편까지 릴스 대본)
        run: |
          # 처음 켤 때는 이미 지난 발표를 다루지 않도록 표시만 한다
          grep -q '_seeded' social/reels/events_state.json 2>/dev/null && python3 scripts/reels/events.py || python3 scripts/reels/events.py --seed
      - name: 영상 만들기 (음성 검수 포함)
        env:
          TYPECAST_API_KEY: ${{ secrets.TYPECAST_API_KEY }}
        run: python3 scripts/reels/build.py || touch /tmp/voicefail
      - name: 커밋
        run: |
          git config user.name "valuenote-bot"
          git config user.email "bot@valuenote.co.kr"
          git add -A social/reels scripts/reels/events g blog social/typecast_usage.json 2>/dev/null || git add -A social/reels scripts/reels/events g blog
          git diff --cached --quiet && exit 0
          git commit -m "릴스 $(TZ=Asia/Seoul date '+%F %H:%M')"
          git pull --rebase origin main
          git push
      - name: 음성 검수 결과
        run: |
          if [ -f /tmp/voicefail ]; then echo '음성 검수에 실패한 릴스가 있습니다. 위 로그의 ✗ 줄을 확인하세요.'; exit 1; fi
