# What Korea Says — Higgsfield 이미지·영상 생성 + 성우 후보 샘플
# scripts/side/gen/*.json 이 바뀌면 그 작업만, scripts/side/voices_req.json 이 바뀌면 성우 샘플
name: side-gen
on:
  push:
    branches: [main]
    paths: ['scripts/side/gen/*.json', 'scripts/side/voices_req.json', 'scripts/side/voice_tune.py', 'scripts/side/music.py']
  workflow_dispatch:
    inputs:
      files: { description: '작업 파일 이름(확장자 빼고, 띄어쓰기 구분)', required: false, default: '' }
      max_usd: { description: '이번 실행 비용 상한(달러)', required: false, default: '3' }
permissions:
  contents: write
concurrency: side-gen
jobs:
  gen:
    runs-on: ubuntu-24.04  # 2026-10-29 고정: 26 전환 후 브라우저 설치 실패
    timeout-minutes: 120  # 11/13: 커밋 재시도 여유
    env:
      HF_API_KEY: ${{ secrets.HF_API_KEY }}
      HF_API_KEY_ID: ${{ secrets.HF_API_KEY_ID }}
      HF_API_KEY_SECRET: ${{ secrets.HF_API_KEY_SECRET }}
      TYPECAST_API_KEY: ${{ secrets.TYPECAST_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      SIDE_GEN_MAX_USD: ${{ github.event.inputs.max_usd || '3' }}
    steps:
      - name: 디스크 비우기 (2026-11-05 저장소가 커져 러너 디스크가 가득 차 실패)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost && df -h / | tail -1
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: 시작 시각 표시 (실패 시 새 파일만 골라 백업)
        run: touch /tmp/t0
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 도구
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: 대상
        id: pick
        run: |
          f="${{ github.event.inputs.files }}"
          if [ "${{ github.event_name }}" = "push" ]; then f=$(git diff --name-only HEAD~1 HEAD -- 'scripts/side/gen/*.json' | xargs -r -n1 basename | sed 's/\.json$//' | tr '\n' ' '); fi
          echo "files=$f" >> $GITHUB_OUTPUT
          if git diff --name-only HEAD~1 HEAD | grep -q 'scripts/side/voices_req.json'; then echo "voices=1" >> $GITHUB_OUTPUT; fi
          if git diff --name-only HEAD~1 HEAD | grep -q 'scripts/side/voice_tune.py'; then echo "tune=1" >> $GITHUB_OUTPUT; fi
          if git diff --name-only HEAD~1 HEAD | grep -q 'scripts/side/music.py'; then echo "music=1" >> $GITHUB_OUTPUT; fi
      - name: 성우 후보
        if: steps.pick.outputs.voices == '1'
        run: python3 scripts/side/voices.py
      - name: 진행자 목소리 조율
        if: steps.pick.outputs.tune == '1'
        run: python3 scripts/side/voice_tune.py
      - name: 배경음악 후보
        if: steps.pick.outputs.music == '1'
        run: python3 scripts/side/music.py
      - name: 1차 생성 (이미지)
        if: steps.pick.outputs.files != ''
        run: python3 scripts/side/gen.py ${{ steps.pick.outputs.files }}
      - name: 커밋 (이미지가 올라가야 영상 입력 주소가 생긴다)
        run: |
          git config user.name "valuenote-bot"; git config user.email "bot@valuenote.co.kr"
          git add -A social/side; git diff --cached --quiet && exit 0
          git commit -qm "사이드 채널 생성물 $(TZ=Asia/Seoul date '+%F %H:%M')"
          for i in 1 2 3 4 5 6 7 8; do timeout 300 git pull --rebase -X theirs -q && timeout 300 git push -q && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i*10)); done; exit 1
      - name: 2차 생성 (영상)
        if: steps.pick.outputs.files != ''
        run: python3 scripts/side/gen.py ${{ steps.pick.outputs.files }}
      - name: 커밋
        run: |
          git add -A social/side; git diff --cached --quiet && exit 0
          git commit -qm "사이드 채널 생성물(영상) $(TZ=Asia/Seoul date '+%F %H:%M')"
          for i in 1 2 3 4 5 6 7 8; do timeout 300 git pull --rebase -X theirs -q && timeout 300 git push -q && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i*10)); done; exit 1
      - name: 황제의 일기 라이브러리 목록 갱신 (ED 작업일 때)
        if: contains(steps.pick.outputs.files, 'ED')
        run: |
          python3 scripts/side/emperor/library.py build || exit 0
          git add scripts/side/emperor/LIBRARY.json social/side/gen_costs.jsonl 2>/dev/null; git diff --cached --quiet && exit 0
          git commit -qm "황제의 일기 라이브러리 목록 갱신 $(TZ=Asia/Seoul date '+%F %H:%M')"
          for i in 1 2 3 4 5 6 7 8; do timeout 300 git pull --rebase -X theirs -q && timeout 300 git push -q && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i*10)); done; exit 1
      - name: 커밋 실패·시간 초과 대비 — 이번 실행에서 새로 생긴 파일 모으기
        if: failure() || cancelled()
        run: mkdir -p /tmp/rescue && find social/side scripts/side/emperor -type f -newer /tmp/t0 -exec cp --parents {} /tmp/rescue/ \; || true
      - name: 새 파일을 실행 결과물로 14일 보관 (다시 올릴 때 이것을 받아 커밋)
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with: { name: gen-rescue, path: /tmp/rescue, retention-days: 14, if-no-files-found: ignore }
